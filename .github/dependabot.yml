# =============================================================================
# DEPENDABOT — automated dependency updates
# =============================================================================
#
# WHY THIS FILE EXISTS:
#   Every dependency in this repo was last bumped by hand. Five weeks of drift
#   later, govulncheck found ten reachable CVEs in pkg alone and the Security
#   workflow had never once been green. The fix for those CVEs is a one-time
#   event; this file is the mechanism that stops it recurring. Without it, any
#   security fix in this repo has a shelf life measured in weeks.
#
# WHAT IT COVERS:
#   - gomod: all 15 modules in go.work. Go modules are per-directory, so
#     Dependabot needs each one listed — a single root entry would find no
#     go.mod (this is a workspace; there is no root module).
#   - npm: web/ — the React UI, whose lockfile carries advisories that only
#     surface when someone looks.
#   - github-actions: every `uses:` in .github/workflows. This is the entry
#     that would have caught the failure that kept Security red for a month:
#     the pinned trivy-action v0.29.0 referenced aquasecurity/setup-trivy@v0.2.2,
#     a tag upstream deleted, so the job died in "Set up job" in four seconds.
#   - docker / helm / docker-compose: the digest-pinned base images, the infra
#     images in deploy/, the migrate image in the charts, and the compose
#     stack. (Added 2026-10: before that nothing refreshed a single digest pin.)
#   - terraform: provider constraints + .terraform.lock.hcl per root module.
#
# WHY GROUPED UPDATES:
#   15 modules x N dependencies of individual PRs is noise nobody reads, and
#   unread PRs are how drift happens in the first place. Patch and minor
#   updates are grouped per ecosystem into one PR; majors stay separate,
#   because a major is a decision, not a chore.
#
# NOTE ON open-pull-requests-limit: the default is 5 per ecosystem. With 15 Go
# modules that ceiling is hit immediately and the rest go silently unproposed,
# so gomod gets a higher one.
# =============================================================================

version: 2

updates:
  # ---------------------------------------------------------------------------
  # Go modules — one entry, every module directory in go.work.
  # ---------------------------------------------------------------------------
  - package-ecosystem: gomod
    directories:
      - /cli
      - /gen/go
      - /pkg
      - /services/ai-gateway
      - /services/auth
      - /services/bff
      - /services/billing
      - /services/experiment-tracker
      - /services/feature-store
      - /services/inference-gateway
      - /services/model-monitor
      - /services/model-serving
      - /services/notification
      - /services/pipeline-orchestrator
      - /services/registry
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 15
    commit-message:
      prefix: deps
    groups:
      go-minor-and-patch:
        update-types:
          - minor
          - patch

  # ---------------------------------------------------------------------------
  # npm — the React/TypeScript web UI.
  # ---------------------------------------------------------------------------
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps(web)
    groups:
      npm-minor-and-patch:
        update-types:
          - minor
          - patch

  # ---------------------------------------------------------------------------
  # GitHub Actions — the `uses:` pins in .github/workflows.
  # ---------------------------------------------------------------------------
  # Dependabot rewrites the SHA and the trailing `# vX.Y.Z` comment together,
  # so pinning by digest stays pinned by digest — the supply-chain property is
  # preserved, it just stops being a manual chore.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
    groups:
      actions-minor-and-patch:
        update-types:
          - minor
          - patch

  # ---------------------------------------------------------------------------
  # Docker images — base images in the Dockerfiles and the images the raw
  # Kubernetes manifests run.
  # ---------------------------------------------------------------------------
  # WHY: every Dockerfile pins golang:<ver>-alpine and distroless by DIGEST, and
  # the infra manifests pin postgres/redis/nats/ollama/... by tag AND digest. A
  # digest pin is only safe while something refreshes it: without this entry
  # the pins silently go stale and the images keep their CVEs forever.
  # Dependabot's docker ecosystem reads Dockerfiles and, per GitHub's docs,
  # Kubernetes manifests; it rewrites tag and digest together.
  - package-ecosystem: docker
    directories:
      - /services/*
      - /deploy/k8s/infra/*
      - /deploy/k8s/observability/*
      - /deploy/llm
      - /deploy/backup
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    commit-message:
      prefix: deps(docker)
    groups:
      docker-minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # A database major is a data migration (pg_upgrade / dump-restore for
      # Postgres, a licence and persistence-format change for Redis 8), not a
      # dependency bump. Plan those by hand.
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
      - dependency-name: redis
        update-types: ["version-update:semver-major"]

  # ---------------------------------------------------------------------------
  # Helm charts — images referenced in deploy/helm/*/values.yaml (the
  # migrate/migrate initContainer, pinned by digest).
  # ---------------------------------------------------------------------------
  - package-ecosystem: helm
    directories:
      - /deploy/helm/*
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps(helm)
    groups:
      helm-minor-and-patch:
        update-types:
          - minor
          - patch

  # ---------------------------------------------------------------------------
  # docker-compose — the local dev stack (docker-compose.yaml).
  # ---------------------------------------------------------------------------
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps(compose)
    groups:
      compose-minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
      - dependency-name: redis
        update-types: ["version-update:semver-major"]

  # ---------------------------------------------------------------------------
  # pre-commit — the pinned gitleaks hook in .pre-commit-config.yaml.
  # ---------------------------------------------------------------------------
  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    commit-message:
      prefix: deps(pre-commit)

  # ---------------------------------------------------------------------------
  # Terraform — provider constraints AND the committed .terraform.lock.hcl,
  # one entry per root module.
  # ---------------------------------------------------------------------------
  # Majors stay separate (an AWS provider major, e.g. 5 -> 6, renames and
  # removes arguments and needs a reviewed migration).
  - package-ecosystem: terraform
    directories:
      - /deploy/terraform/bootstrap
      - /deploy/terraform/environments/dev
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps(terraform)
    groups:
      terraform-minor-and-patch:
        update-types:
          - minor
          - patch
