# =============================================================================
# CI — build · vet · lint · test, per Go module (matrix)
# =============================================================================
#
# WHY a matrix over modules (not one big `go test ./...`):
#   Forgepoint is a Go-WORKSPACE monorepo: each of pkg, gen/go, and every
#   service under services/* is an INDEPENDENT module with its own go.mod.
#   Running each module as its own matrix leg gives us:
#     - Parallelism: legs run concurrently on separate runners → wall-clock CI
#       stays flat as services are added (N services don't make CI N times slower).
#     - Isolation + signal: a failure names the exact module; a flaky service's
#       test doesn't mask another's. Per-module dependency caching is precise.
#     - Module-boundary enforcement: building a module on its own catches an
#       accidental cross-service import that `go test ./...` from the root would
#       silently allow via the workspace.
#
# WHY this ENHANCES the original ci.yml rather than replacing its intent:
#   The first ci.yml had a single hand-written `pkg` job doing build → vet →
#   test with the race detector and Docker-backed testcontainers. That intent
#   is preserved verbatim; we generalize the one job into a matrix so new
#   modules are covered automatically, and add golangci-lint (the repo ships a
#   .golangci.yml that nothing was running in CI yet). The README CI badge
#   points at this workflow file, so the name and triggers are kept stable.
#
# WHY Docker/testcontainers "just work" here:
#   GitHub-hosted ubuntu runners ship a running Docker daemon. The integration
#   tests use testcontainers-go to spin REAL Postgres/NATS/Redis — no service
#   containers or DinD config needed. That is the whole reason the testing policy says
#   "never mock databases": the same containers run locally and in CI.
# =============================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# SECURITY: least privilege at the top level. CI only needs to read the repo
# (checkout). No job here writes anything back to GitHub, so no token scope is
# elevated. (security.yml elevates id-token/packages per-job where required.)
permissions:
  contents: read

# Cancel a previous run of THIS workflow on the same ref when a new commit
# lands — superseded PR pushes don't keep burning runners. We never cancel on
# main (push to a release branch should always complete its run).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Pin the toolchain to the go.work `go 1.26.0` directive. The Go toolchain
# refuses to build a workspace whose go directive is newer than the toolchain,
# so this MUST track go.work (bump both together on a Go upgrade).
env:
  GO_VERSION: "1.26"

jobs:
  # ---------------------------------------------------------------------------
  # build · vet · test — one leg per module.
  # ---------------------------------------------------------------------------
  test:
    name: ${{ matrix.module }} (build · vet · test)
    runs-on: ubuntu-latest
    strategy:
      # Don't abort sibling legs when one module fails — we want the full
      # matrix of pass/fail in a single CI run, not a race to first red.
      fail-fast: false
      matrix:
        # Every Go module in the workspace. ADD A SERVICE: append its module
        # path here (and to go.work). gen/go is generated but still compiled +
        # vetted so a bad generation is caught before a service consumes it.
        module:
          - pkg
          - gen/go
          - cli
          - services/auth
          - services/registry
          - services/inference-gateway
          - services/pipeline-orchestrator
          - services/feature-store
          - services/experiment-tracker
          - services/billing
          - services/notification
          - services/model-serving
          - services/model-monitor
          - services/ai-gateway
          - services/bff
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      # actions/checkout pinned to a full commit SHA (supply-chain: a moved tag
      # can't swap the action out from under us). Version in the trailing comment.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          # Cache keyed on THIS module's go.sum so each leg has an independent,
          # precise cache (no cross-module cache poisoning / thrash).
          cache-dependency-path: ${{ matrix.module }}/go.sum

      # Compile every package in the module. Fails fast on a broken build
      # before the (slower) vet/test steps run.
      - name: Build
        run: go build ./...

      # `go vet` is the cheap, always-on correctness net (printf format strings,
      # struct tags, lost cancel, etc.). golangci-lint runs vet too, but vet
      # here gives a fast independent signal even if the lint job is skipped.
      - name: Vet
        run: go vet ./...

      # Integration tests use testcontainers; the runner's Docker daemon spins
      # the real Postgres/NATS/Redis. -race instruments memory accesses to catch
      # data races in the concurrent gRPC handlers / NATS consumers. -shuffle
      # randomizes test order to surface hidden inter-test ordering deps.
      - name: Test (race + shuffle)
        run: go test -race -shuffle=on ./...

  # ---------------------------------------------------------------------------
  # golangci-lint — one leg per module, using the repo .golangci.yml.
  # ---------------------------------------------------------------------------
  # Split from the test job so a style nit doesn't block the test signal (and
  # vice-versa) and so the lint cache is independent. The action manages its own
  # golangci-lint binary + result cache, so this is fast.
  lint:
    name: ${{ matrix.module }} (golangci-lint)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # gen/go is intentionally excluded: .golangci.yml already excludes the
        # `gen` dir (generated code is not ours to lint), so a lint leg there
        # would have nothing to do. Every other module in go.work is linted —
        # a gate that covers two modules is not a gate.
        module:
          - pkg
          - cli
          - services/auth
          - services/registry
          - services/inference-gateway
          - services/pipeline-orchestrator
          - services/feature-store
          - services/experiment-tracker
          - services/billing
          - services/notification
          - services/model-serving
          - services/model-monitor
          - services/ai-gateway
          - services/bff
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: ${{ matrix.module }}/go.sum

      # golangci-lint-action v9 understands the repo's golangci-lint v2 config
      # (.golangci.yml has `version: "2"`). `working-directory` scopes the run
      # to one module so the workspace's other modules don't confuse the linter.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2
          working-directory: ${{ matrix.module }}

  # ---------------------------------------------------------------------------
  # web — typecheck + production build of the React/TypeScript UI.
  # ---------------------------------------------------------------------------
  # web/ is 48 tracked files of TypeScript that every Go gate above ignores.
  # Until this job existed no workflow in the repo mentioned node or npm, so
  # `tsc -b && vite build` — the command that produces the UI — had never once
  # been run by CI. A type error or a broken import in the dashboard would have
  # reached main with every check green.
  #
  # There is no test runner in web/package.json, so this job gates what is
  # actually there: the lockfile installs, the project typechecks, and the
  # production bundle builds. That is a real gate, not a placeholder — the
  # build is the artifact users get.
  web:
    name: web (typecheck · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # 22 is the active LTS and is what vite 5 supports; pinned to the
          # major so a Node 23/24 change can't silently alter the bundle.
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      # `npm ci` (not `npm install`): installs exactly the lockfile, fails if
      # package.json and package-lock.json have drifted apart. A CI that can
      # silently resolve a different dependency tree than the developer's is
      # not reproducing anything.
      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # Supply-chain gate for the code that actually ships to a browser.
      #
      # WHY --omit=dev: the build toolchain (vite, esbuild) carries advisories
      # for its DEV SERVER — path traversal reachable only by someone who can
      # reach `vite dev` on a developer's machine. None of it is in the bundle.
      # Gating the whole tree on those would mean either a permanently red job
      # or a `continue-on-error` that trains people to ignore it. Scoping to
      # production dependencies makes the HIGH/CRITICAL threshold enforceable
      # and honest.
      #
      # Known and NOT hidden by this scoping: react-router 6.x carries two
      # MODERATE advisories whose only fix is the 7.x major. Dependabot (see
      # .github/dependabot.yml) opens that PR; taking a breaking router upgrade
      # on a UI with no tests is a reviewed change, not a CI side effect.
      - name: npm audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high
