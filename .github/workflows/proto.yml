# =============================================================================
# PROTO — contract gate: buf lint + buf breaking
# =============================================================================
#
# WHY a dedicated workflow for protos:
#   In Forgepoint protos are the SOURCE OF TRUTH for every API (see proto/ and
#   buf.yaml). A proto change ripples into generated Go in gen/go and across all
#   consuming services. Two failure modes must be gated BEFORE merge:
#     1. Style/consistency drift  → `buf lint` (STANDARD rules, ~40 checks).
#     2. Backward-incompatible API change → `buf breaking` at FILE level (the
#        strictest level: even a field rename, which is wire-compatible, is
#        rejected because it breaks generated Go).
#   This is the "contract test" tier of docs/design/service-architecture.md.
#
# WHY THIS WORKFLOW RUNS ON EVERY PUSH TO MAIN, NOT ONLY ON PROTO CHANGES:
#   The first version of this file was gated on `paths: proto/**` for BOTH
#   triggers and made `buf breaking` pull_request-only. Between June and July
#   2026 three commits changed proto/ and the workflow still recorded ZERO runs
#   (`gh api .../actions/workflows/<id>/runs` → total_count 0), while CI and
#   Security ran on the same pushes. A contract gate that has never executed
#   proves nothing about the contract, and the path filter was the only thing
#   standing between "gate exists" and "gate runs".
#
#   So: push to main runs unconditionally. `buf lint` is a few seconds against
#   ~10 files — the compute saved by the filter was never worth an unverified
#   gate. PRs keep a path filter (there the signal-to-noise tradeoff is real,
#   and a PR that does not touch proto genuinely does not need this).
#
# WHY `buf breaking` NEEDS A DIFFERENT `--against` PER EVENT:
#   "Breaking" is only meaningful relative to what is already shipped.
#     - pull_request: diff against the PR's target branch (origin/<base>) —
#       "would merging this break consumers of main?"
#     - push to main: there is no base branch to diff, so diff against the
#       parent commit — "did what just landed break consumers?" This is the
#       same comparison the Makefile's `proto-breaking` target makes locally.
#   The repo has had zero pull requests to date, so the PR-only version of this
#   job had never executed either. Both paths now exercise.
# =============================================================================

name: Proto

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - "proto/**"
      - ".github/workflows/proto.yml"
  # On-demand: lets a reviewer (or the author) prove the gate works without
  # having to push a proto change.
  workflow_dispatch:

# SECURITY: read-only. The proto gate only reads the repo; it posts no comments
# and pushes nothing.
permissions:
  contents: read

concurrency:
  group: proto-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # Pin the buf CLI so lint/breaking results are reproducible: a new buf release
  # can add rules, and a gate that changes verdict without a code change is not
  # a gate. Bump deliberately.
  BUF_VERSION: 1.72.0

jobs:
  # ---------------------------------------------------------------------------
  # Lint — STANDARD rules over the proto module.
  # ---------------------------------------------------------------------------
  lint:
    name: buf lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # bufbuild/buf-action is the maintained successor to buf-setup-action
      # (which is still on the deprecated Node 20 runtime and has had no release
      # since August 2025). `setup_only` makes it behave exactly like the old
      # setup action — install a pinned buf on PATH — so the explicit `buf`
      # invocations below stay readable and match the Makefile targets.
      - name: Set up buf
        uses: bufbuild/buf-action@8c6a16e16f12ba20b6470afa9c2ba9b5ba8c97c3 # v1.5.0
        with:
          version: ${{ env.BUF_VERSION }}
          setup_only: true

      # The buf module lives in proto/ (buf.yaml is there), so scope the lint to
      # that input. STANDARD lint rules come from proto/buf.yaml.
      - name: Lint
        run: buf lint
        working-directory: proto

  # ---------------------------------------------------------------------------
  # Breaking — diff protos against the right baseline for this event.
  # ---------------------------------------------------------------------------
  breaking:
    name: buf breaking
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # buf breaking materializes the baseline from git history. Full history
          # guarantees both baselines are present: origin/<base> for a PR, and
          # HEAD^ for a push (a default shallow clone has neither).
          fetch-depth: 0

      - name: Set up buf
        uses: bufbuild/buf-action@8c6a16e16f12ba20b6470afa9c2ba9b5ba8c97c3 # v1.5.0
        with:
          version: ${{ env.BUF_VERSION }}
          setup_only: true

      # Resolve the baseline as a buf git input:
      #   PR   → ../.git#branch=<base>,subdir=proto  (what merging would change)
      #   push → ../.git#ref=HEAD^,subdir=proto      (what this push changed)
      #
      # The path is `../.git`, not `.git`: the buf module lives in proto/ so the
      # `buf breaking` step runs with working-directory: proto, and buf resolves
      # a git input relative to the CWD — it does not walk up to find the repo
      # root. The previous `.git#...` form in this file would have died with
      # "could not clone .../proto/.git ... does not appear to be a git
      # repository" the first time it ran. It never ran. The Makefile's
      # proto-breaking target already used ../.git; this now matches it.
      #
      # The first commit in a repo has no HEAD^; skip rather than fail on it.
      - name: Resolve baseline
        id: baseline
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "${EVENT}" = "pull_request" ]; then
            echo "against=../.git#branch=${BASE_REF},subdir=proto" >> "$GITHUB_OUTPUT"
          elif git rev-parse --verify --quiet HEAD^ >/dev/null; then
            echo "against=../.git#ref=HEAD^,subdir=proto" >> "$GITHUB_OUTPUT"
          else
            echo "against=" >> "$GITHUB_OUTPUT"
            echo "No parent commit to diff against; nothing to check." >&2
          fi

      - name: Breaking change check
        if: steps.baseline.outputs.against != ''
        env:
          AGAINST: ${{ steps.baseline.outputs.against }}
        run: buf breaking --against "${AGAINST}"
        working-directory: proto
