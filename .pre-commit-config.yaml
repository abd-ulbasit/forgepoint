# Local secret scanning before a commit exists. Install once per clone:
#   pipx install pre-commit   (or: brew install pre-commit)
#   pre-commit install
# The same gitleaks rules run in CI over the FULL history (security.yml), so
# skipping the hook (git commit --no-verify) only moves the failure to the PR.
# rev is pinned to a commit SHA (tag in the comment); Dependabot's pre-commit
# ecosystem keeps it current.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e # frozen: v8.30.1
    hooks:
      - id: gitleaks
