{{- if .Values.networkPolicy.enabled -}}
# ============================================================================
# NetworkPolicy — zero-trust east-west isolation for the model-serving pods.
# ============================================================================
# By DEFAULT, Kubernetes pod networking is wide open: any pod can reach any other
# pod on any port. A NetworkPolicy flips a workload to default-deny for the
# directions it lists in policyTypes, then re-allows ONLY the explicit rules.
#
# This policy (TIGHTER than fp-auth's — a serving pod's legitimate egress is a
# short list):
#   INGRESS → default-deny, allow only from fp-system (Inference Gateway) and
#             fp-models (intra-namespace peers). The allowed set is driven by
#             .Values.networkPolicy.ingressNamespaces so no namespace is
#             hardcoded here. Nothing outside that list can even open a
#             connection to a model pod.
#   EGRESS  → default-deny, allow only: DNS (resolve service names), the OTel
#             collector (telemetry push), MinIO (object storage — the artifact
#             fetch), and NATS (the lifecycle event bus — main.go SUBSCRIBES to
#             model deploy/promote/archive events to reconcile this pod's loaded
#             model, and /readyz check #2 pings the NATS connection). NOTE vs
#             fp-auth: NO Postgres egress — this service has no DB. Closing egress it
#             doesn't need shrinks the exfiltration surface if a serving pod (which
#             loads third-party model weights) is compromised.
#
# ENFORCEMENT CAVEAT (interview-critical): a NetworkPolicy is only enforced if
# the cluster's CNI supports it (Calico, Cilium, etc.). On a CNI without policy
# support it is silently ignored — present but not enforced. So this is defense
# in depth, not a substitute for authn/authz at the app layer.
#
# DNS GOTCHA: forget the DNS egress rule and the pod can't resolve ANY service
# DNS name, so every outbound connection (including the MinIO fetch) fails with
# NXDOMAIN — a classic self-inflicted outage. We always allow it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "fp-model-serving.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fp-model-serving.labels" . | nindent 4 }}
spec:
  # podSelector scopes this policy to THIS chart's pods (by identity labels).
  podSelector:
    matchLabels:
      {{- include "fp-model-serving.selectorLabels" . | nindent 6 }}
  # Listing both types makes the policy default-deny for BOTH directions; the
  # rules below are the only allowances.
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow gRPC + health traffic from the permitted namespaces only.
    - from:
        {{- range .Values.networkPolicy.ingressNamespaces }}
        - namespaceSelector:
            matchLabels:
              # Relies on the standard kubernetes.io/metadata.name label that the
              # control plane auto-applies to every Namespace (K8s 1.21+). No need
              # to hand-label namespaces.
              kubernetes.io/metadata.name: {{ . }}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.ports.grpc }}
        - protocol: TCP
          port: {{ .Values.ports.health }}
  egress:
    {{- if .Values.networkPolicy.egress.dns.enabled }}
    # DNS to the cluster resolver (kube-dns/CoreDNS in kube-system), UDP+TCP/53.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    {{- end }}
    {{- if .Values.networkPolicy.egress.nats.enabled }}
    # NATS JetStream (the model-lifecycle event bus). main.go subscribes to
    # fp.models.* / fp.pipelines.* deploy/promote/archive events to reconcile the
    # pod's loaded model; /readyz check #2 fails when the NATS connection is down. So
    # this egress is REQUIRED — without it (under an enforcing CNI) the pod connects to
    # NATS at boot only if allowed, and readiness flaps to NotReady on the conn check.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.egress.nats.namespace }}
      ports:
        - protocol: TCP
          port: {{ .Values.networkPolicy.egress.nats.port }}
    {{- end }}
    {{- if .Values.networkPolicy.egress.otlp.enabled }}
    # OTLP/gRPC to the OpenTelemetry Collector (traces + metrics push).
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.egress.otlp.namespace }}
      ports:
        - protocol: TCP
          port: {{ .Values.networkPolicy.egress.otlp.port }}
    {{- end }}
    {{- if .Values.networkPolicy.egress.minio.enabled }}
    # MinIO / S3-compatible object storage (the ONNX artifact fetch). This is the
    # ONE data-store egress model-serving needs — it pulls its model bytes from
    # here at startup. (fp-auth opened Postgres+NATS instead; model-serving needs
    # neither.)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.egress.minio.namespace }}
      ports:
        - protocol: TCP
          port: {{ .Values.networkPolicy.egress.minio.port }}
    {{- end }}
{{- end }}
