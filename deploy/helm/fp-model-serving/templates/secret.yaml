{{- if .Values.secrets.create -}}
# ============================================================================
# Secret — SENSITIVE configuration (object-storage credentials).
# ============================================================================
# ⚠️  PRODUCTION CONTRACT  ⚠️
# This rendered Secret is for LOCAL/DEV clusters ONLY. The values come from
# values.yaml placeholders, which must NEVER hold real credentials in git.
#
# Unlike fp-auth (JWT signing key + DB DSN), model-serving's ONLY secret is the
# OBJECT-STORAGE (MinIO/S3) credential pair the storage adapter uses to pull the
# ONNX artifact. There is no database and no JWT here.
#
# In a real environment, set `secrets.create: false` and supply the Secret
# out-of-band so plaintext credentials never touch the chart or the repo:
#   - External Secrets Operator: an ExternalSecret CR syncs from AWS Secrets
#     Manager / HashiCorp Vault into a K8s Secret named `secrets.existingSecret`.
#   - Sealed Secrets: a SealedSecret CR (safe to commit — encrypted) that the
#     controller decrypts into the real Secret in-cluster.
# Either way the Deployment's envFrom references the SAME name
# (fp-model-serving.secretName), so flipping create on/off needs no other change.
#
# WHY stringData (not data): stringData takes plaintext and Kubernetes
# base64-encodes it for us — no manual `base64` in templates, which is just
# obfuscation (base64 is NOT encryption) and a frequent source of corrupt
# secrets. The keys below become env vars via envFrom (FP_S3_ACCESS_KEY, etc.).
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "fp-model-serving.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fp-model-serving.labels" . | nindent 4 }}
type: Opaque
stringData:
  # MinIO/S3 access key (the "username" half of the credential pair).
  FP_S3_ACCESS_KEY: {{ required "secrets.s3AccessKey is required when secrets.create=true (use an external secret store in prod)" .Values.secrets.s3AccessKey | quote }}
  # MinIO/S3 secret key (the sensitive "password" half).
  FP_S3_SECRET_KEY: {{ required "secrets.s3SecretKey is required when secrets.create=true" .Values.secrets.s3SecretKey | quote }}
{{- end }}
