{{- if .Values.autoscaling.enabled -}}
# ============================================================================
# HorizontalPodAutoscaler (autoscaling/v2) — scale replicas on load.
# ============================================================================
# The HPA controller samples metrics every ~15s and adjusts the Deployment's
# replica count to keep each metric near its target. autoscaling/v2 is the
# stable API that supports MULTIPLE metrics and custom/external metrics (the v1
# API was CPU-only) — that's why we use v2 even for a CPU-only setup, so adding a
# custom metric later needs no API migration.
#
# WHY the Deployment omits `replicas` when this is enabled: if both set the
# count, every `helm upgrade` resets replicas to replicaCount and then the HPA
# corrects it — visible flapping. With the HPA as sole owner, scaling is stable.
#
# MULTI-METRIC SEMANTICS: when several metrics are listed, the
# HPA computes the desired replicas for EACH and takes the MAXIMUM — it scales to
# satisfy the most-pressed metric, never under-provisioning.
#
# ORCHESTRATOR CAVEAT: autoscaling adds READ capacity and warm leader-failover
# standby; it does NOT parallelize saga execution (the elected leader is the sole
# writer). Scale on read/RPC pressure, not on a hope of faster saga throughput.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "fp-pipeline-orchestrator.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fp-pipeline-orchestrator.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "fp-pipeline-orchestrator.fullname" . }}
  minReplicas: {{ .Values.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.maxReplicas }}
  metrics:
    {{- if .Values.autoscaling.targetCPUUtilizationPercentage }}
    # Resource metric: target average CPU utilization as a % of the pod's CPU
    # REQUEST (not limit). This is why requests must be set realistically —
    # they are the denominator of the HPA's utilization math.
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.targetCPUUtilizationPercentage }}
    {{- end }}
    {{- if .Values.autoscaling.targetMemoryUtilizationPercentage }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.targetMemoryUtilizationPercentage }}
    {{- end }}
    {{- with .Values.autoscaling.customMetrics }}
    # Custom/external metrics passed through verbatim. This is the hook for the
    # platform's later autoscaling work (Prometheus-Adapter for gRPC RPS, or KEDA
    # for NATS consumer lag). Example shape is in values.yaml.
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.autoscaling.behavior }}
  # behavior tunes scale-up/down velocity. A long scale-down stabilization window
  # prevents flapping (rapid scale-in then back out) when load is spiky.
  behavior:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
