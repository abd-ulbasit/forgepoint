# ============================================================================
# Deployment — the desired-state controller for the orchestrator pods.
# ============================================================================
# A Deployment manages a ReplicaSet, which manages the Pods. We declare WHAT we
# want (N replicas of this pod spec) and the controller reconciles reality to
# match — including orchestrating rolling updates and self-healing crashed pods.
#
# This mirrors the fp-auth reference Deployment; the hardening below (security
# contexts, probes, spread, rolling strategy) is the baseline every service
# inherits. Saga durability comes from Postgres + leader election (added with the
# repository phase), NOT from the pod lifecycle — so a stateless rolling Deployment
# is correct: a restarted leader resumes a saga from its last durable checkpoint.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "fp-pipeline-orchestrator.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fp-pipeline-orchestrator.labels" . | nindent 4 }}
spec:
  # When the HPA owns scaling, OMIT replicas here. If we always set it, every
  # `helm upgrade` would reset the count to replicaCount and fight the HPA
  # (flapping the pod count on each deploy). So: set replicas only when
  # autoscaling is disabled.
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  # revisionHistoryLimit caps retained old ReplicaSets (for rollback). Default 10
  # is wasteful; 5 is plenty of rollback depth without etcd clutter.
  revisionHistoryLimit: 5
  strategy:
    type: {{ .Values.updateStrategy.type }}
    {{- if eq .Values.updateStrategy.type "RollingUpdate" }}
    rollingUpdate:
      # maxUnavailable: 0 + maxSurge: 1 = surge-then-retire: never dip below
      # desired capacity during a roll, add at most one extra pod at a time.
      maxUnavailable: {{ .Values.updateStrategy.rollingUpdate.maxUnavailable }}
      maxSurge: {{ .Values.updateStrategy.rollingUpdate.maxSurge }}
    {{- end }}
  # selector is IMMUTABLE post-create and must equal the pod template's identity
  # labels — both come from the same helper so they can't drift.
  selector:
    matchLabels:
      {{- include "fp-pipeline-orchestrator.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "fp-pipeline-orchestrator.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        # checksum/config + checksum/secret: hash the ConfigMap/Secret contents
        # into the pod template. WHY: changing a ConfigMap/Secret does NOT by
        # itself restart pods (env vars are read at process start). Embedding the
        # checksum changes the pod template → the Deployment rolls the pods so the
        # new config actually takes effect. This is the standard Helm idiom for
        # "restart on config change".
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if .Values.secrets.create }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
        {{- if .Values.migrations.enabled }}
        # Roll the pods when the SQL changes: the migrations ConfigMap name is
        # stable, so without this hash an edited migration would NOT trigger a new
        # rollout (and thus would never re-run the migrate initContainer). Hashing
        # the rendered ConfigMap into the pod template makes a SQL change a pod
        # template change -> new ReplicaSet -> migrate step runs again.
        checksum/migrations: {{ include (print $.Template.BasePath "/migrations-configmap.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "fp-pipeline-orchestrator.serviceAccountName" . }}
      # Belt-and-suspenders: also deny token automount at the pod level (the SA
      # already defaults it). The orchestrator doesn't talk to the K8s API.
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # Pod-level hardening (runAsNonRoot, nonroot UID, fsGroup, seccomp).
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      # Must exceed the gRPC graceful-drain timeout (25s) so in-flight RPCs
      # finish before SIGKILL — see pkg/grpcutil drain logic.
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- /*
        SELF-CONTAINED DB MIGRATIONS (migrate initContainer).
        --------------------------------------------------------------------------
        Gate on BOTH:
          - migrations.enabled (operator opt-out / non-Postgres services), AND
          - a DSN actually being available: either the chart creates the Secret
            with secrets.databaseUrl, OR an externally-managed existingSecret is
            named. This second guard means turning migrations on without a
            database can't emit a half-broken initContainer.

        FLOW:  initContainer (migrate up) --completes--> app container starts
               If migrate fails (bad SQL, unreachable DB), the initContainer
               fails, the Pod stays in Init:Error, and the app NEVER starts
               against an un-migrated schema. That gating is the whole point of
               using an initContainer instead of a side Job.

        IDEMPOTENCY: golang-migrate tracks the applied version in schema_migrations.
        A re-deploy with no new files prints "no change" and exits 0 -- safe to run
        on every rollout and every replica (it serializes on the DB).
      */}}
      {{- if and .Values.migrations.enabled (or (and .Values.secrets.create .Values.secrets.databaseUrl) (and (not .Values.secrets.create) .Values.secrets.existingSecret)) }}
      initContainers:
        - name: migrate
          image: "{{ .Values.migrations.image.repository }}:{{ .Values.migrations.image.tag }}"
          imagePullPolicy: {{ .Values.migrations.image.pullPolicy }}
          # Same hardened context as the app container. The migrate image is
          # Alpine-based and runs fine as the nonroot UID -- it only needs network
          # egress to Postgres and read access to the mounted (world-readable)
          # ConfigMap. readOnlyRootFilesystem is safe: migrate writes nothing to
          # its own filesystem.
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          # WHY /bin/sh -c (not the image's `migrate` entrypoint directly): we want
          # the DSN to come from the Secret WITHOUT it appearing in the rendered
          # pod spec (a -database="postgres://user:pass@..." arg would show up in
          # `kubectl describe pod`). So we inject it as the DATABASE_URL env var via
          # secretKeyRef and let the shell expand "$DATABASE_URL" at runtime. The
          # Alpine base provides /bin/sh; distroless app image does not -- which is
          # exactly why migration can't run in the app container.
          command:
            - /bin/sh
            - -c
            - |
              set -e
              echo "[migrate] applying migrations from /migrations ..."
              migrate -path=/migrations -database="$DATABASE_URL" up
              echo "[migrate] done."
          env:
            # Pull the DSN from the SAME Secret the app envFrom's, but expose it
            # under the bare name the migrate CLI documents (DATABASE_URL), mapping
            # from the service's FP_DATABASE_URL key.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "fp-pipeline-orchestrator.secretName" . }}
                  key: FP_DATABASE_URL
          resources:
            {{- toYaml .Values.migrations.resources | nindent 12 }}
          volumeMounts:
            # The chart's migrations/*.sql, surfaced read-only at /migrations.
            - name: migrations
              mountPath: /migrations
              readOnly: true
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: {{ include "fp-pipeline-orchestrator.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # Container-level hardening (no priv-esc, read-only rootfs, drop ALL caps).
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: grpc
              containerPort: {{ .Values.ports.grpc }}
              protocol: TCP
            - name: health
              containerPort: {{ .Values.ports.health }}
              protocol: TCP
          # envFrom pulls ALL keys from the ConfigMap (non-secret) and the Secret
          # (sensitive) as env vars in one shot — the service reads FP_* from env.
          # Order matters: Secret last so a secret key would win on a name clash
          # (there are none here, but the precedence is intentional).
          envFrom:
            - configMapRef:
                name: {{ include "fp-pipeline-orchestrator.fullname" . }}
            - secretRef:
                name: {{ include "fp-pipeline-orchestrator.secretName" . }}
          # PROBES — all hit the HTTP health port.
          #   liveness  → /healthz: process-alive only; failure RESTARTS the pod.
          #   readiness → /readyz : real dependency checks; failure pulls the pod
          #               from Service endpoints (no traffic) without restarting.
          #   startup   → guards a slow cold start so liveness doesn't kill a pod
          #               that's merely still booting.
          {{- if .Values.probes.startup.enabled }}
          startupProbe:
            httpGet:
              path: {{ .Values.probes.startup.path }}
              port: health
            initialDelaySeconds: {{ .Values.probes.startup.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.startup.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
          {{- end }}
          {{- if .Values.probes.liveness.enabled }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: health
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          {{- end }}
          {{- if .Values.probes.readiness.enabled }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: health
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          # readOnlyRootFilesystem: true means the container CANNOT write to its
          # own filesystem. Mount a small writable emptyDir at /tmp for anything
          # that needs scratch space (TLS cache, temp files). RAM-backed, ephemeral.
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if and .Values.migrations.enabled (or (and .Values.secrets.create .Values.secrets.databaseUrl) (and (not .Values.secrets.create) .Values.secrets.existingSecret)) }}
        # The migrations ConfigMap (the chart's migrations/*.sql) mounted into the
        # migrate initContainer at /migrations. defaultMode 0444 = world-readable,
        # read-only -- the nonroot migrate process can read it without owning it.
        - name: migrations
          configMap:
            name: {{ include "fp-pipeline-orchestrator.fullname" . }}-migrations
            defaultMode: 0444
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # topologySpreadConstraints — spread replicas across nodes/zones so one
      # failure domain can't host a disproportionate share of pods. The label
      # selector is injected from the chart's selector labels so it always
      # targets exactly this workload's pods.
      {{- if .Values.topologySpread.enabled }}
      topologySpreadConstraints:
        {{- range .Values.topologySpread.constraints }}
        - maxSkew: {{ .maxSkew }}
          topologyKey: {{ .topologyKey }}
          whenUnsatisfiable: {{ .whenUnsatisfiable }}
          labelSelector:
            matchLabels:
              {{- include "fp-pipeline-orchestrator.selectorLabels" $ | nindent 14 }}
        {{- end }}
      {{- end }}
