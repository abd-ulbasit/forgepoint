{{- if .Values.secrets.create -}}
# ============================================================================
# Secret — SENSITIVE configuration (the Postgres DSN with password).
# ============================================================================
# ⚠️  PRODUCTION CONTRACT  ⚠️
# This rendered Secret is for LOCAL/DEV clusters ONLY. The value comes from
# values.yaml placeholders, which must NEVER hold real credentials in git.
#
# In a real environment, set `secrets.create: false` and supply the Secret
# out-of-band so plaintext credentials never touch the chart or the repo:
#   - External Secrets Operator: an ExternalSecret CR syncs from AWS Secrets
#     Manager / HashiCorp Vault into a K8s Secret named `secrets.existingSecret`.
#   - Sealed Secrets: a SealedSecret CR (safe to commit — encrypted) that the
#     controller decrypts into the real Secret in-cluster.
# Either way the Deployment's envFrom references the SAME name
# (fp-pipeline-orchestrator.secretName), so flipping create on/off needs no other
# change.
#
# WHY only FP_DATABASE_URL here (and no FP_JWT_SECRET, unlike fp-auth): the
# orchestrator VALIDATES JWTs with the shared validator — it never MINTS tokens, so
# it holds no signing key. The only sensitive value it needs is the Postgres DSN
# for its own `fp_pipeline` database (database-per-service).
#
# WHY stringData (not data): stringData takes plaintext and Kubernetes
# base64-encodes it for us — no manual `base64` in templates, which is just
# obfuscation (base64 is NOT encryption) and a frequent source of corrupt
# secrets. The key below becomes an env var via envFrom (FP_DATABASE_URL).
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "fp-pipeline-orchestrator.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fp-pipeline-orchestrator.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Full Postgres DSN; the password is the sensitive part. Database "fp_pipeline".
  FP_DATABASE_URL: {{ required "secrets.databaseUrl is required when secrets.create=true" .Values.secrets.databaseUrl | quote }}
{{- end }}
