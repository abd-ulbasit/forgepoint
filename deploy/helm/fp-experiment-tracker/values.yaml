# ============================================================================
# fp-experiment-tracker — default values
# ============================================================================
# This chart MIRRORS the reference values file (fp-auth). Everything the
# templates render is driven from here so the manifests stay declarative and
# nothing is hardcoded. Override per-environment with `-f values-prod.yaml` or
# `--set key=value`.
#
# SERVICE SHAPE (read before tuning resources / egress below):
#   Experiment Tracker is the EVENT-DRIVEN service: producers fire-and-forget
#   metric/run events onto NATS JetStream, and this service runs an async batch
#   consumer that buffers points and flushes them transactionally to Postgres
#   (database "fp_experiment"). Its data stores are therefore Postgres + NATS
#   ONLY — there is NO Redis (the idempotency store is a Postgres table here, per
#   the platform design) and NO MinIO (run "artifacts" are free-form JSON kept in
#   Postgres, not blob storage). The NetworkPolicy egress below opens exactly
#   those two stores plus DNS + OTLP, and nothing more.
#
# SECURITY CONTRACT (read this before touching `secrets:` below):
#   The plaintext secret values in this file are DEV-ONLY placeholders so the
#   chart renders and runs on a local Kind cluster. In any real environment the
#   Secret is produced by External Secrets Operator (pulls from AWS Secrets
#   Manager / Vault) or Sealed Secrets — NOT from committed values. See
#   `secrets.create` and templates/secret.yaml for how to turn the in-chart
#   Secret off and point at an externally-managed one.
# ============================================================================

# replicaCount: 2 is the floor for a stateless HA service. Two replicas means a
# single node drain or pod eviction never takes the service fully down, and the
# PodDisruptionBudget (minAvailable: 1) can always be satisfied. When autoscaling
# is enabled the HPA owns the replica count and this value is ignored.
#
# NOTE on the async consumer: each replica joins the SAME NATS JetStream durable
# consumer (a queue/consumer group), so JetStream load-balances batches across
# replicas without double-processing — scaling out increases ingestion
# throughput, it does not duplicate work.
replicaCount: 2

image:
  repository: ghcr.io/abd-ulbasit/forgepoint/experiment-tracker
  # tag "" → the chart falls back to Chart.appVersion (see _helpers "image").
  # Pin an explicit immutable tag (git SHA or semver) in prod; never :latest,
  # which breaks reproducibility and defeats rollbacks.
  tag: ""
  # IfNotPresent: don't re-pull an image the node already has (faster, fewer
  # registry round-trips). Use Always only for mutable dev tags.
  pullPolicy: IfNotPresent

# imagePullSecrets: names of pre-existing docker-registry Secrets for private
# registries. Empty for public ghcr; populated in prod from a registry secret.
imagePullSecrets: []

# nameOverride / fullnameOverride let an operator rename the release-derived
# resource names without editing templates (see _helpers "fullname").
nameOverride: ""
fullnameOverride: ""

# ----------------------------------------------------------------------------
# Ports — two distinct listeners (see services/experiment-tracker/cmd/server/main.go).
#   grpc:   HTTP/2, the actual ExperimentTrackerService API.
#   health: HTTP/1.1, serves /healthz, /readyz, and /metrics. Kept on a separate
#           port because gRPC (HTTP/2) and kubelet probes (HTTP/1.1) cannot share
#           one net.Listener.
# These names ("grpc", "health") are referenced by service.yaml, the probes, and
# the ServiceMonitor — change them here and they propagate everywhere.
# ----------------------------------------------------------------------------
ports:
  grpc: 9090
  health: 8080

service:
  type: ClusterIP
  annotations: {}

# ----------------------------------------------------------------------------
# Non-secret configuration → rendered into a ConfigMap, injected via envFrom.
# These map 1:1 to FP_* env vars the service reads (pkg/config BaseConfig +
# ExperimentTrackerConfig). The service prefixes every env var with FP_
# (config.Load[ExperimentTrackerConfig]("FP")). DATABASE_URL is NOT here — it is
# a secret (the DSN carries the password); see `secrets:` below.
# ----------------------------------------------------------------------------
config:
  # FP_ENV labels telemetry/logs with the deployment environment.
  env: "local"
  logLevel: "info"
  # In-cluster service DNS. fp-infra is the namespace hosting shared infra
  # (NATS, Postgres, OTel collector) per the namespace map in deploy/istio/00-namespaces.yaml.
  otelEndpoint: "otel-collector.fp-infra.svc.cluster.local:4317"
  # NATS JetStream is LOAD-BEARING for this service (not just for events emitted
  # on success): the async batch-ingestion consumer SUBSCRIBES here. Without NATS
  # reachable, ingestion stalls — hence NATS egress is mandatory below.
  natsUrl: "nats://nats.fp-infra.svc.cluster.local:4222"
  # Extra free-form non-secret env keys (rendered into the ConfigMap as-is).
  # Keys are used verbatim — DO NOT prefix with FP_ here unless the service
  # actually reads that prefix; mirror existing FP_* naming. The service reads
  # FP_OTEL_INSECURE (plaintext OTLP for local dev); set "false" in prod via the
  # values-prod override so traces/metrics are not sent in the clear.
  extraEnv:
    FP_OTEL_INSECURE: "true"

# ----------------------------------------------------------------------------
# Secrets — DEV placeholders only. See the SECURITY CONTRACT at the top.
#   secrets.create: true  → chart renders templates/secret.yaml from the values
#                           below. Convenient for local Kind; NEVER commit real
#                           values here.
#   secrets.create: false → chart renders NO Secret. You must provide a Secret
#                           named `secrets.existingSecret` out-of-band (External
#                           Secrets / Sealed Secrets / kubectl). The Deployment
#                           still envFrom's it.
#
# This service does NOT MINT JWTs (auth is the sole minter), but it MUST VERIFY
# caller JWTs in-process for its auth interceptor (design D2 — local HMAC verify,
# no per-RPC hop to auth). That verification needs the SAME shared signing key
# auth signs with, so this service carries an FP_JWT_SECRET too — identical key,
# different role (verify, not mint). It therefore needs TWO secrets: the shared
# JWT signing key and its own Postgres DSN.
# ----------------------------------------------------------------------------
secrets:
  create: true
  # When create=false, the Deployment envFrom's this externally-managed Secret.
  # Defaults to the chart's fullname when empty (see _helpers "secretName").
  existingSecret: ""
  # DEV-ONLY value. Override via --set or a non-committed -f secrets.local.yaml.
  # The HMAC-SHA256 key the auth interceptor uses to VERIFY caller JWTs locally.
  # It MUST be the SAME value as fp-auth's secrets.jwtSecret (auth signs with it;
  # this service verifies with it) and >= 32 bytes of high-entropy data in prod
  # (pkg/auth rejects shorter keys at startup). The service refuses to start if
  # unset (FP_JWT_SECRET is required). In prod this comes from a shared external
  # secret store entry, never this file.
  # EMPTY BY DEFAULT (fail-closed): the secret template guard rejects an empty,
  # short (<32B), or the old dev-only placeholder key, so `helm install` ERRORS
  # until you supply a real key (--set, a non-committed -f, or secrets.existingSecret).
  jwtSecret: ""
  # DEV-ONLY value. Override via --set or a non-committed -f secrets.local.yaml.
  # Full Postgres DSN the service reads as FP_DATABASE_URL. Points at the
  # per-service database "fp_experiment" on the shared Postgres in fp-infra. In
  # prod the password component comes from a managed secret store, not this file.
  databaseUrl: "postgres://experiment:dev-only-change-me@postgres.fp-infra.svc.cluster.local:5432/fp_experiment?sslmode=disable"

# ----------------------------------------------------------------------------
# Migrations — self-contained schema migrations via a migrate initContainer.
# ----------------------------------------------------------------------------
# WHY this block exists: the service's distroless runtime image bakes /migrations
# but has no shell and no migrate binary, so it cannot apply migrations itself.
# When `migrations.enabled` is true, the Deployment runs a golang-migrate
# initContainer BEFORE the app container starts. That initContainer mounts the
# migrations-configmap.yaml (the chart's migrations/*.sql) at /migrations and runs
# `migrate up`, so a fresh database is schema-ready before any traffic. The step
# is IDEMPOTENT: golang-migrate records the highest applied version in a
# schema_migrations table, so on a re-deploy with no new files it prints
# "no change" and exits 0 (no-op). Set enabled=false for services with no Postgres
# (inference-gateway, model-serving), or when you run migrations out-of-band (a
# separate Job / GitOps migration step).
#
# DSN SOURCE: the initContainer reads the SAME Postgres DSN the app uses — the
# FP_DATABASE_URL key from the service Secret, surfaced as the DATABASE_URL env var
# the migrate CLI expects. No second copy of the credential; one Secret feeds both
# the app and the migrator.
migrations:
  # Default true for Postgres-backed services. The initContainer ALSO self-gates
  # on a DSN being available (secrets.databaseUrl set, or an existingSecret), so
  # enabling this without a database can't render a broken initContainer.
  enabled: true
  image:
    # golang-migrate official image. Alpine-based, so it has /bin/sh (needed to
    # expand the DSN from env without baking it into the pod spec) and the
    # `migrate` binary on PATH. Pinned to an immutable tag for reproducible
    # rollouts — bump deliberately, never track a moving tag.
    repository: migrate/migrate
    tag: v4.18.3
    pullPolicy: IfNotPresent
  # Modest resources: the migrate step is short-lived and IO-light. Requests are
  # tiny so it never blocks scheduling; limits cap a pathological migration.
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 128Mi

# ----------------------------------------------------------------------------
# Resources — requests AND limits both set (a "Guaranteed" QoS-friendly shape).
#   requests = what the scheduler reserves; sets the floor and drives HPA math.
#   limits   = the ceiling; CPU is throttled, memory OOM-kills above it.
# Experiment Tracker buffers metric POINTS in memory between flushes (the async
# batch consumer), and ingestion is bursty (a training run can emit thousands of
# scalars). So it is given more headroom than auth: a higher memory ceiling for
# the in-flight buffer and more CPU for batch (de)serialization + bulk inserts.
# memory request==limit avoids OOM surprises under burst; CPU limit > request
# lets short ingestion spikes use idle node CPU. Tune from real RED metrics.
# ----------------------------------------------------------------------------
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

# ----------------------------------------------------------------------------
# Autoscaling — HPA. Disabled by default; replicaCount governs when off.
# When enabled the HPA, not replicaCount, owns the replica number.
# `customMetrics` is wired for the Prometheus-Adapter / KEDA path the platform
# uses later. For THIS service the natural custom signal is NATS JetStream
# CONSUMER LAG (pending messages on the ingestion stream) via KEDA — when the
# producers outpace ingestion, lag rises and we scale out consumers. See
# templates/hpa.yaml; add it under customMetrics when KEDA is wired.
# ----------------------------------------------------------------------------
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70
  # Optional memory target; null/omit to disable the memory metric.
  targetMemoryUtilizationPercentage: 80
  # Extra metrics passed through verbatim into the HPA spec.metrics list
  # (autoscaling/v2). For experiment-tracker the canonical custom metric is NATS
  # consumer lag (external metric exposed by KEDA / Prometheus-Adapter):
  #   - type: External
  #     external:
  #       metric:
  #         name: nats_jetstream_consumer_num_pending
  #       target:
  #         type: AverageValue
  #         averageValue: "1000"
  customMetrics: []
  # Scaling behavior — conservative scale-down to avoid flapping (thundering herd
  # of pod churn). Tune per service SLO.
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30

# PodDisruptionBudget — protects availability during VOLUNTARY disruptions only
# (node drains, cluster upgrades), NOT crashes. minAvailable: 1 lets the cluster
# evict at most (replicas-1) pods at once, so a drain never zeroes the service.
podDisruptionBudget:
  enabled: true
  minAvailable: 1

# ServiceAccount — own identity per service (least privilege, audit trail).
serviceAccount:
  create: true
  name: ""
  annotations: {}
  # automountServiceAccountToken: false — experiment-tracker does NOT call the
  # K8s API, so it has no reason to carry a mountable API token. Mounting one
  # needlessly widens blast radius if the pod is compromised (token → API
  # server). Flip to true only for a service that genuinely uses the in-cluster
  # K8s client.
  automountServiceAccountToken: false

# ----------------------------------------------------------------------------
# Pod-level security context — the non-negotiable hardened baseline. Applied to
# every service. These satisfy the "restricted" Pod Security Standard.
# ----------------------------------------------------------------------------
podSecurityContext:
  # runAsNonRoot makes the kubelet REFUSE to start the pod if the image's user
  # resolves to UID 0 — a guard against an accidentally-root image.
  runAsNonRoot: true
  # 65532 = the "nonroot" UID/GID baked into gcr.io/distroless/* base images,
  # which our multi-stage Dockerfile uses. Matches the image's filesystem owner.
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  # seccompProfile RuntimeDefault → the container runtime's default syscall
  # filter (blocks ~44 dangerous syscalls). Cheap, strong kernel-surface
  # reduction; required by the restricted PSS.
  seccompProfile:
    type: RuntimeDefault

# Container-level security context — defense in depth on top of the pod context.
containerSecurityContext:
  allowPrivilegeEscalation: false  # blocks setuid/gainprivs (no sudo-up inside)
  readOnlyRootFilesystem: true     # immutable rootfs; tamper-resistant, forces
                                   # explicit emptyDir for any writable path
  runAsNonRoot: true
  runAsUser: 65532
  capabilities:
    # Drop ALL Linux capabilities. A network service needs none — it binds a
    # high port (>1024) and does no privileged kernel ops. Least privilege.
    drop:
      - ALL

# ----------------------------------------------------------------------------
# Rolling update strategy — zero-downtime deploys for a stateless service.
#   maxUnavailable: 0 → never drop below desired count during a roll (no capacity
#                       dip; the PDB also enforces this for disruptions).
#   maxSurge: 1       → bring up one extra new pod, wait for it Ready, then retire
#                       an old one. Bounded extra cost (one pod) per step.
# ----------------------------------------------------------------------------
updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 0
    maxSurge: 1

# ----------------------------------------------------------------------------
# Probes — liveness on /healthz (process-alive only), readiness on /readyz
# (real dependency checks: DB ping, and once wired the NATS connection). Both hit
# the HTTP health port. Tunable so each service can match its own startup
# profile. startupProbe shields slow cold starts from premature liveness
# restarts.
# ----------------------------------------------------------------------------
probes:
  liveness:
    enabled: true
    path: /healthz
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3
  readiness:
    enabled: true
    path: /readyz
    initialDelaySeconds: 3
    periodSeconds: 5
    timeoutSeconds: 2
    failureThreshold: 2
  startup:
    enabled: true
    path: /healthz
    initialDelaySeconds: 0
    periodSeconds: 3
    # 30 * 3s = 90s budget for the process to come up before liveness engages.
    failureThreshold: 30
    timeoutSeconds: 2

# ----------------------------------------------------------------------------
# topologySpreadConstraints — spread replicas across failure domains so a single
# node/zone loss can't take out a disproportionate share of pods. whenUnsatisfiable
# ScheduleAnyway keeps scheduling possible on small/single-zone clusters (Kind)
# while still preferring spread. The selector is injected by the template from the
# chart's standard selector labels.
# ----------------------------------------------------------------------------
topologySpread:
  enabled: true
  constraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: ScheduleAnyway

# Generic scheduling knobs, passed through untouched.
nodeSelector: {}
tolerations: []
affinity: {}

# Extra pod annotations/labels (merged into pod template metadata).
podAnnotations: {}
podLabels: {}

# terminationGracePeriodSeconds — must exceed the gRPC drain timeout (25s in
# pkg/grpcutil) so in-flight RPCs finish before SIGKILL. 30s gives 5s slack.
# (The async consumer also gets this window to flush its in-memory buffer and
# ACK/NAK in-flight batches before the process exits.)
terminationGracePeriodSeconds: 30

# ----------------------------------------------------------------------------
# ServiceMonitor (Prometheus Operator CRD) — DISABLED by default ON PURPOSE.
#
# Forgepoint's canonical metrics path is OTLP PUSH to the OTel Collector, which
# Prometheus then scrapes (see pkg/observability/setup.go). So there is normally
# NO per-pod /metrics endpoint to scrape. This ServiceMonitor exists for the
# alternative setup where a service is configured to expose /metrics directly on
# the health port (the prometheus.yml dev scrape config assumes this). Enable it
# only when you've turned on the in-process Prometheus exporter for the service.
# Guarded so `helm template` never emits a ServiceMonitor referencing a CRD the
# cluster may not have.
# ----------------------------------------------------------------------------
serviceMonitor:
  enabled: false
  # path/port of the metrics endpoint when enabled.
  path: /metrics
  portName: health
  interval: 30s
  scrapeTimeout: 10s
  # Extra labels so a Prometheus Operator with a label selector picks this up
  # (e.g. release: kube-prometheus-stack).
  labels: {}

# ----------------------------------------------------------------------------
# NetworkPolicy — default-deny ingress, allow only what the service needs.
# Zero-trust east-west: even inside the cluster, only fp-system callers reach
# experiment-tracker, and it may only egress to DNS, Postgres, NATS, and the
# OTel collector — the EXACT set of stores this service uses. No Redis egress (it
# uses none) and no MinIO egress (artifacts are JSON in Postgres, not blobs).
# Disable on clusters whose CNI doesn't enforce NetworkPolicy (it becomes a
# silent no-op there anyway).
# ----------------------------------------------------------------------------
networkPolicy:
  enabled: true
  # Namespaces allowed to send INGRESS to experiment-tracker. fp-system holds the
  # platform services (gateway, pipeline-orchestrator, other producers) that call
  # ExperimentTrackerService.
  ingressNamespaces:
    - fp-system
  # Egress allow-list. dns is special-cased to the kube-system resolver.
  egress:
    dns:
      enabled: true
    postgres:
      enabled: true
      namespace: fp-infra
      port: 5432
    nats:
      enabled: true
      namespace: fp-infra
      port: 4222
    otlp:
      enabled: true
      namespace: fp-infra
      port: 4317
