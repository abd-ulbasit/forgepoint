{{- if .Values.secrets.create -}}
# ============================================================================
# Secret — SENSITIVE configuration (shared JWT signing key + Postgres DSN).
# ============================================================================
# NOTE vs the fp-auth reference: this service does NOT MINT JWTs — auth is the
# sole minter. But it MUST VERIFY caller JWTs in-process for its auth interceptor
# (design D2 — local HMAC verify, no per-RPC hop to auth), so it carries the SAME
# FP_JWT_SECRET auth signs with (identical key, verify-only role). Both sensitive
# values — the shared JWT key and the Postgres DSN whose password must not sit in
# a plaintext ConfigMap — live here in the Secret.
# ⚠️  PRODUCTION CONTRACT  ⚠️
# This rendered Secret is for LOCAL/DEV clusters ONLY. The values come from
# values.yaml placeholders, which must NEVER hold real credentials in git.
#
# In a real environment, set `secrets.create: false` and supply the Secret
# out-of-band so plaintext credentials never touch the chart or the repo:
#   - External Secrets Operator: an ExternalSecret CR syncs from AWS Secrets
#     Manager / HashiCorp Vault into a K8s Secret named `secrets.existingSecret`.
#   - Sealed Secrets: a SealedSecret CR (safe to commit — encrypted) that the
#     controller decrypts into the real Secret in-cluster.
# Either way the Deployment's envFrom references the SAME name
# (fp-experiment-tracker.secretName), so flipping create on/off needs no other change.
#
# WHY stringData (not data): stringData takes plaintext and Kubernetes
# base64-encodes it for us — no manual `base64` in templates, which is just
# obfuscation (base64 is NOT encryption) and a frequent source of corrupt
# secrets. The keys below become env vars via envFrom (FP_JWT_SECRET,
# FP_DATABASE_URL).
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "fp-experiment-tracker.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fp-experiment-tracker.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Shared HMAC-SHA256 signing key — the auth interceptor verifies caller JWTs
  # with it (same value auth signs with). The service refuses to start if unset
  # (FP_JWT_SECRET is required) and pkg/auth rejects keys shorter than 32 bytes.
  FP_JWT_SECRET: {{ required "secrets.jwtSecret is required when secrets.create=true (use an external secret store in prod; must match fp-auth's jwtSecret)" .Values.secrets.jwtSecret | quote }}
  # Full Postgres DSN (points at database "fp_experiment"); the password is the
  # sensitive part. The service reads it as FP_DATABASE_URL.
  FP_DATABASE_URL: {{ required "secrets.databaseUrl is required when secrets.create=true" .Values.secrets.databaseUrl | quote }}
{{- end }}
