{{- if .Values.secrets.create -}}
# ============================================================================
# Secret — SENSITIVE configuration (Postgres DSN + Redis URL, both with creds).
# ============================================================================
# ⚠️  PRODUCTION CONTRACT  ⚠️
# This rendered Secret is for LOCAL/DEV clusters ONLY. The values come from
# values.yaml placeholders, which must NEVER hold real credentials in git.
#
# In a real environment, set `secrets.create: false` and supply the Secret
# out-of-band so plaintext credentials never touch the chart or the repo:
#   - External Secrets Operator: an ExternalSecret CR syncs from AWS Secrets
#     Manager / HashiCorp Vault into a K8s Secret named `secrets.existingSecret`.
#   - Sealed Secrets: a SealedSecret CR (safe to commit — encrypted) that the
#     controller decrypts into the real Secret in-cluster.
# Either way the Deployment's envFrom references the SAME name
# (fp-model-monitor.secretName), so flipping create on/off needs no other change.
#
# NOTE vs fp-auth: model-monitor does NOT MINT tokens (only the auth service does),
# but it MUST VERIFY them — the shared gRPC auth interceptor validates every incoming
# JWT locally (HS256, design D2) against FP_JWT_SECRET, the SAME signing key the auth
# service signs with. So FP_JWT_SECRET is a SECRET here too (it can forge tokens for
# the whole platform if leaked), rendered into this Secret and never the ConfigMap.
# Its other sensitive surface is the Postgres DSN (fp_monitor) and the Redis URL (the
# live-window + retrain-gate store), both of which embed a password in any real deploy.
#
# WHY stringData (not data): stringData takes plaintext and Kubernetes
# base64-encodes it for us — no manual `base64` in templates, which is just
# obfuscation (base64 is NOT encryption) and a frequent source of corrupt
# secrets. The keys below become env vars via envFrom (FP_DATABASE_URL, etc.).
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "fp-model-monitor.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fp-model-monitor.labels" . | nindent 4 }}
type: Opaque
stringData:
  # HMAC-SHA256 signing key the shared auth interceptor VERIFIES incoming JWTs with
  # (design D2 — local in-process verify, no call to the auth service). MUST equal the
  # auth service's signing key and be >= 32 bytes; the service refuses to start if unset
  # (config required:"true") or too short (pkg/auth.NewJWTValidator). Surfaced as the
  # FP_JWT_SECRET env var via the Deployment's envFrom secretRef.
  FP_JWT_SECRET: {{ include "fp-model-monitor.validateJwtSecret" . | quote }}
  # Full Postgres DSN; the password is the sensitive part. Database is fp_monitor.
  FP_DATABASE_URL: {{ required "secrets.databaseUrl is required when secrets.create=true" .Values.secrets.databaseUrl | quote }}
  # Redis URL for the live sliding-window store + retrain-gate. Sensitive because
  # a real URL embeds a password (redis://:password@host:6379).
  FP_REDIS_URL: {{ required "secrets.redisUrl is required when secrets.create=true" .Values.secrets.redisUrl | quote }}
{{- end }}
