# ============================================================================
# ConfigMap — NON-SECRET environment configuration.
# ============================================================================
# These keys are mapped into the container as env vars via `envFrom` in the
# Deployment. The service reads them with the FP_ prefix (config.Load[
# MonitorConfig]("FP") → FP_PORT, FP_GRPC_PORT, FP_RETRAIN_COOLDOWN, ...). Keep
# ONLY non-sensitive values here — a ConfigMap is stored in plaintext in etcd and
# readable by anyone with get on ConfigMaps in the namespace. Secrets
# (DB password, Redis password) live in the Secret.
#
# WHY ports come from values, not hardcoded: the container, the Service, and the
# probes must all agree on the port numbers; sourcing them from one place
# (.Values.ports) keeps them in lockstep.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "fp-model-monitor.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fp-model-monitor.labels" . | nindent 4 }}
data:
  # Ports — stringified because ConfigMap values are always strings.
  FP_PORT: {{ .Values.ports.health | quote }}
  FP_GRPC_PORT: {{ .Values.ports.grpc | quote }}
  # Observability + async bus endpoints (in-cluster service DNS).
  FP_LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  FP_OTEL_ENDPOINT: {{ .Values.config.otelEndpoint | quote }}
  FP_NATS_URL: {{ .Values.config.natsUrl | quote }}
  # FP_ENV labels logs/traces with the deployment environment.
  FP_ENV: {{ .Values.config.env | quote }}
  # ----------------------------------------------------------------------
  # CLOSED-LOOP KNOBS (model-monitor specific). Non-secret: a cooldown duration
  # and a fixed in-cluster orchestrator address — neither carries credentials.
  # ----------------------------------------------------------------------
  # FP_RETRAIN_COOLDOWN: anti-storm debounce between auto-retrains for one model.
  FP_RETRAIN_COOLDOWN: {{ .Values.config.retrainCooldown | quote }}
  # FP_ORCHESTRATOR_ENDPOINT: FIXED gRPC target of the Pipeline Orchestrator the
  # loop calls. Operator config, NOT derived from event data (anti-SSRF).
  FP_ORCHESTRATOR_ENDPOINT: {{ .Values.config.orchestratorEndpoint | quote }}
  # ----------------------------------------------------------------------
  # M7/L4 — LLM QUALITY EVAL + QUALITY DRIFT (model-monitor specific).
  # Non-secret: a feature flag, a model name, an in-cluster Ollama URL, and
  # numeric drift thresholds — none carry credentials. SELF-GATED on
  # FP_EVAL_ENABLED: when "false" the consumer is never started and the service
  # runs tabular data-drift only (the egress NetworkPolicy to Ollama is also
  # gated, so a disabled deployment opens no path to fp-ml).
  # ----------------------------------------------------------------------
  FP_EVAL_ENABLED: {{ .Values.config.eval.enabled | quote }}
  FP_OLLAMA_URL: {{ .Values.config.eval.ollamaUrl | quote }}
  FP_EVAL_JUDGE_MODEL: {{ .Values.config.eval.judgeModel | quote }}
  FP_EVAL_SAMPLE_RATE: {{ .Values.config.eval.sampleRate | quote }}
  FP_EVAL_WINDOW: {{ .Values.config.eval.window | quote }}
  FP_EVAL_MIN_SAMPLES: {{ .Values.config.eval.minSamples | quote }}
  FP_EVAL_FLOOR_SCORE: {{ .Values.config.eval.floorScore | quote }}
  FP_EVAL_BASELINE_SCORE: {{ .Values.config.eval.baselineScore | quote }}
  FP_EVAL_BASELINE_DROP: {{ .Values.config.eval.baselineDrop | quote }}
  FP_EVAL_WARN_DROP: {{ .Values.config.eval.warnDrop | quote }}
  FP_EVAL_CRITICAL_DROP: {{ .Values.config.eval.criticalDrop | quote }}
  {{- with .Values.config.extraEnv }}
  # Free-form additional non-secret env. Keys used verbatim.
  {{- range $key, $val := . }}
  {{ $key }}: {{ $val | quote }}
  {{- end }}
  {{- end }}
