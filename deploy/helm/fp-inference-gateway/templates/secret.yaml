{{- if .Values.secrets.create -}}
# ============================================================================
# Secret — SENSITIVE configuration (Redis DSN + the shared JWT verification key).
# ============================================================================
# ⚠️  PRODUCTION CONTRACT  ⚠️
# This rendered Secret is for LOCAL/DEV clusters ONLY. The values come from
# values.yaml placeholders, which must NEVER hold real credentials in git.
#
# In a real environment, set `secrets.create: false` and supply the Secret
# out-of-band so plaintext credentials never touch the chart or the repo:
#   - External Secrets Operator: an ExternalSecret CR syncs from AWS Secrets
#     Manager / HashiCorp Vault into a K8s Secret named `secrets.existingSecret`.
#   - Sealed Secrets: a SealedSecret CR (safe to commit — encrypted) that the
#     controller decrypts into the real Secret in-cluster.
# Either way the Deployment's envFrom references the SAME name
# (fp-inference-gateway.secretName), so flipping create on/off needs no other change.
#
# WHAT IS HERE (vs fp-auth's JWT key + DB DSN): the gateway has no Postgres
# database, so there is no DB DSN. It has TWO sensitive inputs:
#   - FP_REDIS_URL: the Redis connection string (rate-limit buckets, route mirror,
#     quota cache, breaker state). The DSN may carry a password / TLS auth.
#   - FP_JWT_SECRET: the shared HMAC-SHA256 key the gateway uses to LOCALLY verify
#     the bearer JWT on every RPC (design D2 — no per-request call to Auth on the
#     hot path). The gateway only VERIFIES; it never mints. It MUST be the SAME
#     key fp-auth signs with (fp-auth's secrets.jwtSecret), or every token fails.
# Both are access-controlled signing/credential material, so they belong in a
# Secret, not a ConfigMap.
#
# WHY stringData (not data): stringData takes plaintext and Kubernetes
# base64-encodes it for us — no manual `base64` in templates, which is just
# obfuscation (base64 is NOT encryption) and a frequent source of corrupt
# secrets. The keys below become env vars via envFrom (FP_REDIS_URL, FP_JWT_SECRET).
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "fp-inference-gateway.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fp-inference-gateway.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Redis connection string; the password (when present) is the sensitive part.
  # The service refuses to start cleanly without a reachable Redis.
  FP_REDIS_URL: {{ required "secrets.redisUrl is required when secrets.create=true (use an external secret store in prod)" .Values.secrets.redisUrl | quote }}
  # Shared HMAC-SHA256 verification key. The gateway refuses to start if unset
  # (FP_JWT_SECRET is required:"true") and pkg/auth rejects a key < 32 bytes. MUST
  # equal fp-auth's secrets.jwtSecret so Auth-minted tokens verify here.
  FP_JWT_SECRET: {{ required "secrets.jwtSecret is required when secrets.create=true (must match fp-auth's jwtSecret; use an external secret store in prod)" .Values.secrets.jwtSecret | quote }}
{{- end }}
