{{- if .Values.secrets.create -}}
# ============================================================================
# Secret — SENSITIVE configuration (DB DSN + Redis DSN, each with credentials).
# ============================================================================
# ⚠️  PRODUCTION CONTRACT  ⚠️
# This rendered Secret is for LOCAL/DEV clusters ONLY. The values come from
# values.yaml placeholders, which must NEVER hold real credentials in git.
#
# In a real environment, set `secrets.create: false` and supply the Secret
# out-of-band so plaintext credentials never touch the chart or the repo:
#   - External Secrets Operator: an ExternalSecret CR syncs FP_DATABASE_URL and
#     FP_REDIS_URL from AWS Secrets Manager / HashiCorp Vault into a K8s Secret
#     named `secrets.existingSecret` (see deploy/secrets/external-secrets).
#   - Sealed Secrets: a SealedSecret CR (safe to commit — encrypted) that the
#     controller decrypts into the real Secret in-cluster.
# Either way the Deployment's envFrom references the SAME name
# (fp-feature-store.secretName), so flipping create on/off needs no other change.
#
# DIFFERENCE vs the reference chart (fp-auth): feature-store has NO JWT signing
# key — it does not mint tokens. Instead it carries the Redis online-store DSN,
# whose ElastiCache auth token makes it sensitive (hence Secret, not ConfigMap).
#
# WHY stringData (not data): stringData takes plaintext and Kubernetes
# base64-encodes it for us — no manual `base64` in templates, which is just
# obfuscation (base64 is NOT encryption) and a frequent source of corrupt
# secrets. The keys below become env vars via envFrom (FP_DATABASE_URL, etc.).
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "fp-feature-store.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fp-feature-store.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Full Postgres DSN; the password is the sensitive part. Backs the append-only
  # EventLog (write model) and the OfflineViewStore (durable read model).
  FP_DATABASE_URL: {{ required "secrets.databaseUrl is required when secrets.create=true" .Values.secrets.databaseUrl | quote }}
  # Redis DSN; in prod this carries an ElastiCache auth token. Backs the
  # OnlineViewStore (the low-latency "latest value" projection).
  FP_REDIS_URL: {{ required "secrets.redisUrl is required when secrets.create=true" .Values.secrets.redisUrl | quote }}
{{- end }}
