# ============================================================================
# Deployment — the desired-state controller for the BFF pods.
# ============================================================================
# A Deployment manages a ReplicaSet, which manages the Pods. We declare WHAT we
# want (N replicas of this pod spec) and the controller reconciles reality to
# match — orchestrating rolling updates and self-healing crashed pods.
#
# This mirrors the reference Deployment (fp-auth / fp-inference-gateway) with the
# include names rebased and TWO BFF differences:
#   1. The container exposes an `http` (SPA API) port + a `health` port — NO `grpc`
#      port (the BFF is a gRPC CLIENT, it serves no gRPC).
#   2. envFrom pulls ONLY the ConfigMap — there is NO Secret (the BFF holds no
#      sensitive config), so no secretRef and no checksum/secret annotation.
# The hardening (security contexts, probes, spread, rolling strategy) is the
# platform baseline, inherited unchanged.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "fp-bff.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fp-bff.labels" . | nindent 4 }}
spec:
  # When the HPA owns scaling, OMIT replicas here so each `helm upgrade` doesn't
  # reset the count and fight the HPA (flapping). Set replicas only when
  # autoscaling is disabled.
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  # revisionHistoryLimit caps retained old ReplicaSets (for rollback). 5 is plenty
  # of rollback depth without etcd clutter (default 10 is wasteful).
  revisionHistoryLimit: 5
  strategy:
    type: {{ .Values.updateStrategy.type }}
    {{- if eq .Values.updateStrategy.type "RollingUpdate" }}
    rollingUpdate:
      # maxUnavailable: 0 + maxSurge: 1 = surge-then-retire: never dip below desired
      # capacity during a roll, add at most one extra pod at a time.
      maxUnavailable: {{ .Values.updateStrategy.rollingUpdate.maxUnavailable }}
      maxSurge: {{ .Values.updateStrategy.rollingUpdate.maxSurge }}
    {{- end }}
  # selector is IMMUTABLE post-create and must equal the pod template's identity
  # labels — both come from the same helper so they can't drift.
  selector:
    matchLabels:
      {{- include "fp-bff.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "fp-bff.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        # checksum/config: hash the ConfigMap contents into the pod template. WHY:
        # changing a ConfigMap does NOT by itself restart pods (env is read at
        # process start). Embedding the checksum changes the pod template → the
        # Deployment rolls the pods so the new config takes effect. (No
        # checksum/secret here — the BFF renders no Secret.)
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "fp-bff.serviceAccountName" . }}
      # Belt-and-suspenders: also deny token automount at the pod level (the SA
      # already defaults it). The BFF doesn't talk to the K8s API.
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # Pod-level hardening (runAsNonRoot, nonroot UID, fsGroup, seccomp).
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      # Must exceed the HTTP graceful-drain timeout (15s in main.go) so in-flight
      # requests + SSE teardown finish before SIGKILL.
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      containers:
        - name: {{ .Chart.Name }}
          image: {{ include "fp-bff.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # Container-level hardening (no priv-esc, read-only rootfs, drop ALL caps).
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.ports.http }}
              protocol: TCP
            - name: health
              containerPort: {{ .Values.ports.health }}
              protocol: TCP
          # envFrom pulls ALL keys from the ConfigMap as env vars in one shot — the
          # BFF reads FP_* from env. There is NO secretRef: the BFF has no Secret.
          envFrom:
            - configMapRef:
                name: {{ include "fp-bff.fullname" . }}
          # PROBES — all hit the HTTP health port.
          #   liveness  → /healthz: process-alive only; failure RESTARTS the pod.
          #   readiness → /readyz : real dependency checks (the BFF verifies it can
          #               REACH auth + registry over gRPC); failure pulls the pod
          #               from Service endpoints (no traffic) without restarting.
          #   startup   → guards a slow cold start (dialing downstream conns) so
          #               liveness doesn't kill a pod that's merely still booting.
          {{- if .Values.probes.startup.enabled }}
          startupProbe:
            httpGet:
              path: {{ .Values.probes.startup.path }}
              port: health
            initialDelaySeconds: {{ .Values.probes.startup.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.startup.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
          {{- end }}
          {{- if .Values.probes.liveness.enabled }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: health
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          {{- end }}
          {{- if .Values.probes.readiness.enabled }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: health
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          # readOnlyRootFilesystem: true means the container CANNOT write to its own
          # filesystem. Mount a small RAM-backed emptyDir at /tmp for any scratch
          # space the runtime needs. Ephemeral.
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # topologySpreadConstraints — spread replicas across nodes/zones so one
      # failure domain can't host a disproportionate share of pods. The label
      # selector is injected from the chart's selector labels so it always targets
      # exactly this workload's pods.
      {{- if .Values.topologySpread.enabled }}
      topologySpreadConstraints:
        {{- range .Values.topologySpread.constraints }}
        - maxSkew: {{ .maxSkew }}
          topologyKey: {{ .topologyKey }}
          whenUnsatisfiable: {{ .whenUnsatisfiable }}
          labelSelector:
            matchLabels:
              {{- include "fp-bff.selectorLabels" $ | nindent 14 }}
        {{- end }}
      {{- end }}
