{{- if .Values.autoscaling.enabled -}}
# ============================================================================
# HorizontalPodAutoscaler (autoscaling/v2) — scale replicas on load.
# ============================================================================
# The HPA controller samples metrics every ~15s and adjusts the Deployment's
# replica count to keep each metric near its target. autoscaling/v2 is the stable
# API supporting MULTIPLE metrics and custom/external metrics (v1 was CPU-only), so
# adding a custom metric later needs no API migration. The BFF scales on request
# fan-out load (it's the front door for the SPA); RPS-based custom-metric scaling
# via Prometheus-Adapter / KEDA is the natural next step (customMetrics).
#
# WHY the Deployment omits `replicas` when this is enabled: if both set the count,
# every `helm upgrade` resets replicas to replicaCount and the HPA then corrects it
# — visible flapping. With the HPA as sole owner, scaling is stable.
#
# MULTI-METRIC SEMANTICS: when several metrics are listed, the HPA computes the
# desired replicas for EACH and takes the MAXIMUM — it scales to satisfy the
# most-pressed metric, never under-provisioning.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "fp-bff.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fp-bff.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "fp-bff.fullname" . }}
  minReplicas: {{ .Values.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.maxReplicas }}
  metrics:
    {{- if .Values.autoscaling.targetCPUUtilizationPercentage }}
    # Resource metric: target average CPU utilization as a % of the pod's CPU
    # REQUEST (not limit). This is why requests must be realistic — they are the
    # denominator of the HPA's utilization math.
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.targetCPUUtilizationPercentage }}
    {{- end }}
    {{- if .Values.autoscaling.targetMemoryUtilizationPercentage }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.targetMemoryUtilizationPercentage }}
    {{- end }}
    {{- with .Values.autoscaling.customMetrics }}
    # Custom/external metrics passed through verbatim — the hook for later
    # autoscaling work (Prometheus-Adapter for HTTP RPS, or KEDA).
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.autoscaling.behavior }}
  # behavior tunes scale-up/down velocity. A long scale-down stabilization window
  # prevents flapping when load is spiky.
  behavior:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
