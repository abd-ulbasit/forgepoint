{{- if .Values.networkPolicy.enabled -}}
# ============================================================================
# NetworkPolicy — zero-trust east-west isolation for the billing pods.
# ============================================================================
# By DEFAULT, Kubernetes pod networking is wide open: any pod can reach any other
# pod on any port. A NetworkPolicy flips a workload to default-deny for the
# directions it lists in policyTypes, then re-allows ONLY the explicit rules.
#
# This policy:
#   INGRESS → default-deny, allow only from the fp-system namespace (the platform
#             services / gateway that legitimately call BillingService). Nothing
#             else in the cluster can even open a connection to billing.
#   EGRESS  → default-deny, allow only: DNS (so the pod can resolve service
#             names at all), Postgres (business writes + the OUTBOX table), NATS
#             (the relay PUBLISHES outbox events; the metering consumer
#             SUBSCRIBES to inference events), and the OTel collector. Billing
#             uses NO Redis and NO MinIO, so NO egress is opened to them — the
#             allow-list is exactly the data stores this service actually uses.
#
# ENFORCEMENT CAVEAT (interview-critical): a NetworkPolicy is only enforced if
# the cluster's CNI supports it (Calico, Cilium, etc.). On a CNI without policy
# support it is silently ignored — present but not enforced. So this is defense
# in depth, not a substitute for authn/authz at the app layer.
#
# DNS GOTCHA: forget the DNS egress rule and the pod can't resolve ANY service
# DNS name, so every outbound connection fails with NXDOMAIN — a classic
# self-inflicted outage when first adding egress policies. We always allow it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "fp-billing.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fp-billing.labels" . | nindent 4 }}
spec:
  # podSelector scopes this policy to THIS chart's pods (by identity labels).
  podSelector:
    matchLabels:
      {{- include "fp-billing.selectorLabels" . | nindent 6 }}
  # Listing both types makes the policy default-deny for BOTH directions; the
  # rules below are the only allowances.
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow gRPC + health traffic from the permitted namespaces only.
    - from:
        {{- range .Values.networkPolicy.ingressNamespaces }}
        - namespaceSelector:
            matchLabels:
              # Relies on the standard kubernetes.io/metadata.name label that the
              # control plane auto-applies to every Namespace (K8s 1.21+). No need
              # to hand-label namespaces.
              kubernetes.io/metadata.name: {{ . }}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.ports.grpc }}
        - protocol: TCP
          port: {{ .Values.ports.health }}
  egress:
    {{- if .Values.networkPolicy.egress.dns.enabled }}
    # DNS to the cluster resolver (kube-dns/CoreDNS in kube-system), UDP+TCP/53.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    {{- end }}
    {{- if .Values.networkPolicy.egress.postgres.enabled }}
    # Postgres (per-service database fp_billing lives in fp-infra; also holds the
    # outbox table the relay tails).
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.egress.postgres.namespace }}
      ports:
        - protocol: TCP
          port: {{ .Values.networkPolicy.egress.postgres.port }}
    {{- end }}
    {{- if .Values.networkPolicy.egress.redis.enabled }}
    # Redis — the consumer-side idempotency ProcessedStore (dedup so a redelivered
    # inference event is never double-metered). main.go pings it at boot, so without
    # this egress (under an enforcing CNI) billing fails its Redis ping and CrashLoops.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.egress.redis.namespace }}
      ports:
        - protocol: TCP
          port: {{ .Values.networkPolicy.egress.redis.port }}
    {{- end }}
    {{- if .Values.networkPolicy.egress.nats.enabled }}
    # NATS JetStream (async event bus) — outbox relay publishes here; the metering
    # consumer subscribes to inference events here.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.egress.nats.namespace }}
      ports:
        - protocol: TCP
          port: {{ .Values.networkPolicy.egress.nats.port }}
    {{- end }}
    {{- if .Values.networkPolicy.egress.otlp.enabled }}
    # OTLP/gRPC to the OpenTelemetry Collector (traces + metrics push).
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.egress.otlp.namespace }}
      ports:
        - protocol: TCP
          port: {{ .Values.networkPolicy.egress.otlp.port }}
    {{- end }}
{{- end }}
