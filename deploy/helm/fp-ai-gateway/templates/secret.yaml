{{- if .Values.secrets.create -}}
# ============================================================================
# Secret — SENSITIVE configuration (Redis DSN + the shared JWT verification key).
# ============================================================================
# ⚠️  PRODUCTION CONTRACT  ⚠️
# This rendered Secret is for LOCAL/DEV clusters ONLY. The values come from
# values.yaml placeholders, which must NEVER hold real credentials in git.
#
# In a real environment, set `secrets.create: false` and supply the Secret
# out-of-band so plaintext credentials never touch the chart or the repo:
#   - External Secrets Operator: an ExternalSecret CR syncs from AWS Secrets
#     Manager / HashiCorp Vault into a K8s Secret named `secrets.existingSecret`.
#   - Sealed Secrets: a SealedSecret CR (safe to commit — encrypted) that the
#     controller decrypts into the real Secret in-cluster.
# Either way the Deployment's envFrom references the SAME name
# (fp-ai-gateway.secretName), so flipping create on/off needs no other change.
#
# WHAT IS HERE: the gateway's hot-path core has TWO sensitive inputs, and the L3
# prompt registry adds an OPTIONAL third:
#   - FP_REDIS_URL: the Redis connection string (rate-limit buckets, route mirror,
#     quota cache, breaker state). The DSN may carry a password / TLS auth.
#   - FP_JWT_SECRET: the shared HMAC-SHA256 key the gateway uses to LOCALLY verify
#     the bearer JWT on every RPC (design D2 — no per-request call to Auth on the
#     hot path). The gateway only VERIFIES; it never mints. It MUST be the SAME
#     key fp-auth signs with (fp-auth's secrets.jwtSecret), or every token fails.
#   - FP_DATABASE_URL (OPTIONAL — L3 PROMPT REGISTRY): the Postgres DSN for the
#     versioned, team-scoped prompt store. Rendered ONLY when secrets.databaseUrl is
#     set. When ABSENT the gateway runs chat-only and the prompt RPCs return
#     Unimplemented (the app self-gates on FP_DATABASE_URL — see cmd/server/main.go);
#     the migrate initContainer is likewise gated off (see deployment.yaml). The
#     password component is the sensitive part, so it belongs in the Secret.
# All are access-controlled signing/credential material, so they belong in a
# Secret, not a ConfigMap.
#
# WHY stringData (not data): stringData takes plaintext and Kubernetes
# base64-encodes it for us — no manual `base64` in templates, which is just
# obfuscation (base64 is NOT encryption) and a frequent source of corrupt
# secrets. The keys below become env vars via envFrom (FP_REDIS_URL, FP_JWT_SECRET).
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "fp-ai-gateway.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fp-ai-gateway.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Redis connection string; the password (when present) is the sensitive part.
  # The service refuses to start cleanly without a reachable Redis.
  FP_REDIS_URL: {{ required "secrets.redisUrl is required when secrets.create=true (use an external secret store in prod)" .Values.secrets.redisUrl | quote }}
  # Shared HMAC-SHA256 verification key. The gateway refuses to start if unset
  # (FP_JWT_SECRET is required:"true") and pkg/auth rejects a key < 32 bytes. MUST
  # equal fp-auth's secrets.jwtSecret so Auth-minted tokens verify here.
  FP_JWT_SECRET: {{ include "fp-ai-gateway.validateJwtSecret" . | quote }}
  {{- if .Values.secrets.databaseUrl }}
  # OPTIONAL (L3 PROMPT REGISTRY): full Postgres DSN (database "fp_ai_gateway"), read
  # as FP_DATABASE_URL by both the app and the migrate initContainer. The password is
  # the sensitive part. Rendered ONLY when set — leave it empty to run the gateway
  # chat-only with the prompt RPCs disabled (the app + the migrate gate both honor it).
  FP_DATABASE_URL: {{ .Values.secrets.databaseUrl | quote }}
  {{- end }}
  {{- if .Values.secrets.openaiApiKey }}
  # OPTIONAL (L5 GOVERNANCE — CLOUD PROVIDER): the OpenAI API key, read as
  # FP_OPENAI_API_KEY. KEY-GATING: rendered ONLY when set; its mere PRESENCE enables the
  # OpenAI provider in the failover order (see cmd/server/main.go). Absent ⇒ the key env
  # is unset ⇒ the provider is not registered ⇒ failover stays Ollama+Stub, no cloud
  # account needed. It is a SECRET (an auth credential), so it belongs here, never in the
  # ConfigMap, and is sent ONLY as the request's Authorization header — never logged.
  # The Kyverno cloud-key-from-Secret policy (deploy/policies) governs that this key is
  # sourced from a Secret and never pasted inline as a Deployment env value.
  FP_OPENAI_API_KEY: {{ .Values.secrets.openaiApiKey | quote }}
  {{- end }}
  {{- if .Values.secrets.anthropicApiKey }}
  # OPTIONAL (L5 GOVERNANCE — CLOUD PROVIDER): the Anthropic (Claude) API key, read as
  # FP_ANTHROPIC_API_KEY. Same KEY-GATING + secret discipline as the OpenAI key above:
  # rendered ONLY when set, enables the Anthropic provider by its presence, sent ONLY as
  # the request's x-api-key header, never logged. Absent ⇒ provider not registered.
  FP_ANTHROPIC_API_KEY: {{ .Values.secrets.anthropicApiKey | quote }}
  {{- end }}
{{- end }}
