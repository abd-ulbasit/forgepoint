{{- if .Values.networkPolicy.enabled -}}
# ============================================================================
# NetworkPolicy — zero-trust east-west isolation for the ai-gateway pods.
# ============================================================================
# By DEFAULT, Kubernetes pod networking is wide open: any pod can reach any other
# pod on any port. A NetworkPolicy flips a workload to default-deny for the
# directions it lists in policyTypes, then re-allows ONLY the explicit rules.
#
# This policy:
#   INGRESS → default-deny, allow only from the fp-system namespace (the platform
#             services / API gateway that legitimately call AIGatewayService).
#             Nothing else in the cluster can even open a connection to it.
#   EGRESS  → default-deny, allow only: DNS (so the pod can resolve service names
#             at all), Redis (its only datastore — per-team token budgets), NATS,
#             the OTel collector, and Ollama in fp-ml (the completion forward path).
#             The gateway has no business talking to anything else; if it's
#             compromised it can't exfiltrate to arbitrary endpoints.
#
# WHAT'S DIFFERENT FROM THE REFERENCE CHART: NO Postgres egress — this core owns no
# Postgres database. It egresses to Redis (the per-team token-budget buckets) and to
# Ollama in fp-ml (the forward path). We open ONLY the ports the service uses.
#
# ENFORCEMENT CAVEAT (interview-critical): a NetworkPolicy is only enforced if
# the cluster's CNI supports it (Calico, Cilium, etc.). On a CNI without policy
# support it is silently ignored — present but not enforced. So this is defense
# in depth, not a substitute for authn/authz at the app layer.
#
# DNS GOTCHA: forget the DNS egress rule and the pod can't resolve ANY service
# DNS name, so every outbound connection fails with NXDOMAIN — a classic
# self-inflicted outage when first adding egress policies. We always allow it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "fp-ai-gateway.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fp-ai-gateway.labels" . | nindent 4 }}
spec:
  # podSelector scopes this policy to THIS chart's pods (by identity labels).
  podSelector:
    matchLabels:
      {{- include "fp-ai-gateway.selectorLabels" . | nindent 6 }}
  # Listing both types makes the policy default-deny for BOTH directions; the
  # rules below are the only allowances.
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow gRPC + health traffic from the permitted namespaces only.
    - from:
        {{- range .Values.networkPolicy.ingressNamespaces }}
        - namespaceSelector:
            matchLabels:
              # Relies on the standard kubernetes.io/metadata.name label that the
              # control plane auto-applies to every Namespace (K8s 1.21+). No need
              # to hand-label namespaces.
              kubernetes.io/metadata.name: {{ . }}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.ports.grpc }}
        - protocol: TCP
          port: {{ .Values.ports.health }}
  egress:
    {{- if .Values.networkPolicy.egress.dns.enabled }}
    # DNS to the cluster resolver (kube-dns/CoreDNS in kube-system), UDP+TCP/53.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    {{- end }}
    {{- if .Values.networkPolicy.egress.redis.enabled }}
    # Redis (the gateway's hot-path datastore: rate-limit token buckets, the route
    # table mirror, the quota cache, and shared circuit-breaker state).
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.egress.redis.namespace }}
      ports:
        - protocol: TCP
          port: {{ .Values.networkPolicy.egress.redis.port }}
    {{- end }}
    {{- if .Values.networkPolicy.egress.postgres.enabled }}
    # Postgres (fp-infra:5432) — the L3 PROMPT REGISTRY store. The app dials it ONLY
    # when FP_DATABASE_URL is configured (chat-only mode never opens this connection),
    # and the migrate initContainer needs it to apply the prompt schema before startup.
    # Opening the egress is harmless when the prompt registry is off — it is simply
    # unused. This is the egress the reference chart (fp-registry) also carries.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.egress.postgres.namespace }}
      ports:
        - protocol: TCP
          port: {{ .Values.networkPolicy.egress.postgres.port }}
    {{- end }}
    {{- if .Values.networkPolicy.egress.nats.enabled }}
    # NATS JetStream (async event bus): publishes Inference{Completed,Failed} and
    # subscribes to ModelDeployed/Undeployed/Promoted/Archived to update routes.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.egress.nats.namespace }}
      ports:
        - protocol: TCP
          port: {{ .Values.networkPolicy.egress.nats.port }}
    {{- end }}
    {{- if .Values.networkPolicy.egress.otlp.enabled }}
    # OTLP/gRPC to the OpenTelemetry Collector (traces + metrics push).
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.egress.otlp.namespace }}
      ports:
        - protocol: TCP
          port: {{ .Values.networkPolicy.egress.otlp.port }}
    {{- end }}
    {{- if .Values.networkPolicy.egress.ollama.enabled }}
    # Ollama serving (fp-ml): the FORWARD path. The gateway POSTs every completion
    # to Ollama's /api/chat over HTTP at the SERVER-configured FP_OLLAMA_URL (never a
    # client-supplied address — anti-SSRF). Allowing the fp-ml namespace on Ollama's
    # port is the right grain (Ollama is the sole backend there, scaled 0->1 by KEDA).
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.egress.ollama.namespace }}
      ports:
        - protocol: TCP
          port: {{ .Values.networkPolicy.egress.ollama.port }}
    {{- end }}
{{- end }}
