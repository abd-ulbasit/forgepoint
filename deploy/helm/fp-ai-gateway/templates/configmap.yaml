# ============================================================================
# ConfigMap — NON-SECRET environment configuration.
# ============================================================================
# These keys are mapped into the container as env vars via `envFrom` in the
# Deployment. The service reads them with the FP_ prefix (config.Load[...]("FP")
# → FP_PORT, FP_GRPC_PORT, ...). Keep ONLY non-sensitive values here — a
# ConfigMap is stored in plaintext in etcd and readable by anyone with get on
# ConfigMaps in the namespace. The sensitive value (FP_REDIS_URL, which may embed
# a password) lives in the Secret.
#
# WHY ports come from values, not hardcoded: the container, the Service, and the
# probes must all agree on the port numbers; sourcing them from one place
# (.Values.ports) keeps them in lockstep.
#
# SERVICE-SPECIFIC KEYS: the AI gateway reads FP_OLLAMA_URL (the in-cluster Ollama
# serving endpoint it routes to first), the per-team token-budget tuning
# (FP_TEAM_TOKEN_BUDGET, FP_BUDGET_WINDOW_SECONDS), and the per-provider circuit-
# breaker tuning (FP_CIRCUIT_*). It deliberately has NO FP_DATABASE_URL — this core
# owns no Postgres (the L3 prompt registry will add one later).
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "fp-ai-gateway.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fp-ai-gateway.labels" . | nindent 4 }}
data:
  # Ports — stringified because ConfigMap values are always strings.
  FP_PORT: {{ .Values.ports.health | quote }}
  FP_GRPC_PORT: {{ .Values.ports.grpc | quote }}
  # Observability + async bus endpoints (in-cluster service DNS).
  FP_LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  FP_OTEL_ENDPOINT: {{ .Values.config.otelEndpoint | quote }}
  FP_NATS_URL: {{ .Values.config.natsUrl | quote }}
  # FP_ENV labels logs/traces with the deployment environment.
  FP_ENV: {{ .Values.config.env | quote }}
  # Ollama serving endpoint — the gateway's preferred (first-in-failover) provider.
  # A cold/down Ollama trips its breaker and the gateway fails over to the stub.
  FP_OLLAMA_URL: {{ .Values.config.ollamaUrl | quote }}
  # Per-team token budget (the token-denominated rate limiter): the allowance per
  # rolling window and the window length. 0 budget = unlimited.
  # printf "%d" forces a PLAIN integer string — a bare `| quote` on a large YAML
  # number (e.g. 1000000) renders scientific notation ("1e+06"), which the service's
  # strconv.ParseInt (pkg/config) rejects at boot. Coerce to int64 first, then format.
  FP_TEAM_TOKEN_BUDGET: {{ printf "%d" (int64 .Values.config.teamTokenBudget) | quote }}
  FP_BUDGET_WINDOW_SECONDS: {{ printf "%d" (int64 .Values.config.budgetWindowSeconds) | quote }}
  # Circuit breaker — consecutive provider failures to trip OPEN + OPEN cooldown.
  FP_CIRCUIT_FAILURE_THRESHOLD: {{ .Values.config.circuitFailureThreshold | quote }}
  FP_CIRCUIT_RESET_SECONDS: {{ .Values.config.circuitResetSeconds | quote }}
  # ----- L5 AI GOVERNANCE: the model/provider ALLOW-LIST (policy-as-config) -----
  # Comma-separated lists of the model names and provider kinds this deployment may
  # serve. ChatCompletion rejects anything not listed with PermissionDenied (audited as
  # a DENY). EMPTY = ALLOW ALL (dev). These are NON-secret governance config, so they
  # ride in the ConfigMap. In non-dev, set FP_AI_ALLOWED_MODELS to the approved-models
  # list — the Kyverno require-ai-allowlist policy (deploy/policies) flags a deployment
  # that leaves it empty (wildcard-allow) outside dev.
  FP_AI_ALLOWED_MODELS: {{ .Values.config.allowedModels | quote }}
  FP_AI_ALLOWED_PROVIDERS: {{ .Values.config.allowedProviders | quote }}
  # ----- L2 SEMANTIC CACHE (first-class config; was extraEnv) -----
  # Embed the prompt -> per-team cosine lookup -> on a HIT replay the cached response,
  # SKIPPING the LLM call + token deduction. Embeddings come from FP_OLLAMA_URL. The
  # cache is fail-open (an embedder error just serves uncached). similarityThreshold is
  # the min cosine for a hit; maxEntriesPerTeam bounds the per-team store.
  FP_AI_CACHE_ENABLED: {{ .Values.config.cache.enabled | quote }}
  FP_AI_CACHE_EMBEDDING_MODEL: {{ .Values.config.cache.embeddingModel | quote }}
  FP_AI_CACHE_SIMILARITY_THRESHOLD: {{ .Values.config.cache.similarityThreshold | quote }}
  FP_AI_CACHE_MAX_ENTRIES_PER_TEAM: {{ printf "%d" (int64 .Values.config.cache.maxEntriesPerTeam) | quote }}
  # ----- L4 QUALITY EVAL (first-class config; was extraEnv) -----
  # Attach the raw prompt/response TEXT to fp.ai.completion.served so the model-monitor
  # LLM-as-judge can score quality. PII opt-in: default false (event stays text-free).
  FP_AI_EVAL_INCLUDE_TEXT: {{ .Values.config.eval.includeText | quote }}
  {{- if .Values.config.openaiBaseUrl }}
  # OPTIONAL: override the OpenAI API root (Azure OpenAI / a proxy). Non-secret (no
  # credential), so it lives here, not in the Secret. The KEY itself is in the Secret.
  FP_OPENAI_BASE_URL: {{ .Values.config.openaiBaseUrl | quote }}
  {{- end }}
  {{- if .Values.config.anthropicBaseUrl }}
  # OPTIONAL: override the Anthropic API root (a proxy). Non-secret; the key is in the Secret.
  FP_ANTHROPIC_BASE_URL: {{ .Values.config.anthropicBaseUrl | quote }}
  {{- end }}
  {{- with .Values.config.extraEnv }}
  # Free-form additional non-secret env. Keys used verbatim.
  {{- range $key, $val := . }}
  {{ $key }}: {{ $val | quote }}
  {{- end }}
  {{- end }}
