{{- if .Values.secrets.create -}}
# ============================================================================
# Secret — SENSITIVE configuration (the Postgres DSN with password).
# ============================================================================
# ⚠️  PRODUCTION CONTRACT  ⚠️
# This rendered Secret is for LOCAL/DEV clusters ONLY. The values come from
# values.yaml placeholders, which must NEVER hold real credentials in git.
#
# In a real environment, set `secrets.create: false` and supply the Secret
# out-of-band so plaintext credentials never touch the chart or the repo:
#   - External Secrets Operator: an ExternalSecret CR syncs from AWS Secrets
#     Manager / HashiCorp Vault into a K8s Secret named `secrets.existingSecret`.
#   - Sealed Secrets: a SealedSecret CR (safe to commit — encrypted) that the
#     controller decrypts into the real Secret in-cluster.
# Either way the Deployment's envFrom references the SAME name
# (fp-registry.secretName), so flipping create on/off needs no other change.
#
# NOTE vs fp-auth: the registry's FP_JWT_SECRET is a VERIFY key, not a SIGN key —
# auth alone MINTS tokens; the registry VERIFIES their HS256 signature in-process
# (design D2, pkg/auth) so its gRPC auth interceptor can authenticate callers with
# no hop to auth. It must hold the SAME value as auth's FP_JWT_SECRET. Plus the DB
# DSN. If the prod Redis is authenticated, add FP_REDIS_URL here too and remove it
# from the ConfigMap.
#
# WHY stringData (not data): stringData takes plaintext and Kubernetes
# base64-encodes it for us — no manual `base64` in templates, which is just
# obfuscation (base64 is NOT encryption) and a frequent source of corrupt
# secrets. The keys below become env vars via envFrom (FP_DATABASE_URL, etc.).
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "fp-registry.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fp-registry.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Shared HMAC-SHA256 VERIFICATION key. The gRPC auth interceptor (pkg/auth,
  # design D2 local verify) refuses to build if this is unset/weak, so the service
  # refuses to start — required. MUST match auth's FP_JWT_SECRET byte-for-byte.
  FP_JWT_SECRET: {{ required "secrets.jwtSecret is required when secrets.create=true (must equal auth's FP_JWT_SECRET; use an external secret store in prod)" .Values.secrets.jwtSecret | quote }}
  # Full Postgres DSN (database "fp_registry"); the password is the sensitive
  # part. The service refuses to start if unset (required).
  FP_DATABASE_URL: {{ required "secrets.databaseUrl is required when secrets.create=true" .Values.secrets.databaseUrl | quote }}
{{- end }}
