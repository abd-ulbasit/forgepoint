# ============================================================================
# fp-notification — default values
# ============================================================================
# Mirrors the fp-auth REFERENCE values file. Everything the templates render is
# driven from here so the manifests stay declarative and nothing is hardcoded.
# Override per-environment with `-f values-prod.yaml` or `--set key=value`.
#
# DELTAS vs fp-auth (the reference) — what's notification-specific:
#   - config adds redisUrl (the IdempotencyStore — event + sync dedup) and
#     smtpAddr (the EMAIL delivery channel). Both are non-secret in dev.
#   - secrets carries databaseUrl (the inbox/delivery_log/preferences DB) AND
#     jwtSecret. notification does NOT sign tokens, but its gRPC auth interceptor
#     must VERIFY caller JWTs locally (design D2), so it needs the SAME HMAC key the
#     auth service signs with — hence a jwtSecret here too. (It still mints nothing
#     and has no bootstrap-admin password, unlike fp-auth.)
#   - networkPolicy egress adds redis (its dedup store) on top of
#     postgres + nats + otlp.
#
# SECURITY CONTRACT (read this before touching `secrets:` below):
#   The plaintext secret values in this file are DEV-ONLY placeholders so the
#   chart renders and runs on a local Kind cluster. In any real environment the
#   Secret is produced by External Secrets Operator (pulls from AWS Secrets
#   Manager / Vault) or Sealed Secrets — NOT from committed values. See
#   `secrets.create` and templates/secret.yaml for how to turn the in-chart
#   Secret off and point at an externally-managed one.
# ============================================================================

# replicaCount: 2 is the floor for a stateless HA service. Two replicas means a
# single node drain or pod eviction never takes the service fully down, and the
# PodDisruptionBudget (minAvailable: 1) can always be satisfied. When autoscaling
# is enabled the HPA owns the replica count and this value is ignored.
#
# NOTE on the consumer: the NATS JetStream consumer is a DURABLE, queue-group
# consumer, so running 2+ replicas does NOT double-process events — JetStream
# load-balances messages across the group and redelivers only on nack/timeout.
# Idempotency keys in Redis are the second line of defense against duplicates.
replicaCount: 2

image:
  repository: ghcr.io/abd-ulbasit/forgepoint/notification
  # tag "" → the chart falls back to Chart.appVersion (see _helpers "image").
  # Pin an explicit immutable tag (git SHA or semver) in prod; never :latest,
  # which breaks reproducibility and defeats rollbacks.
  tag: ""
  # IfNotPresent: don't re-pull an image the node already has (faster, fewer
  # registry round-trips). Use Always only for mutable dev tags.
  pullPolicy: IfNotPresent

# imagePullSecrets: names of pre-existing docker-registry Secrets for private
# registries. Empty for public ghcr; populated in prod from a registry secret.
imagePullSecrets: []

# nameOverride / fullnameOverride let an operator rename the release-derived
# resource names without editing templates (see _helpers "fullname").
nameOverride: ""
fullnameOverride: ""

# ----------------------------------------------------------------------------
# Ports — two distinct listeners (see services/notification/cmd/server/main.go).
#   grpc:   HTTP/2, the NotificationService control-plane API (prefs, test send).
#   health: HTTP/1.1, serves /healthz, /readyz, and /metrics. Kept on a separate
#           port because gRPC (HTTP/2) and kubelet probes (HTTP/1.1) cannot share
#           one net.Listener.
# These names ("grpc", "health") are referenced by service.yaml, the probes, and
# the ServiceMonitor — change them here and they propagate everywhere.
# ----------------------------------------------------------------------------
ports:
  grpc: 9090
  health: 8080

service:
  type: ClusterIP
  annotations: {}

# ----------------------------------------------------------------------------
# Non-secret configuration → rendered into a ConfigMap, injected via envFrom.
# These map 1:1 to FP_* env vars the service reads (pkg/config BaseConfig +
# NotificationConfig). The service prefixes every env var with FP_
# (config.Load[NotificationConfig]("FP")).
# DATABASE_URL is NOT here — it carries the DB password, so it is a secret (see
# `secrets:`). REDIS_URL and SMTP_ADDR have no embedded credential in dev, so
# they live here; in prod with an authenticated Redis/SMTP relay, move them into
# the Secret instead.
# ----------------------------------------------------------------------------
config:
  # FP_ENV labels telemetry/logs with the deployment environment.
  env: "local"
  logLevel: "info"
  # In-cluster service DNS. fp-infra is the namespace hosting shared infra
  # (NATS, Postgres, Redis, OTel collector) per CLAUDE.md K8s namespaces.
  otelEndpoint: "otel-collector.fp-infra.svc.cluster.local:4317"
  natsUrl: "nats://nats.fp-infra.svc.cluster.local:4222"
  # FP_REDIS_URL — the IdempotencyStore (event + sync dedup, Redis SET NX with a
  # TTL). Distinct from DATABASE_URL: dedup keys are short-lived cache entries,
  # not the source of truth (which is the Postgres inbox/delivery_log). No
  # embedded credential in dev (in-cluster Redis); move to the Secret in prod.
  redisUrl: "redis://redis.fp-infra.svc.cluster.local:6379"
  # FP_SMTP_ADDR — the SMTP server (host:port) for the EMAIL delivery channel.
  # Optional by design: the plan allows mocking email in non-prod, so an empty
  # value is valid until the EMAIL delivery adapter is enabled. Point this at an
  # in-cluster mock (e.g. mailhog.fp-infra) in dev, or a real relay in prod.
  smtpAddr: ""
  # Extra free-form non-secret env keys (rendered into the ConfigMap as-is).
  # Keys are used verbatim — DO NOT prefix with FP_ here unless the service
  # actually reads that prefix; mirror existing FP_* naming.
  extraEnv: {}

# ----------------------------------------------------------------------------
# Secrets — DEV placeholders only. See the SECURITY CONTRACT at the top.
#   secrets.create: true  → chart renders templates/secret.yaml from the values
#                           below. Convenient for local Kind; NEVER commit real
#                           values here.
#   secrets.create: false → chart renders NO Secret. You must provide a Secret
#                           named `secrets.existingSecret` out-of-band (External
#                           Secrets / Sealed Secrets / kubectl). The Deployment
#                           still envFrom's it.
#
# WHY a jwtSecret here even though notification does NOT mint tokens: the gRPC auth
# interceptor VERIFIES every caller's JWT locally (design D2 — no per-request hop to
# the auth service), and HMAC-SHA256 verification needs the SAME symmetric key the
# auth service signed with. So this is the auth service's signing key, shared as a
# verify-only key here. It must be >= 32 bytes (the service refuses to start on a
# weaker key — fpauth.NewJWTValidator enforces RFC 7518 §3.2). It lives in the Secret
# (NOT the ConfigMap) because it is sensitive symmetric key material.
# ----------------------------------------------------------------------------
secrets:
  create: true
  # When create=false, the Deployment envFrom's this externally-managed Secret.
  # Defaults to the chart's fullname when empty (see _helpers "secretName").
  existingSecret: ""
  # DEV-ONLY value. Override via --set or a non-committed -f secrets.local.yaml.
  # Full Postgres DSN the service reads as FP_DATABASE_URL. The database is
  # "fp_notification" on the shared Postgres in fp-infra. In prod the password
  # component comes from a managed secret store, not from this file.
  databaseUrl: "postgres://notification:dev-only-change-me@postgres.fp-infra.svc.cluster.local:5432/fp_notification?sslmode=disable"
  # HMAC-SHA256 key the auth interceptor uses to VERIFY caller JWTs (read as
  # FP_JWT_SECRET). This MUST match the auth service's signing key, or every token
  # auth mints will fail verification here. The service refuses to start if unset
  # (required) or shorter than 32 bytes. DEV-ONLY placeholder; in prod this comes
  # from the same external secret store that holds the auth service's signing key.
  jwtSecret: "dev-only-change-me-in-prod-min-32-bytes-of-entropy"

# ----------------------------------------------------------------------------
# Migrations — self-contained schema migrations via a migrate initContainer.
# ----------------------------------------------------------------------------
# WHY this block exists: the service's distroless runtime image bakes /migrations
# but has no shell and no migrate binary, so it cannot apply migrations itself.
# When `migrations.enabled` is true, the Deployment runs a golang-migrate
# initContainer BEFORE the app container starts. That initContainer mounts the
# migrations-configmap.yaml (the chart's migrations/*.sql) at /migrations and runs
# `migrate up`, so a fresh database is schema-ready before any traffic. The step
# is IDEMPOTENT: golang-migrate records the highest applied version in a
# schema_migrations table, so on a re-deploy with no new files it prints
# "no change" and exits 0 (no-op). Set enabled=false for services with no Postgres
# (inference-gateway, model-serving), or when you run migrations out-of-band (a
# separate Job / GitOps migration step).
#
# DSN SOURCE: the initContainer reads the SAME Postgres DSN the app uses — the
# FP_DATABASE_URL key from the service Secret, surfaced as the DATABASE_URL env var
# the migrate CLI expects. No second copy of the credential; one Secret feeds both
# the app and the migrator.
migrations:
  # Default true for Postgres-backed services. The initContainer ALSO self-gates
  # on a DSN being available (secrets.databaseUrl set, or an existingSecret), so
  # enabling this without a database can't render a broken initContainer.
  enabled: true
  image:
    # golang-migrate official image. Alpine-based, so it has /bin/sh (needed to
    # expand the DSN from env without baking it into the pod spec) and the
    # `migrate` binary on PATH. Pinned to an immutable tag for reproducible
    # rollouts — bump deliberately, never track a moving tag.
    repository: migrate/migrate
    tag: v4.18.3
    pullPolicy: IfNotPresent
  # Modest resources: the migrate step is short-lived and IO-light. Requests are
  # tiny so it never blocks scheduling; limits cap a pathological migration.
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 128Mi

# ----------------------------------------------------------------------------
# Resources — requests AND limits both set (a "Guaranteed" QoS-friendly shape).
#   requests = what the scheduler reserves; sets the floor and drives HPA math.
#   limits   = the ceiling; CPU is throttled, memory OOM-kills above it.
# Notification is moderately heavier than auth: it holds a pgx pool (inbox /
# delivery_log / preferences) AND a Redis client (dedup), and the consumer does
# fan-out delivery (HTTP/Slack/SMTP) with retries + per-URL circuit breakers.
# Still network-IO-bound, not CPU-bound — modest CPU, a bit more memory than
# auth for the two connection pools and in-flight delivery buffers. Tune from
# real RED metrics before raising. memory request==limit avoids OOM surprises
# under burst; CPU limit > request lets short bursts use idle node CPU.
# ----------------------------------------------------------------------------
resources:
  requests:
    cpu: 50m
    memory: 96Mi
  limits:
    cpu: 250m
    memory: 192Mi

# ----------------------------------------------------------------------------
# Autoscaling — HPA. Disabled by default; replicaCount governs when off.
# When enabled the HPA, not replicaCount, owns the replica number.
# `customMetrics` is wired for the Prometheus-Adapter / KEDA path the platform
# uses later (e.g. NATS consumer lag, gRPC RPS) — see templates/hpa.yaml.
#
# INTERVIEW NOTE: for a reactor like notification, the RIGHT scaling signal is
# NATS consumer LAG (KEDA's nats-jetstream scaler), not CPU — a delivery backlog
# shows up as lag long before it shows up as CPU. CPU is the safe default here;
# wire the lag metric via customMetrics when KEDA lands.
# ----------------------------------------------------------------------------
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70
  # Optional memory target; null/omit to disable the memory metric.
  targetMemoryUtilizationPercentage: 80
  # Extra metrics passed through verbatim into the HPA spec.metrics list
  # (autoscaling/v2). Example (custom Pods metric):
  #   - type: Pods
  #     pods:
  #       metric:
  #         name: grpc_requests_per_second
  #       target:
  #         type: AverageValue
  #         averageValue: "100"
  customMetrics: []
  # Scaling behavior — conservative scale-down to avoid flapping (thundering herd
  # of pod churn). Tune per service SLO.
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30

# PodDisruptionBudget — protects availability during VOLUNTARY disruptions only
# (node drains, cluster upgrades), NOT crashes. minAvailable: 1 lets the cluster
# evict at most (replicas-1) pods at once, so a drain never zeroes the service.
podDisruptionBudget:
  enabled: true
  minAvailable: 1

# ServiceAccount — own identity per service (least privilege, audit trail).
serviceAccount:
  create: true
  name: ""
  annotations: {}
  # automountServiceAccountToken: false — notification does NOT call the K8s API,
  # so it has no reason to carry a mountable API token. Mounting one needlessly
  # widens blast radius if the pod is compromised (token → API server). Flip to
  # true only for a service that genuinely uses the in-cluster K8s client.
  automountServiceAccountToken: false

# ----------------------------------------------------------------------------
# Pod-level security context — the non-negotiable hardened baseline. Applied to
# every service. These satisfy the "restricted" Pod Security Standard.
# ----------------------------------------------------------------------------
podSecurityContext:
  # runAsNonRoot makes the kubelet REFUSE to start the pod if the image's user
  # resolves to UID 0 — a guard against an accidentally-root image.
  runAsNonRoot: true
  # 65532 = the "nonroot" UID/GID baked into gcr.io/distroless/* base images,
  # which our multi-stage Dockerfile uses. Matches the image's filesystem owner.
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  # seccompProfile RuntimeDefault → the container runtime's default syscall
  # filter (blocks ~44 dangerous syscalls). Cheap, strong kernel-surface
  # reduction; required by the restricted PSS.
  seccompProfile:
    type: RuntimeDefault

# Container-level security context — defense in depth on top of the pod context.
containerSecurityContext:
  allowPrivilegeEscalation: false  # blocks setuid/gainprivs (no sudo-up inside)
  readOnlyRootFilesystem: true     # immutable rootfs; tamper-resistant, forces
                                   # explicit emptyDir for any writable path
  runAsNonRoot: true
  runAsUser: 65532
  capabilities:
    # Drop ALL Linux capabilities. A network service needs none — it binds a
    # high port (>1024) and does no privileged kernel ops. Least privilege.
    drop:
      - ALL

# ----------------------------------------------------------------------------
# Rolling update strategy — zero-downtime deploys for a stateless service.
#   maxUnavailable: 0 → never drop below desired count during a roll (no capacity
#                       dip; the PDB also enforces this for disruptions).
#   maxSurge: 1       → bring up one extra new pod, wait for it Ready, then retire
#                       an old one. Bounded extra cost (one pod) per step.
# ----------------------------------------------------------------------------
updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 0
    maxSurge: 1

# ----------------------------------------------------------------------------
# Probes — liveness on /healthz (process-alive only), readiness on /readyz
# (real dependency checks — Postgres + Redis + NATS once those readiness checks
# are wired in main.go). Both hit the HTTP health port. Tunable so each service
# can match its own startup profile. startupProbe shields slow cold starts
# (pgx pool warm-up, NATS consumer attach) from premature liveness restarts.
# ----------------------------------------------------------------------------
probes:
  liveness:
    enabled: true
    path: /healthz
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3
  readiness:
    enabled: true
    path: /readyz
    initialDelaySeconds: 3
    periodSeconds: 5
    timeoutSeconds: 2
    failureThreshold: 2
  startup:
    enabled: true
    path: /healthz
    initialDelaySeconds: 0
    periodSeconds: 3
    # 30 * 3s = 90s budget for the process to come up before liveness engages.
    failureThreshold: 30
    timeoutSeconds: 2

# ----------------------------------------------------------------------------
# topologySpreadConstraints — spread replicas across failure domains so a single
# node/zone loss can't take out a disproportionate share of pods. whenUnsatisfiable
# ScheduleAnyway keeps scheduling possible on small/single-zone clusters (Kind)
# while still preferring spread. The selector is injected by the template from the
# chart's standard selector labels.
# ----------------------------------------------------------------------------
topologySpread:
  enabled: true
  constraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: ScheduleAnyway

# Generic scheduling knobs, passed through untouched.
nodeSelector: {}
tolerations: []
affinity: {}

# Extra pod annotations/labels (merged into pod template metadata).
podAnnotations: {}
podLabels: {}

# terminationGracePeriodSeconds — must exceed the gRPC drain timeout (25s in
# pkg/grpcutil) so in-flight RPCs finish before SIGKILL. 30s gives 5s slack.
# (The NATS consumer also unsubscribes on SIGTERM so in-flight deliveries finish
# within the same window rather than being redelivered.)
terminationGracePeriodSeconds: 30

# ----------------------------------------------------------------------------
# ServiceMonitor (Prometheus Operator CRD) — DISABLED by default ON PURPOSE.
#
# Forgepoint's canonical metrics path is OTLP PUSH to the OTel Collector, which
# Prometheus then scrapes (see pkg/observability/setup.go). So there is normally
# NO per-pod /metrics endpoint to scrape. This ServiceMonitor exists for the
# alternative setup where a service is configured to expose /metrics directly on
# the health port (the prometheus.yml dev scrape config assumes this). Enable it
# only when you've turned on the in-process Prometheus exporter for the service.
# Guarded so `helm template` never emits a ServiceMonitor referencing a CRD the
# cluster may not have.
# ----------------------------------------------------------------------------
serviceMonitor:
  enabled: false
  # path/port of the metrics endpoint when enabled.
  path: /metrics
  portName: health
  interval: 30s
  scrapeTimeout: 10s
  # Extra labels so a Prometheus Operator with a label selector picks this up
  # (e.g. release: kube-prometheus-stack).
  labels: {}

# ----------------------------------------------------------------------------
# NetworkPolicy — default-deny ingress, allow only what the service needs.
# Zero-trust east-west: even inside the cluster, only fp-system callers reach
# notification, and notification may only egress to DNS, Postgres, Redis, NATS,
# and the OTel collector. Disable on clusters whose CNI doesn't enforce
# NetworkPolicy (it becomes a silent no-op there anyway).
#
# EGRESS DELTA vs fp-auth: notification adds `redis` (its dedup store). It does
# NOT need MinIO (stores no artifacts).
#
# OUTBOUND DELIVERY (Slack webhooks / external SMTP): the delivery adapter makes
# SSRF-GUARDED outbound HTTPS to the internet (e.g. hooks.slack.com:443). That
# egress is INTENTIONALLY left off here — opening 0.0.0.0/0:443 would defeat the
# point of zero-trust egress, and the app-layer SSRF guard (https-only,
# hooks.slack.com allowlist, private/loopback/link-local denylist, pinned-IP
# connect) is the real control. When the delivery adapter is enabled, add a
# narrowly-scoped egress rule here (ideally to a forward proxy / egress gateway,
# not raw internet) — see the `extraEgress` hook below.
# ----------------------------------------------------------------------------
networkPolicy:
  enabled: true
  # Namespaces allowed to send INGRESS to notification. fp-system holds the
  # platform services (gateway, other services) that call NotificationService's
  # control-plane RPCs (preferences / test-channel).
  ingressNamespaces:
    - fp-system
  # Egress allow-list. dns is special-cased to the kube-system resolver.
  egress:
    dns:
      enabled: true
    postgres:
      enabled: true
      namespace: fp-infra
      port: 5432
    redis:
      enabled: true
      namespace: fp-infra
      port: 6379
    nats:
      enabled: true
      namespace: fp-infra
      port: 4222
    otlp:
      enabled: true
      namespace: fp-infra
      port: 4317
    # extraEgress — passthrough for additional egress rules rendered verbatim
    # into spec.egress (networking.k8s.io/v1 shape). This is where the
    # SSRF-guarded outbound delivery rule goes once the delivery adapter is on
    # (e.g. to an egress gateway on 443). Empty = no extra egress, fully locked.
    extraEgress: []
