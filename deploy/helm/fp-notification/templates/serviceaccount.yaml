{{- if .Values.serviceAccount.create -}}
# ============================================================================
# ServiceAccount — the pod's in-cluster IDENTITY.
# ============================================================================
# Every workload runs AS a ServiceAccount. Giving notification its OWN SA
# (instead of the namespace "default") means: (1) least privilege — we can bind
# exactly the RBAC notification needs (currently none) without granting it to
# unrelated pods, and (2) a clean audit trail — API-server audit logs attribute
# actions to this SA.
#
# automountServiceAccountToken: false — notification never talks to the
# Kubernetes API, so it has no reason to carry a mountable bearer token. Not
# mounting it means a compromised pod cannot use the token to reach the API
# server. We set it on BOTH the SA (default for pods using it) and the pod spec
# (belt and suspenders).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "fp-notification.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fp-notification.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
{{- end }}
