# =============================================================================
# require-resource-requests-and-limits — no unbounded pods
# =============================================================================
#
# WHY THIS MATTERS (the noisy-neighbor / OOM story)
# -------------------------------------------------
# A container with NO memory limit can consume the whole node and trigger the
# kernel OOM killer, which may evict OTHER tenants' pods — a classic noisy-
# neighbor outage. A container with no CPU request gets scheduled with zero
# guaranteed share and can be starved. requests drive SCHEDULING (how much the
# scheduler reserves) and the QoS class; limits drive ENFORCEMENT (CPU throttle,
# memory OOM-kill). Requiring all four (cpu/memory × requests/limits) yields a
# predictable, capacity-plannable cluster.
#
# WHAT WE ALREADY DO: fp-auth's resources come from values.yaml; every infra pod
# (postgres/redis/nats/minio) sets explicit requests AND limits. This policy
# makes that mandatory so a future manifest can't ship an unbounded pod.
#
# DESIGN CHOICE: require BOTH requests and limits for BOTH cpu and memory. An
# alternative (Kyverno's "require-requests-limits" sample) only checks limits;
# we are stricter because requests are what make the scheduler's bin-packing and
# the HPA's utilization math correct. Tradeoff: a touch more boilerplate per pod,
# bought back by predictable scheduling and no surprise OOM evictions.
#
# Requests vs limits, and QoS classes: requests=reserved &
# scheduling; limits=hard cap & enforcement; Guaranteed (req==lim for all),
# Burstable (some set), BestEffort (none → first to be evicted). This policy
# pushes every fp pod to at least Burstable, usually toward Guaranteed.
# =============================================================================
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-resource-requests-and-limits
  annotations:
    policies.kyverno.io/title: Require Resource Requests and Limits
    policies.kyverno.io/category: Resource Management
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Every container must declare CPU and memory requests AND limits so no pod
      runs unbounded (prevents noisy-neighbor OOM and scheduler starvation).
spec:
  validationFailureAction: Audit
  background: true
  rules:
    - name: require-requests-and-limits
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - fp-system
                - fp-models
                - fp-jobs
                - fp-infra
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - kube-node-lease
                - kube-public
      validate:
        message: >-
          Every container must set resources.requests.{cpu,memory} and
          resources.limits.{cpu,memory}. Unbounded pods are not allowed.
        pattern:
          spec:
            # initContainers/ephemeralContainers are optional (`=()`) but, if
            # present, must also be bounded — an init step can still OOM a node.
            =(initContainers):
              - resources:
                  requests:
                    memory: "?*"   # ?* = "any non-empty string" (field must exist)
                    cpu: "?*"
                  limits:
                    memory: "?*"
                    cpu: "?*"
            =(ephemeralContainers):
              - resources:
                  requests:
                    memory: "?*"
                    cpu: "?*"
                  limits:
                    memory: "?*"
                    cpu: "?*"
            containers:
              - resources:
                  requests:
                    memory: "?*"
                    cpu: "?*"
                  limits:
                    memory: "?*"
                    cpu: "?*"
