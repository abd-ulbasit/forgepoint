# =============================================================================
# Kustomization — deploy/rollouts/
# Phase 21: Progressive Delivery (Argo Rollouts)
# =============================================================================
#
# HOW TO APPLY
# -------------
# Prerequisite: Argo Rollouts controller must be installed first (see README.md).
#
#   # Dry-run (verify manifests parse + validate; requires Rollout CRDs present):
#   kubectl apply -k deploy/rollouts/ --dry-run=server
#
#   # Apply all Rollouts, Services, and AnalysisTemplates:
#   kubectl apply -k deploy/rollouts/
#
# HOW THIS FITS INTO GITOPS (Phase 20)
# --------------------------------------
# Add a deploy/argocd/apps/rollouts.yaml Application pointing at deploy/rollouts/
# once the Argo Rollouts controller is installed. Example Application fragment:
#
#   spec:
#     source:
#       repoURL: https://github.com/abd-ulbasit/forgepoint
#       path: deploy/rollouts
#       targetRevision: HEAD
#     destination:
#       server: https://kubernetes.default.svc
#       # This bundle spans TWO namespaces (fp-system + fp-models). Each resource
#       # carries its own metadata.namespace, so the Application destination.namespace
#       # is only the DEFAULT for any resource that omits one — here every resource
#       # sets its own, and ArgoCD honors those. Ensure both fp-system and fp-models
#       # are in the AppProject's destination allow-list.
#       namespace: fp-system
#     syncPolicy:
#       automated:
#         prune: true
#         selfHeal: true
#
# IMPORTANT: The Helm chart Deployment for inference-gateway and model-serving
# must be disabled (deployment.enabled: false in chart values) before applying
# these Rollouts. Two owners of the same pod template will fight each other.
# The Rollout replaces the Deployment; all other chart resources remain.
# =============================================================================

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# NO global `namespace:` directive ON PURPOSE.
# ---------------------------------------------------------------------------
# Kustomize's top-level `namespace:` REWRITES metadata.namespace on EVERY resource
# unconditionally — it cannot be "fp-system for some, fp-models for others". This
# bundle is split across TWO namespaces:
#   * inference-gateway Rollout/Services/AnalysisTemplates → fp-system
#   * model-serving      Rollout/Services/AnalysisTemplates → fp-models
#     (serving's authoritative home — see rollout-model-serving.yaml's namespace note;
#      the mesh authz, BFF config, and gateway egress all target fp-models)
# A single global `namespace: fp-system` here was the bug: it silently forced the
# model-serving resources into fp-system regardless of their own metadata. Each
# resource now carries its OWN explicit metadata.namespace and we let those stand.
# (If you ever need a namespace transform, use per-component overlays, not a global.)
# ---------------------------------------------------------------------------

resources:
  # Canary Rollouts (replace the Helm chart Deployments).
  - rollout-inference-gateway.yaml
  - rollout-model-serving.yaml

  # Stable + canary Service pairs (one set per Rollout).
  - services-inference-gateway.yaml
  - services-model-serving.yaml

  # AnalysisTemplates — metric gate definitions.
  # inference-gateway: success-rate + latency.
  - analysis-template-inference-gateway.yaml
  # model-serving: success-rate + latency + drift-score (closed-loop gate).
  - analysis-template-model-serving.yaml

labels:
  - pairs:
      forgepoint.io/managed-by-phase: "21"
