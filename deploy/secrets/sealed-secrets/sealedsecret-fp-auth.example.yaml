# ============================================================================
# SealedSecret (EXAMPLE) — fp-auth, for the homelab/k3s cluster (NO cloud)
# ============================================================================
# WHY THIS FILE EXISTS / WHEN TO USE IT
#   The External Secrets path (../external-secrets/) needs AWS Secrets Manager +
#   IRSA. The homelab k3s cluster has neither AWS nor an OIDC provider, so ESO has
#   no backend to read from. Sealed Secrets is the GitOps-safe alternative for that
#   environment: instead of fetching from a cloud store, you ENCRYPT the secret
#   locally with `kubeseal` against the in-cluster controller's PUBLIC key, and
#   commit the resulting ciphertext. Only the controller (holding the matching
#   PRIVATE key) can decrypt it, and only inside this cluster. See ./README.md.
#
# IS THIS SAFE TO COMMIT? YES.
#   The `spec.encryptedData` values below are CIPHERTEXT, asymmetrically encrypted
#   (RSA-OAEP + AES) to the controller's key. Without the controller's private key
#   they are useless — so unlike a plaintext/base64 Secret, committing this leaks
#   nothing. The controller decrypts it in-cluster into a normal Secret named
#   `fp-auth`, which the fp-auth Deployment envFrom's (same wiring as the ESO path:
#   chart secrets.create=false, secrets.existingSecret=fp-auth).
#
# ⚠️  THE VALUES BELOW ARE PLACEHOLDERS, NOT REAL CIPHERTEXT.
#   This repo intentionally ships NO operable secret material. You MUST regenerate
#   `encryptedData` with kubeseal against YOUR cluster's controller (see README) —
#   sealed values are bound to one specific controller key and won't decrypt
#   anywhere else. Replace the REDACTED... strings before applying.
#
# scope: by default kubeseal seals a value to ONE namespace+name (strict scope):
#   the ciphertext only decrypts into a Secret of THIS name in THIS namespace.
#   That prevents an attacker from re-using the sealed blob under a different name
#   to trick the controller into decrypting it elsewhere. Keep strict scope unless
#   you have a reason to loosen it.
# ============================================================================
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: fp-auth
  namespace: fp-system
spec:
  encryptedData:
    # Each value is the kubeseal-encrypted ciphertext of one secret key.
    # PLACEHOLDERS — regenerate with kubeseal (see ./README.md). Real values are
    # long base64 RSA-OAEP blobs, ~600+ chars each.
    FP_JWT_SECRET: REDACTED_SEALED_CIPHERTEXT_REGENERATE_WITH_KUBESEAL
    FP_DATABASE_URL: REDACTED_SEALED_CIPHERTEXT_REGENERATE_WITH_KUBESEAL
  template:
    # The controller produces a Secret with this metadata + type. encryptedData
    # keys become the decrypted Secret's data keys (FP_JWT_SECRET, FP_DATABASE_URL).
    metadata:
      name: fp-auth
      namespace: fp-system
      labels:
        app.kubernetes.io/name: fp-auth
        app.kubernetes.io/part-of: forgepoint
    type: Opaque
