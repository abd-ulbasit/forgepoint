# ============================================================================
# ExternalSecret — fp-auth (JWT signing key + Postgres DSN)
# ============================================================================
# WHAT THIS DOES
#   ESO reads the referenced AWS Secrets Manager secrets and *materializes* a
#   single Kubernetes Secret named `fp-auth` in fp-system. The auth Deployment
#   envFrom's that Secret to get FP_JWT_SECRET and FP_DATABASE_URL — the exact two
#   keys deploy/helm/fp-auth/templates/secret.yaml would otherwise hold as DEV
#   placeholders. Here, in prod, the chart is installed with secrets.create=false
#   and secrets.existingSecret=fp-auth, so the chart creates NO Secret of its own
#   and the pod consumes THIS ESO-managed one (see ./README.md "Wiring fp-auth").
#
# WHY TWO DIFFERENT SOURCES FOR ONE TARGET SECRET
#   - FP_DATABASE_URL: the Postgres DSN is INFRASTRUCTURE the RDS Terraform module
#     owns, and it is ASSEMBLED HERE from two sources so the password never passes
#     through Terraform state:
#       * username + password from the secret RDS itself creates and rotates
#         (manage_master_user_password). Its name is generated (rds!db-...), so it
#         is referenced by ARN: replace <RDS_MASTER_USER_SECRET_ARN> with the
#         `rds_master_user_secret_arn` Terraform output.
#       * host, port, dbname, sslmode from "<prefix>/rds/postgres", a
#         connection-info secret with no password in it.
#     The template below URL-escapes the credentials into
#     postgres://user:pass@host:port/db?sslmode=require. No password in Git.
#   - FP_JWT_SECRET: the HMAC-SHA256 signing key is an APPLICATION secret, not a
#     cloud resource, so Terraform does NOT create it (it has no business minting
#     app keys). Instead it lives in its own Secrets Manager secret
#     "<prefix>/auth/jwt" that an operator creates ONCE, out-of-band, e.g.:
#       aws secretsmanager create-secret \
#         --name forgepoint-dev/auth/jwt \
#         --secret-string "{\"jwt_secret\":\"$(openssl rand -base64 48)\"}"
#     For ESO to read it, add that secret's ARN to the external_secrets IRSA role's
#     secret_arns list in environments/dev/main.tf (alongside the RDS/Redis ARNs).
#     The generated key never touches Git or a values file.
#
# dataFrom vs data: we use `data` (explicit key-by-key) rather than `dataFrom`
# (dump every JSON field) so the resulting K8s Secret contains EXACTLY the two env
# vars the service expects — no stray `host`/`port`/`username` keys leaking in as
# env. Explicit is safer and self-documenting.
#
# refreshInterval: ESO re-reads the backend on this cadence. RDS rotates the
# managed master password (every 7 days by default); ESO repulls and updates the
# K8s Secret within ~1h. Env vars from envFrom only change when a pod restarts,
# so pair this with a reloader (or a scheduled rollout): open connections survive
# a rotation, NEW connections need the new password. Shorter = fresher but more
# AWS API calls.
# ============================================================================
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: fp-auth
  namespace: fp-system
  labels:
    app.kubernetes.io/name: fp-auth
    app.kubernetes.io/part-of: forgepoint
    app.kubernetes.io/managed-by: argocd
spec:
  refreshInterval: 1h
  secretStoreRef:
    # The cluster-scoped store defined in ./cluster-secret-store.yaml.
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    # The K8s Secret ESO creates/owns. THIS name is what the fp-auth chart's
    # secrets.existingSecret must point at.
    name: fp-auth
    # Owner: ESO fully manages this Secret (creates it, and deletes it if this
    # ExternalSecret is removed). The Secret is NOT in Git — ESO writes it at
    # runtime from the AWS backend.
    creationPolicy: Owner
    template:
      # Opaque + these become env vars via the Deployment's envFrom. Key names
      # match what services/auth/cmd/server reads (FP_JWT_SECRET, FP_DATABASE_URL).
      # With template.data set, ONLY these keys land in the Secret; the fetched
      # pg_* values below are template inputs, not env vars.
      type: Opaque
      engineVersion: v2
      data:
        FP_JWT_SECRET: "{{ .jwt_secret }}"
        FP_DATABASE_URL: "postgres://{{ .pg_username | urlquery }}:{{ .pg_password | urlquery }}@{{ .pg_host }}:{{ .pg_port }}/{{ .pg_dbname }}?sslmode={{ .pg_sslmode }}"
  data:
    # ---- JWT signing key (app secret, "<prefix>/auth/jwt" JSON -> jwt_secret) ----
    - secretKey: jwt_secret
      remoteRef:
        # PLACEHOLDER name — matches the operator-created SM secret described above.
        key: "forgepoint-dev/auth/jwt"
        property: jwt_secret
    # ---- Postgres credentials (RDS-managed secret, rotated by RDS) -------------
    - secretKey: pg_username
      remoteRef:
        # PLACEHOLDER: the `rds_master_user_secret_arn` Terraform output.
        key: "<RDS_MASTER_USER_SECRET_ARN>"
        property: username
    - secretKey: pg_password
      remoteRef:
        key: "<RDS_MASTER_USER_SECRET_ARN>"
        property: password
    # ---- Postgres connection info (RDS module "<prefix>/rds/postgres") --------
    # Matches aws_secretsmanager_secret.db.name = "${name_prefix}/rds/postgres"
    # (deploy/terraform/modules/rds/main.tf). PLACEHOLDER prefix shown.
    - secretKey: pg_host
      remoteRef:
        key: "forgepoint-dev/rds/postgres"
        property: host
    - secretKey: pg_port
      remoteRef:
        key: "forgepoint-dev/rds/postgres"
        property: port
    - secretKey: pg_dbname
      remoteRef:
        key: "forgepoint-dev/rds/postgres"
        property: dbname
    - secretKey: pg_sslmode
      remoteRef:
        key: "forgepoint-dev/rds/postgres"
        property: sslmode
