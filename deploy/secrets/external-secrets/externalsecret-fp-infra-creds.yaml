# ============================================================================
# ExternalSecret — shared infra credentials (Postgres + Redis connection info)
# ============================================================================
# WHAT THIS DOES
#   Materializes ONE K8s Secret `fp-infra-creds` in fp-system holding the full
#   connection material for the shared data stores: the Postgres DSN and the
#   Redis rediss:// URL (plus discrete host/port/token fields if a client wants to
#   build its own connection). Services that talk to Postgres/Redis but don't have
#   their own per-service ExternalSecret can envFrom (or selectively reference)
#   this one. It is the K8s-side projection of the two Secrets Manager entries the
#   RDS and ElastiCache Terraform modules create.
#
#   This is deliberately SEPARATE from externalsecret-fp-auth.yaml: fp-auth needs a
#   JWT key (app secret) plus its DB URL under specific env-var names; the shared
#   infra creds are generic connection strings other services consume. Splitting
#   them keeps each target Secret minimal and least-exposed (a service that only
#   needs Redis shouldn't receive the Postgres password, and vice versa — refine
#   with separate ExternalSecrets per store if you want stricter isolation).
#
# SOURCES (both are JSON blobs Terraform writes; we extract named properties):
#   - "<prefix>/rds/postgres"        (modules/rds)        -> dsn, host, port
#   - "<prefix>/elasticache/redis"   (modules/elasticache)-> url, host, port, auth_token
#   No password/token/URL value is ever written here — only the AWS key NAME and
#   the JSON property to pull. The plaintext lives in AWS, encrypted under KMS.
#
# WHY pull discrete host/port AND the ready URL/DSN: some clients want the full
# connection string (simplest), others build their own (e.g. a pool with custom
# TLS). Exposing both costs nothing and avoids re-parsing the URL in app code.
# ============================================================================
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: fp-infra-creds
  namespace: fp-system
  labels:
    app.kubernetes.io/name: fp-infra-creds
    app.kubernetes.io/part-of: forgepoint
    app.kubernetes.io/managed-by: argocd
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: fp-infra-creds
    creationPolicy: Owner
    template:
      type: Opaque
  data:
    # ---- Postgres (RDS module: "<prefix>/rds/postgres") --------------------
    - secretKey: FP_DATABASE_URL
      remoteRef:
        key: "forgepoint-dev/rds/postgres" # PLACEHOLDER prefix
        property: dsn
    - secretKey: POSTGRES_HOST
      remoteRef:
        key: "forgepoint-dev/rds/postgres"
        property: host
    - secretKey: POSTGRES_PORT
      remoteRef:
        key: "forgepoint-dev/rds/postgres"
        property: port
    # ---- Redis (ElastiCache module: "<prefix>/elasticache/redis") ----------
    - secretKey: FP_REDIS_URL
      remoteRef:
        key: "forgepoint-dev/elasticache/redis" # PLACEHOLDER prefix
        property: url
    - secretKey: REDIS_HOST
      remoteRef:
        key: "forgepoint-dev/elasticache/redis"
        property: host
    - secretKey: REDIS_PORT
      remoteRef:
        key: "forgepoint-dev/elasticache/redis"
        property: port
    - secretKey: REDIS_AUTH_TOKEN
      remoteRef:
        key: "forgepoint-dev/elasticache/redis"
        property: auth_token
