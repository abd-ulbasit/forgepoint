# ============================================================================
# ClusterSecretStore — AWS Secrets Manager, authenticated via IRSA
# ============================================================================
# WHAT THIS IS
#   A ClusterSecretStore is the External Secrets Operator (ESO) object that says
#   "here is a backend I can read secrets FROM, and here is how I authenticate to
#   it." It is the bridge between AWS Secrets Manager (where the real credentials
#   live, see deploy/terraform/modules/{rds,elasticache}) and the K8s Secrets that
#   ESO will materialize for the pods (see ./externalsecret-*.yaml).
#
# WHY ClusterSecretStore (cluster-scoped) and not SecretStore (namespaced)?
#   Our credential secrets feed services across MULTIPLE namespaces (fp-system,
#   fp-models, ...). A namespaced SecretStore would have to be duplicated in each
#   namespace. One ClusterSecretStore is referenced by ExternalSecrets in any
#   namespace, so we wire the AWS backend + IRSA auth ONCE. Tradeoff: it's a
#   cluster-wide object, so RBAC on who can create ExternalSecrets that target it
#   matters — but the IRSA role itself is least-privilege (read only the 3 secret
#   ARNs Terraform created), so a rogue ExternalSecret still can't read arbitrary
#   AWS secrets.
#
# ----------------------------------------------------------------------------
# THE GITOPS SECRETS PROBLEM (the whole reason this file exists)
# ----------------------------------------------------------------------------
#   GitOps means "the Git repo is the source of truth; a controller (ArgoCD, see
#   ADR-0002) reconciles the cluster to match Git." That is great for Deployments
#   and ConfigMaps — but a plaintext Kubernetes Secret committed to Git is a
#   credential leak: anyone with repo read access (or a leaked clone, a fork, the
#   git history forever) has your DB password. base64 in a Secret manifest is NOT
#   encryption — it is trivially reversible. So we must NEVER commit a plaintext
#   (or merely base64'd) Secret.
#
#   ESO solves this by committing only a *pointer*: this ClusterSecretStore and
#   the ExternalSecret manifests describe WHERE the secret is and WHICH keys to
#   pull — never the secret VALUE. The actual material stays in AWS Secrets
#   Manager, encrypted with a KMS CMK, and only ever exists in plaintext (a) inside
#   AWS, and (b) as a K8s Secret that ESO writes at runtime into etcd (encrypt
#   etcd at rest in prod). Nothing sensitive is in Git. This file is safe to commit.
#
# ----------------------------------------------------------------------------
# HOW AUTH WORKS HERE — IRSA, no static AWS keys (the interview answer)
# ----------------------------------------------------------------------------
#   We do NOT put an AWS access key / secret key in this manifest (that would be
#   the same leak problem, one level up). Instead ESO's controller pod runs as the
#   `external-secrets` ServiceAccount in fp-system, which Terraform's iam module
#   bound to a dedicated IRSA role (deploy/terraform/modules/iam +
#   environments/dev/main.tf -> roles.external_secrets). That role's trust policy
#   only lets THAT ServiceAccount assume it, and its permission policy only allows
#   secretsmanager:GetSecretValue on the exact RDS + Redis secret ARNs (plus
#   kms:Decrypt on their CMKs). So ESO can read precisely those secrets and nothing
#   else, using short-lived STS credentials — no long-lived keys anywhere.
#
#   spec.provider.aws.auth.jwt.serviceAccountRef tells ESO to authenticate by
#   presenting the projected OIDC token of that ServiceAccount (the JWT IRSA
#   issues) to STS. That is the same AssumeRoleWithWebIdentity flow the iam module
#   documents.
# ----------------------------------------------------------------------------
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
  # No namespace: ClusterSecretStore is cluster-scoped on purpose (see header).
  labels:
    app.kubernetes.io/part-of: forgepoint
    app.kubernetes.io/managed-by: argocd
spec:
  provider:
    aws:
      # SecretsManager (not ParameterStore) — matches where Terraform writes the
      # RDS/Redis JSON blobs (aws_secretsmanager_secret.{db,redis}).
      service: SecretsManager
      # Region must match where Terraform created the secrets. Placeholder — set to
      # the dev env's region (e.g. via ArgoCD parameter / Kustomize / Helm value).
      region: "<AWS_REGION>" # e.g. us-east-1  (PLACEHOLDER — no real value)
      auth:
        # IRSA: authenticate as the ESO controller's ServiceAccount. ESO presents
        # that SA's projected OIDC JWT to STS, which returns creds for the
        # external_secrets IRSA role. No static AWS keys in this manifest.
        jwt:
          serviceAccountRef:
            # Must match the SA Terraform pinned the role to:
            #   environments/dev/main.tf roles.external_secrets:
            #     namespace=fp-system, service_account_name=external-secrets
            # That SA must carry the annotation:
            #   eks.amazonaws.com/role-arn: <IRSA_EXTERNAL_SECRETS_ROLE_ARN>
            # ARN placeholder (from module.iam.role_arns["external_secrets"]):
            #   arn:aws:iam::<AWS_ACCOUNT_ID>:role/forgepoint-dev-irsa-external_secrets
            name: external-secrets
            namespace: fp-system
