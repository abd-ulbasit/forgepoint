# ============================================================================
# ARGOCD APPPROJECTS — forgepoint-bootstrap (root app) + forgepoint (workloads)
# ============================================================================
# An AppProject is ArgoCD's TENANCY + GUARDRAIL boundary. Every Application
# belongs to exactly one project, and the project caps what those Applications
# are ALLOWED to do, regardless of what their manifests ask for. Think of it as
# an RBAC + admission-policy envelope around a set of apps.
#
# WHY TWO PROJECTS (this used to be one):
#   The single "forgepoint" project allowed the `argocd` namespace as a
#   destination (so the root app could create child Applications) AND
#   whitelisted Secret, Role and RoleBinding. Together that meant ANY chart or
#   manifest merged to main could write a Secret into `argocd` (e.g. a cluster
#   or repository credential Secret with argocd.argoproj.io/secret-type) or a
#   RoleBinding granting itself read on Argo CD's own secrets: privilege
#   escalation through Git, auto-synced. It also never whitelisted the
#   Application kind, which the root app-of-apps exists to create.
#
#   Now:
#   - forgepoint-bootstrap (root.yaml only): may create ONE kind,
#     argoproj.io/Application, and only in `argocd`. Nothing else.
#   - forgepoint (every child app): fp-* namespaces only, never `argocd`, no
#     RBAC kinds, no CRDs.
#   - default: locked to nothing (default-project.yaml), so a child Application
#     that names `project: default` cannot escape both of the above.
#
# HOW GitOps IS STOPPED FROM BECOMING A CLUSTER-ADMIN BACKDOOR: these objects —
# the sourceRepos allow-list, the destinations allow-list, and the
# namespaced/clusterResource allow-lists below. They are applied by hand
# (kubectl), never synced by the root app, so a Git change cannot widen them.
#
# SPELLING MATTERS: the field is `namespaceResourceWhitelist` (no "d"). Argo CD
# treats a MISSING namespaced whitelist as "every namespaced kind is allowed",
# so a misspelled key is not just ignored, it silently removes the guardrail
# (if it gets past kubectl's strict field validation at all). Validate with
#   kubectl apply --dry-run=server -f deploy/argocd/project.yaml
# against a cluster that has the Argo CD CRDs before relying on these limits.
# ============================================================================
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: forgepoint-bootstrap
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: forgepoint
spec:
  description: Root app-of-apps only — may create Application objects in argocd, nothing else.

  sourceRepos:
    - https://github.com/abd-ulbasit/forgepoint.git

  # The child Application CRs live in the namespace Argo CD runs in.
  destinations:
    - server: https://kubernetes.default.svc
      namespace: argocd

  # No cluster-scoped kinds at all.
  clusterResourceWhitelist: []

  # Exactly one kind. In particular NOT Secret (Argo CD reads cluster and repo
  # credentials from Secrets in this namespace) and NOT AppProject (a project
  # that could edit projects could lift its own limits).
  namespaceResourceWhitelist:
    - group: argoproj.io
      kind: Application

  orphanedResources:
    warn: true
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: forgepoint
  # AppProjects live in the namespace ArgoCD itself runs in (conventionally
  # `argocd`). They are NOT where your workloads land — destinations control that.
  namespace: argocd
  # This finalizer makes ArgoCD cascade-delete the project's child resources
  # cleanly if the project is ever removed, instead of orphaning them.
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/part-of: forgepoint
spec:
  description: Forgepoint ML platform — all services + data infra, fp-* namespaces only.

  # --------------------------------------------------------------------------
  # sourceRepos — WHICH Git repos Applications in this project may pull from.
  # A wildcard "*" would let anyone point an app at an arbitrary repo (supply-
  # chain risk). We pin to this one mono-repo. For a private repo, ArgoCD reads
  # credentials from a separately managed `repo-creds` Secret (label
  # argocd.argoproj.io/secret-type=repository) — never inline a token here.
  # --------------------------------------------------------------------------
  sourceRepos:
    - https://github.com/abd-ulbasit/forgepoint.git

  # --------------------------------------------------------------------------
  # destinations — WHICH (cluster, namespace) pairs apps may deploy into.
  # Only the four Forgepoint namespaces on the in-cluster server. `argocd`,
  # kube-system and default are denied even if a child app asks for them.
  # (`argocd` used to be listed here for the root app; it now has its own
  # project, forgepoint-bootstrap.)
  # --------------------------------------------------------------------------
  destinations:
    - server: https://kubernetes.default.svc
      namespace: fp-system
    - server: https://kubernetes.default.svc
      namespace: fp-infra
    - server: https://kubernetes.default.svc
      namespace: fp-models
    - server: https://kubernetes.default.svc
      namespace: fp-jobs

  # --------------------------------------------------------------------------
  # clusterResourceWhitelist — CLUSTER-SCOPED kinds apps may create.
  # Only Namespace (infra creates fp-infra/fp-system/fp-models/fp-jobs).
  # CustomResourceDefinition was listed "for future operators"; nothing creates
  # one, and a CRD write can replace the schema of ANY API group in the
  # cluster, so it is removed until an operator genuinely needs it (and then
  # belongs in its own project). No ClusterRole / ClusterRoleBinding, ever.
  # --------------------------------------------------------------------------
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace

  # --------------------------------------------------------------------------
  # namespaceResourceWhitelist — NAMESPACED kinds apps may create.
  # Deny-by-default. Exactly what the fp-* charts and deploy/k8s/infra render
  # today (checked with `helm template` / the infra manifests):
  #   workloads      Deployment, StatefulSet, Job (the MinIO bucket init),
  #                  Service, ConfigMap, Secret, ServiceAccount,
  #                  PersistentVolumeClaim
  #   scaling/avail  HorizontalPodAutoscaler, PodDisruptionBudget
  #   network        NetworkPolicy
  #   operator CRs   ServiceMonitor (Prometheus Operator)
  # Role/RoleBinding were whitelisted but nothing renders them; namespaced RBAC
  # written from Git is a privilege grant, so add it back only with a reason.
  # batch/Job was MISSING although the infra kustomization renders one, so the
  # fp-infra sync could not have succeeded. Secret stays (infra placeholders and
  # the charts' optional dev Secret), but only in fp-* namespaces now.
  # --------------------------------------------------------------------------
  namespaceResourceWhitelist:
    - group: ""
      kind: ConfigMap
    - group: ""
      kind: Secret
    - group: ""
      kind: Service
    - group: ""
      kind: ServiceAccount
    - group: ""
      kind: PersistentVolumeClaim
    - group: apps
      kind: Deployment
    - group: apps
      kind: StatefulSet
    - group: batch
      kind: Job
    - group: autoscaling
      kind: HorizontalPodAutoscaler
    - group: policy
      kind: PodDisruptionBudget
    - group: networking.k8s.io
      kind: NetworkPolicy
    - group: monitoring.coreos.com
      kind: ServiceMonitor

  # --------------------------------------------------------------------------
  # orphanedResources — surface (don't auto-delete) resources that exist in a
  # project namespace but aren't tracked by any Application.
  # --------------------------------------------------------------------------
  orphanedResources:
    warn: true
