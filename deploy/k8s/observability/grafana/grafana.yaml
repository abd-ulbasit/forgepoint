# ============================================================================
# GRAFANA — the single pane of glass over the three pillars
# ============================================================================
#
# Grafana correlates metrics (Prometheus), logs (Loki), and traces (Tempo):
#   click a latency spike → jump to the logs for that window → open the exact
#   distributed trace. Datasources + a starter dashboard are AUTO-PROVISIONED
#   (adapted from deploy/grafana/provisioning) so the stack is usable on first
#   boot with zero manual UI clicking.
#
# SECURITY — the docker-compose hardening, applied harder:
#   The local stack allowed ANONYMOUS access (Viewer role) for dev convenience.
#   In-cluster we DISABLE anonymous access entirely and require login. The admin
#   password comes from a Secret (placeholder here; real value via External
#   Secrets / Sealed Secrets in prod — same policy as postgres/minio creds). We
#   NEVER enable anonymous Admin, and we don't even enable anonymous Viewer in
#   the cluster: access to dashboards over the network requires authentication.
#
# WHY a Deployment (not StatefulSet): Grafana here is STATELESS — datasources and
#   dashboards are provisioned from ConfigMaps (config as code), not authored in
#   the UI. There is no durable state worth a PVC, so a Deployment (clean rolling
#   updates) is correct. (If we later allowed UI-authored dashboards/users we'd
#   add a PVC or, better, the DB-backed mode — documented tradeoff.)
# ============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: grafana-credentials
  namespace: fp-infra
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: dashboards
    app.kubernetes.io/part-of: forgepoint
type: Opaque
stringData:
  # ⚠️ PLACEHOLDER CREDENTIALS — NOT a real secret. Same policy as postgres /
  # minio: in production this value is delivered by External Secrets Operator
  # (AWS Secrets Manager / Vault) or committed as a Sealed Secret ciphertext —
  # never plaintext. This documents the SHAPE; rotate before any real exposure.
  admin-user: admin
  admin-password: changeme-admin
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: fp-infra
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: dashboards
    app.kubernetes.io/part-of: forgepoint
data:
  # datasources.yaml — adapted from deploy/grafana/provisioning/datasources.
  # The ONLY change vs local: URLs use in-cluster FQDNs (svc.fp-infra). The
  # cross-pillar correlation wiring (traces↔metrics↔logs) is preserved verbatim.
  datasources.yaml: |
    apiVersion: 1
    datasources:
      # Prometheus — metrics (RED: Rate, Errors, Duration). Default datasource.
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://prometheus.fp-infra.svc.cluster.local:9090
        isDefault: true
        editable: false

      # Tempo — distributed traces. tracesToLogs/tracesToMetrics enable the
      # "trace → its logs / its RED metrics" jumps in the UI.
      - name: Tempo
        uid: tempo
        type: tempo
        access: proxy
        url: http://tempo.fp-infra.svc.cluster.local:3200
        editable: false
        jsonData:
          tracesToMetrics:
            datasourceUid: prometheus
          tracesToLogs:
            datasourceUid: loki
          nodeGraph:
            enabled: true

      # Loki — logs. derivedFields turns a "trace_id":"..." field in a structured
      # JSON log line into a clickable link straight to the Tempo trace —
      # closing the logs→traces loop. (Matches the local provisioning regex.)
      - name: Loki
        uid: loki
        type: loki
        access: proxy
        url: http://loki.fp-infra.svc.cluster.local:3100
        editable: false
        jsonData:
          derivedFields:
            - datasourceUid: tempo
              matcherRegex: '"trace_id":"(\w+)"'
              name: TraceID
              url: '$${__value.raw}'
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-providers
  namespace: fp-infra
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: dashboards
    app.kubernetes.io/part-of: forgepoint
data:
  # Tell Grafana to load dashboard JSON files from a directory (the dashboards
  # ConfigMap mounted below). This is the "dashboards as code" provider — edits
  # in the UI are not persisted; the source of truth is git.
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: forgepoint
        orgId: 1
        folder: Forgepoint
        type: file
        disableDeletion: true
        editable: false
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: fp-infra
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: dashboards
    app.kubernetes.io/part-of: forgepoint
data:
  # A minimal starter "platform overview" dashboard so the stack shows signal on
  # first boot. It queries the OTel-collector internal metrics (always present
  # once the collector runs) — RED panels for accepted/refused spans + the
  # collector's memory. Service-specific dashboards get added per service later.
  platform-overview.json: |
    {
      "uid": "fp-platform-overview",
      "title": "Forgepoint — Platform Overview",
      "schemaVersion": 39,
      "version": 1,
      "editable": false,
      "time": { "from": "now-1h", "to": "now" },
      "refresh": "30s",
      "panels": [
        {
          "id": 1,
          "title": "OTLP spans accepted (rate/s)",
          "type": "timeseries",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "targets": [
            {
              "refId": "A",
              "expr": "rate(otelcol_receiver_accepted_spans_total[5m])"
            }
          ]
        },
        {
          "id": 2,
          "title": "OTLP spans refused (rate/s) — back-pressure signal",
          "type": "timeseries",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "targets": [
            {
              "refId": "A",
              "expr": "rate(otelcol_receiver_refused_spans_total[5m])"
            }
          ]
        },
        {
          "id": 3,
          "title": "Collector process memory (bytes)",
          "type": "timeseries",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "targets": [
            {
              "refId": "A",
              "expr": "otelcol_process_runtime_total_alloc_bytes"
            }
          ]
        },
        {
          "id": 4,
          "title": "Platform logs (all services)",
          "type": "logs",
          "datasource": { "type": "loki", "uid": "loki" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "targets": [
            {
              "refId": "A",
              "expr": "{service_name=~\".+\"}"
            }
          ]
        }
      ]
    }
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: fp-infra
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: dashboards
    app.kubernetes.io/part-of: forgepoint
spec:
  # ClusterIP — reached via `kubectl port-forward svc/grafana 3000:3000` (no
  # Ingress/LoadBalancer per the homelab constraint).
  type: ClusterIP
  selector:
    app.kubernetes.io/name: grafana
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: fp-infra
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: dashboards
    app.kubernetes.io/part-of: forgepoint
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana
        app.kubernetes.io/component: dashboards
        app.kubernetes.io/part-of: forgepoint
    spec:
      # Grafana never calls the K8s API — disable the unused SA token.
      automountServiceAccountToken: false
      # The grafana image runs as uid 472 (grafana). fsGroup makes the writable
      # emptyDir (Grafana needs a writable /var/lib/grafana for its plugin/SQLite
      # scratch even in provisioned mode) group-owned correctly.
      securityContext:
        runAsNonRoot: true
        runAsUser: 472
        runAsGroup: 472
        fsGroup: 472
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: grafana
          # Pinned tag — reproducible builds + CVE control (no :latest).
          # VERIFY before first deploy: confirm this tag on Docker Hub
          # (hub.docker.com/r/grafana/grafana/tags) and check the release notes
          # for provisioning-format or datasource-API breaking changes.
          image: grafana/grafana:11.5.1
          env:
            # ---- SECURITY HARDENING (same as docker-compose) ----------------
            # Admin password injected from the Secret — NOT hardcoded, NOT the
            # well-known "admin" default.
            - name: GF_SECURITY_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: grafana-credentials
                  key: admin-user
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grafana-credentials
                  key: admin-password
            # Anonymous access DISABLED entirely in-cluster (stricter than the
            # local stack's anonymous-Viewer). Network access requires login.
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "false"
            # Defense in depth: even if anonymous were ever flipped on, the role
            # is pinned to Viewer (read-only) — never Admin.
            - name: GF_AUTH_ANONYMOUS_ORG_ROLE
              value: "Viewer"
            # Disallow new user sign-up and disable the gravatar/外部 calls.
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
            # Provisioned dashboards live under this path (matches the provider).
            - name: GF_PATHS_PROVISIONING
              value: /etc/grafana/provisioning
          ports:
            - name: http
              containerPort: 3000
          securityContext:
            allowPrivilegeEscalation: false
            # NOT read-only: Grafana writes its internal SQLite + plugin cache to
            # /var/lib/grafana even in provisioned mode. We give it a writable
            # emptyDir there (below) rather than a fully read-only root FS, which
            # the image does not cleanly support.
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          # Grafana's purpose-built health endpoint.
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            # Datasource provisioning (Prometheus/Tempo/Loki) — read-only.
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
              readOnly: true
            # Dashboard provider definition — read-only.
            - name: dashboard-providers
              mountPath: /etc/grafana/provisioning/dashboards
              readOnly: true
            # Dashboard JSON files — read-only.
            - name: dashboards
              mountPath: /var/lib/grafana/dashboards
              readOnly: true
            # Writable scratch for Grafana's runtime state (SQLite, plugins).
            - name: grafana-data
              mountPath: /var/lib/grafana
      volumes:
        - name: datasources
          configMap:
            name: grafana-datasources
        - name: dashboard-providers
          configMap:
            name: grafana-dashboard-providers
        - name: dashboards
          configMap:
            name: grafana-dashboards
        - name: grafana-data
          emptyDir: {}
