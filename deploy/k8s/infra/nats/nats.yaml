# ============================================================================
# NATS — Async event bus with JetStream (persistent streaming)
# ============================================================================
#
# WHY a StatefulSet (not Deployment):
#   JetStream persists streams/consumers to a file store on a PVC. A StatefulSet
#   gives us (1) a STABLE pod identity (nats-0) and (2) a STABLE PVC bound to that
#   identity via volumeClaimTemplates — so on reschedule the same pod name reclaims
#   the same JetStream data. A Deployment's pods are interchangeable and would fight
#   over a single RWO PVC. Even at 1 replica this is the correct primitive for
#   stateful, identity-bound storage. (At >1 replica we'd add NATS clustering +
#   routes; out of scope for this single-node homelab.)
#
# REAL-WORLD COMPARISON: NATS JetStream ≈ Kafka's durable log, but lighter — no
#   ZooKeeper/KRaft, file-based store, at-least-once with explicit acks. We use it
#   for the `fp.{service}.{event}` subject hierarchy (see docs/design/event-contract.md).
# ============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: nats-config
  namespace: fp-infra
  labels:
    app.kubernetes.io/name: nats
    app.kubernetes.io/component: messaging
    app.kubernetes.io/part-of: forgepoint
data:
  # nats.conf — JetStream config. We mount this read-only and point the server at
  # it with `-c`. Keeping config in a ConfigMap (not CLI flags) makes the JetStream
  # limits reviewable and version-controlled.
  nats.conf: |
    # Client + monitoring listeners
    port: 4222
    http_port: 8222          # /healthz, /varz, /jsz monitoring endpoints

    # JetStream: the durable persistence engine.
    #   store_dir  — file store path (backed by the PVC mounted at /data)
    #   max_mem    — cap on in-memory streams (we prefer file storage; keep small)
    #   max_file   — cap on on-disk stream data; must be <= the PVC size (2Gi)
    jetstream {
      store_dir: "/data/jetstream"
      max_mem: 256MB
      max_file: 1GB
    }

    # Server name aids observability; logging tuned for container stdout.
    server_name: "nats-fp-0"
    logtime: true
---
apiVersion: v1
kind: Service
metadata:
  name: nats
  namespace: fp-infra
  labels:
    app.kubernetes.io/name: nats
    app.kubernetes.io/component: messaging
    app.kubernetes.io/part-of: forgepoint
spec:
  # ClusterIP (default) — infra is reached in-cluster by DNS:
  #   nats.fp-infra.svc.cluster.local:4222
  # No LoadBalancer/Ingress per the homelab constraint.
  type: ClusterIP
  selector:
    app.kubernetes.io/name: nats
  ports:
    - name: client
      port: 4222
      targetPort: client
    - name: monitor
      port: 8222
      targetPort: monitor
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nats
  namespace: fp-infra
  labels:
    app.kubernetes.io/name: nats
    app.kubernetes.io/component: messaging
    app.kubernetes.io/part-of: forgepoint
spec:
  serviceName: nats          # headless governance for stable network identity
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nats
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nats
        app.kubernetes.io/component: messaging
        app.kubernetes.io/part-of: forgepoint
    spec:
      # NATS only connects to clients — it never queries the K8s API server.
      # Disabling the auto-mounted SA token removes a credential that a compromised
      # NATS container could otherwise use to pivot within the cluster.
      automountServiceAccountToken: false
      # POD-level securityContext: the nats image already runs as uid 1000 (nats).
      # We pin runAsNonRoot + a specific uid/gid and set fsGroup so the mounted PVC
      # is group-owned by the nats user (otherwise file-store writes get EACCES).
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault   # use the kernel's default seccomp filter
      containers:
        - name: nats
          image: nats:2.11
          args: ["-c", "/etc/nats/nats.conf"]
          ports:
            - name: client
              containerPort: 4222
            - name: monitor
              containerPort: 8222
          # CONTAINER-level securityContext: defense in depth — drop ALL Linux caps
          # (NATS needs none), forbid privilege escalation, read-only root FS (the
          # only writable path is the /data PVC).
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          # Probes hit the NATS monitoring endpoints.
          #   /healthz?js-enabled-only — fails until JetStream is up (readiness)
          #   /healthz                  — basic liveness
          livenessProbe:
            httpGet:
              path: /healthz
              port: monitor
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz?js-enabled-only=true
              port: monitor
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: config
              mountPath: /etc/nats
              readOnly: true
            - name: data
              mountPath: /data
      volumes:
        - name: config
          configMap:
            name: nats-config
  # volumeClaimTemplates: the StatefulSet-managed PVC. local-path is the default
  # k3s StorageClass (WaitForFirstConsumer — bound once the pod is scheduled).
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: nats
          app.kubernetes.io/part-of: forgepoint
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 2Gi
