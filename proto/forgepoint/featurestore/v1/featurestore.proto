// ============================================================================
// Forgepoint Feature Store Service Proto Definitions
// ============================================================================
//
// WHY: The Feature Store is the system of record for the FEATURES that models
// consume — both at training time (offline, historical, reproducible) and at
// inference time (online, low-latency, "latest value now"). It decouples the
// teams that PRODUCE features (data/ML engineers running pipelines) from the
// teams/services that CONSUME them (training jobs, the inference gateway), so
// neither has to re-implement feature computation or worry about train/serve
// skew. Real-world parallels: Feast, Tecton, AWS SageMaker Feature Store,
// Databricks Feature Store.
//
// PATTERN — EVENT SOURCING:
//   This service is the platform's canonical Event Sourcing example. The core
//   idea: we DO NOT store current state and mutate it in place. Instead, every
//   change is recorded as an immutable, append-only EVENT in a log. The
//   "current value" of any feature is a DERIVED PROJECTION — the result of
//   folding (replaying) the events for an entity. State is a cache of the log,
//   never the source of truth.
//
//     WRITE PATH (commands → events):
//       WriteFeatures  ─► append FeaturesWritten event(s) to feature_events
//                         (id, feature_view_id, entity_id, version, data, ts)
//       DefineFeatureView ─► append FeatureViewDefined event
//
//     READ PATH (queries → projections, NEVER hit the raw log on the hot path):
//       GetOnlineFeatures    ─► Redis hash  feature:{view}:{entity}  (latest)
//       GetHistoricalFeatures─► Postgres "as-of" projection (point-in-time)
//       GetFeatureView       ─► one view's schema (metadata projection)
//       ListFeatureViews     ─► feature_views metadata projection (fleet/catalog)
//
//     ADMIN (event-sourcing lifecycle):
//       DeleteFeatureView    ─► append FeatureViewDeleted (soft retire; log kept)
//       RebuildViews         ─► replay the log → regenerate Redis + Postgres views
//
//   ASCII — the log is the truth, views are caches built from it:
//
//      commands                 append-only EVENT LOG (truth)
//     ┌──────────┐   write      ┌──────────────────────────────┐
//     │WriteFeat.│ ───────────► │ v1 FeaturesWritten {e1,...}  │
//     │DefineView│              │ v2 FeaturesWritten {e1,...}  │
//     └──────────┘              │ v3 FeaturesWritten {e2,...}  │
//                               └───────────────┬──────────────┘
//                         project / fold        │  (also emits NATS events)
//             ┌─────────────────────────────────┼───────────────────────┐
//             ▼                                  ▼                        ▼
//      Redis ONLINE view              Postgres OFFLINE view        NATS subscribers
//   feature:{view}:{entity}      DISTINCT ON(entity) ... DESC   (Experiment Tracker,
//   (GetOnlineFeatures)          (GetHistoricalFeatures)         Model Monitor, ...)
//
// WHY EVENT SOURCING HERE (not just an UPDATE table):
//   1. REPRODUCIBILITY — ML's killer requirement. To retrain or debug a model,
//      you must reconstruct EXACTLY the feature values that existed at training
//      time. An UPDATE-in-place table loses history; an append-only log keeps
//      every version, so GetHistoricalFeatures(as_of=T) is a pure query, not an
//      archaeology project. This is the whole reason feature stores exist.
//   2. TEMPORAL / POINT-IN-TIME queries fall out for free (event before T).
//   3. REBUILDABLE VIEWS — if Redis is flushed or a projection bug is fixed, we
//      replay the log to rebuild online+offline views. The cache can always be
//      regenerated; the log cannot be regenerated.
//   4. AUDIT — every feature value's full lineage is inspectable.
//
// TRADEOFFS / ALTERNATIVES (interview-critical — be ready to defend):
//   - vs CRUD table (UPDATE in place): simplest, but destroys history →
//     impossible point-in-time reads, no reproducibility. Disqualifying here.
//   - vs CDC/temporal tables (Postgres system-versioned rows): you DO keep
//     history, but state is still primary and events are a side-effect; harder
//     to publish typed domain events and to rebuild arbitrary projections.
//   - STORAGE COST: the log grows forever. Mitigation = snapshots (periodic
//     materialized checkpoints so replay starts mid-log, not from genesis) and
//     compaction/retention on very old event versions. Snapshots are an
//     implementation detail of the read side, NOT part of this API contract.
//   - EVENTUAL CONSISTENCY: the online (Redis) projection is updated just after
//     the event is appended, so a GetOnlineFeatures immediately after a
//     WriteFeatures MAY briefly miss it. We document this and expose
//     `as_of_version` in reads so callers can detect staleness.
//
// VERSIONING: package path includes v1 (Buf/Google convention). Breaking
// changes require a new forgepoint.featurestore.v2 package.
//
// NOTE ON NAMING vs the platform design doc:
//   The design doc sketches CreateFeatureSet/IngestFeatures; this contract uses
//   the clearer, consumer-facing names DefineFeatureView/WriteFeatures and the
//   "FeatureView" entity (a named, versioned schema over an entity). The domain
//   is identical — a FeatureView is the "feature set" of the design doc.
// ============================================================================

syntax = "proto3";

package forgepoint.featurestore.v1;

// go_package mirrors common.proto/auth.proto:
//   "github.com/abd-ulbasit/forgepoint/gen/go/{package};{shortname}"
// The short name (featurestorev1) is the Go package identifier, keeping imports
// unambiguous when several generated proto packages are used together.
option go_package = "github.com/abd-ulbasit/forgepoint/gen/go/forgepoint/featurestore/v1;featurestorev1";

import "google/protobuf/timestamp.proto";
// struct.proto IS used: FeatureValues/FeatureVector model a feature row as
// map<string, google.protobuf.Value>, and FeatureSpec STRUCT features carry a
// google.protobuf.Struct. (Buf flags unused imports; this one earns its place.)
import "google/protobuf/struct.proto";
import "forgepoint/common/v1/common.proto";
// EVENT CONTRACT — NOTE we deliberately do NOT import forgepoint/events/v1/events.proto
// here. The Feature Store's async payloads (FeatureViewDefined, FeaturesWritten)
// are NOT defined here anymore — they live in the platform's single canonical
// event package, and the handler packs the GENERATED eventsv1.* types into the
// EventEnvelope. WHY this changed: the per-service protos originally each
// re-declared their own event messages, and an adversarial review found the
// platform's async contract had DRIFTED (the feature-write event was published
// as "FeaturesWritten" but consumed as "FeaturesIngested" — it would never
// match). The fix is one source of truth: forgepoint.events.v1. Because this API
// .proto references no events.v1 TYPE, importing it here would be an unused proto
// import (Buf IMPORT_USED) and a dead compile-time coupling of the API schema to
// the event schema; the Go code does the import. See the EVENT PAYLOADS section
// below for the full rationale and the publisher field mapping.

// ============================================================================
// ENUMS
// ============================================================================

// ============================================================================
// FeatureValueType
// ============================================================================
//
// WHY an enum (not a free-form string): the FeatureView schema declares the
// expected type of each feature. The server validates incoming WriteFeatures
// payloads against these types — rejecting, e.g., a string where a DOUBLE is
// declared. Catching type drift at the boundary prevents silently corrupt
// features from poisoning training data, which is one of the worst, hardest-to-
// debug failure modes in ML ("the model got worse and nobody knows why").
//
// WHY THESE TYPES: they cover the ML feature primitives. Embeddings/vectors are
// represented as DOUBLE_LIST. Free-form/structured blobs fall back to STRUCT.
// Buf STANDARD requires the zero value to be *_UNSPECIFIED and every value to be
// prefixed with the enum name.
// ============================================================================
enum FeatureValueType {
  // Default/unset — an invalid schema declaration. Server rejects on define.
  FEATURE_VALUE_TYPE_UNSPECIFIED = 0;

  // 64-bit signed integer (counts, IDs-as-features, ordinals).
  FEATURE_VALUE_TYPE_INT64 = 1;

  // IEEE-754 double (most numeric ML features: amounts, ratios, scores).
  FEATURE_VALUE_TYPE_DOUBLE = 2;

  // UTF-8 string (categoricals before encoding, raw text features).
  FEATURE_VALUE_TYPE_STRING = 3;

  // Boolean flag feature.
  FEATURE_VALUE_TYPE_BOOL = 4;

  // Wall-clock time feature (e.g., "last_login_at"). Encoded as Timestamp.
  FEATURE_VALUE_TYPE_TIMESTAMP = 5;

  // Vector of doubles — the canonical shape for embeddings. Validation may also
  // assert a fixed dimensionality declared in FeatureSpec.dimension.
  FEATURE_VALUE_TYPE_DOUBLE_LIST = 6;

  // Arbitrary nested structure (google.protobuf.Struct). Escape hatch for
  // structured features that don't fit the primitives. Use sparingly — typed
  // features are validated and indexable; structs are opaque.
  FEATURE_VALUE_TYPE_STRUCT = 7;
}

// ============================================================================
// DOMAIN MESSAGES
// ============================================================================

// ============================================================================
// Entity
// ============================================================================
//
// WHY: An Entity is the THING features describe and the KEY features are looked
// up by — e.g., a "user", a "merchant", a "device". Every FeatureView is keyed
// by exactly one Entity, and every feature value belongs to a specific entity
// instance (entity_id, e.g., user "u_123"). At inference the gateway says "give
// me features for user u_123"; the entity tells the store how to interpret
// "u_123".
//
// WHY MODEL IT EXPLICITLY (not just a string key): naming the join key is what
// lets multiple FeatureViews compose at serving time — a model can pull the
// "user_credit" view and the "user_activity" view and join them on the shared
// `user` entity. This mirrors Feast's first-class Entity concept.
//
// SECURITY: `name` and `join_key` are caller-provided identifiers (safe). There
// are no owner/credential fields here — ownership lives on FeatureView and is
// SERVER-assigned (see below) to avoid mass-assignment.
// ============================================================================
message Entity {
  // Stable, unique entity name within the team: "user", "merchant", "device".
  // Referenced by FeatureView.entity. Immutable once a view uses it.
  string name = 1;

  // The logical join key column this entity is identified by, e.g., "user_id".
  // Documents how an entity_id maps onto upstream data for offline joins.
  string join_key = 2;

  // Human-readable description for the catalog/UI.
  string description = 3;
}

// ============================================================================
// FeatureSpec
// ============================================================================
//
// WHY: One feature's schema — its name, type, and optional shape constraints.
// A FeatureView holds a list of these. The server uses FeatureSpecs to VALIDATE
// every WriteFeatures payload, which is the contract that prevents train/serve
// skew and silent data corruption.
// ============================================================================
message FeatureSpec {
  // Feature name, unique within its FeatureView: "txn_count_7d", "embedding".
  // Becomes a key in the FeatureValues map written/served for an entity.
  string name = 1;

  // Declared value type. Server validates written values against this.
  FeatureValueType value_type = 2;

  // Human-readable description (units, semantics) for the catalog/UI.
  string description = 3;

  // For DOUBLE_LIST features: required vector length (e.g., 768 for an
  // embedding). 0 = unconstrained/not-applicable. Lets the server reject
  // wrong-dimension vectors before they reach training.
  int32 dimension = 4;
}

// ============================================================================
// FeatureView
// ============================================================================
//
// WHY: A FeatureView is the unit of definition and serving — a NAMED, VERSIONED
// schema (a set of FeatureSpecs) over a single Entity. It is the design doc's
// "feature set". Consumers request features by (feature_view, entity_id); the
// view tells the store which features exist and how to validate/serve them.
//
// IMMUTABILITY + VERSIONING (event-sourcing tie-in): a FeatureView's schema is
// itself defined by an event (FeatureViewDefined). `schema_version` increments
// when the schema changes (a new FeatureViewDefined event), so historical reads
// can be interpreted against the schema that was in effect at the time. We
// favor additive schema evolution (add features) over breaking changes.
//
// SECURITY — SERVER-AUTHORITATIVE FIELDS (NOT accepted on define/write):
//   id, owner_user_id, owner_team, schema_version, created_at, updated_at are
//   all set by the SERVER from the authenticated principal / clock / sequence.
//   The client never sends them on DefineFeatureViewRequest. This avoids
//   mass-assignment (a caller forging owner_team to access another team's data
//   or back-dating created_at). The auth interceptor's TokenClaims is the only
//   trusted source of owner identity.
// ============================================================================
message FeatureView {
  // UUID v4. SERVER-assigned. Stable handle used by all read/write RPCs.
  string id = 1;

  // Unique, human-readable view name within the team: "user_credit_features".
  string name = 2;

  // Human-readable description for the catalog/UI.
  string description = 3;

  // The Entity this view is keyed by. Every feature row belongs to one
  // entity instance (entity_id) of this entity's type.
  Entity entity = 4;

  // The schema: the features this view contains. Server validates writes
  // against these specs.
  repeated FeatureSpec features = 5;

  // Monotonic schema version. SERVER-assigned. Increments on each schema
  // change (each FeatureViewDefined event for this name). Lets historical
  // reads reason about which schema was in effect.
  int64 schema_version = 6;

  // Owning user (UUID). SERVER-assigned from the authenticated caller. Never
  // accepted from the client (mass-assignment guard).
  string owner_user_id = 7;

  // Owning team label. SERVER-assigned from TokenClaims.team. Used for
  // team-scoped authorization on reads/writes. Never client-supplied.
  string owner_team = 8;

  // When this view was first defined. SERVER-assigned. Immutable.
  google.protobuf.Timestamp created_at = 9;

  // When this view's schema was last changed. SERVER-assigned.
  google.protobuf.Timestamp updated_at = 10;

  // SOFT-DELETE marker. Unset (zero) while the view is live; SERVER-set to the
  // retirement time when DeleteFeatureView appends the terminal
  // FeatureViewDeleted event. WHY a timestamp, not a bool: it records WHEN the
  // view was retired (audit) and doubles as the "is deleted" flag (presence =
  // deleted). The view's history stays queryable via GetHistoricalFeatures for
  // reproducibility; this only marks it retired from the live catalog/serving.
  // Never client-supplied (mass-assignment guard).
  google.protobuf.Timestamp deleted_at = 11;
}

// ============================================================================
// FeatureValues
// ============================================================================
//
// WHY a map<string, Value>: a single entity's feature row is a set of
// name→value pairs. We use google.protobuf.Value (the well-known type) so any
// declared FeatureValueType — number, string, bool, list (DOUBLE_LIST), or
// nested struct — maps onto one wire representation, while the FeatureView's
// FeatureSpecs carry the authoritative type. This keeps the message generic
// over feature types without an enormous oneof per feature.
//
//   WHY NOT bytes: opaque bytes would lose the ability to inspect/validate/serve
//   individual features and would force every consumer to agree on an encoding.
//   WHY NOT a fixed message per view: views are user-defined at runtime; we
//   can't generate a proto type per view.
//
// The Timestamp here is the EVENT TIME — when these feature values became true
// (NOT when they were ingested). Point-in-time correctness depends on event
// time, so it is a first-class field, not server wall-clock. (Ingest/append
// time is recorded separately by the server in the event log.)
// ============================================================================
message FeatureValues {
  // The entity instance these values describe, e.g., "u_123". Interpreted
  // against the FeatureView's Entity.join_key.
  string entity_id = 1;

  // name → value for each feature in this row. Keys must match FeatureSpec
  // names in the view; the server validates value kinds against declared types.
  map<string, google.protobuf.Value> values = 2;

  // EVENT TIME: when these values became valid in the real world. This is the
  // timestamp point-in-time queries compare against (GetHistoricalFeatures
  // as_of). Caller-supplied because only the producer knows the true event time
  // (e.g., backfilling yesterday's features). If omitted on write, the server
  // defaults it to ingest time and says so.
  google.protobuf.Timestamp event_time = 3;
}

// ============================================================================
// FeatureVector
// ============================================================================
//
// WHY a distinct read-side type (vs reusing FeatureValues): a served feature
// vector carries PROVENANCE the write side doesn't — which schema_version and
// which event/log version produced it, and the projection's own timestamp.
// Returning the version that served the value lets callers (and the Model
// Monitor) detect staleness and reproduce reads. This separation (write command
// shape vs read projection shape) is idiomatic CQRS, the natural companion to
// event sourcing.
// ============================================================================
message FeatureVector {
  // The entity instance this vector is for.
  string entity_id = 1;

  // name → value for the requested features. Missing requested features are
  // simply absent here (see GetOnlineFeaturesResponse.missing_features).
  map<string, google.protobuf.Value> values = 2;

  // The event-log version that produced these values (the latest event applied
  // for this entity, at or before as_of for historical reads). Lets the caller
  // pin/repro a read and detect staleness against later writes.
  int64 as_of_version = 3;

  // Event time of the values served (the producing event's event_time).
  google.protobuf.Timestamp event_time = 4;

  // The FeatureView schema_version these values were validated against.
  int64 schema_version = 5;
}

// ============================================================================
// REQUEST / RESPONSE MESSAGES
// ============================================================================

// ============================================================================
// DefineFeatureView
// ============================================================================

// DefineFeatureViewRequest declares (or evolves) a FeatureView schema.
//
// EVENT-SOURCING SEMANTICS: this is a COMMAND that, on success, appends a
// FeatureViewDefined event. Calling it again for the same `name` with a changed
// schema appends another FeatureViewDefined and bumps schema_version (additive
// evolution preferred). The append, not an UPDATE, is the source of truth.
//
// SECURITY: only schema-shaping inputs are accepted. id, owner_user_id,
// owner_team, schema_version, created_at, updated_at are SERVER-assigned (the
// owner from TokenClaims) — deliberately NOT in this request to block
// mass-assignment.
message DefineFeatureViewRequest {
  // Unique view name within the caller's team. First call creates it; a later
  // call with the same name evolves the schema (new schema_version).
  string name = 1;

  // Human-readable description for the catalog.
  string description = 2;

  // The Entity this view is keyed by (name + join_key). Defining the entity
  // inline keeps the view self-contained for M2; a first-class entity registry
  // is a possible later refinement.
  Entity entity = 3;

  // The feature schema (specs). Server validates: non-empty, unique names,
  // valid value_types, sane dimensions.
  repeated FeatureSpec features = 4;

  // IDEMPOTENCY KEY (interview-critical for "exactly-once intent"):
  //   DefineFeatureView mutates state by appending an event. A network retry
  //   after a server-side success (response lost) must NOT append a duplicate
  //   FeatureViewDefined / spuriously bump schema_version. The server records
  //   processed idempotency_keys; a repeat returns the SAME FeatureView. UUID
  //   v4 generated by the client per logical attempt (not per retry).
  string idempotency_key = 5;
}

// DefineFeatureViewResponse wraps the resulting FeatureView (with all
// SERVER-assigned fields populated). Wrapped, not returned bare, per Buf
// RPC_RESPONSE_STANDARD_NAME and for forward-compatibility (e.g., adding a
// `created` bool to distinguish create vs evolve later).
message DefineFeatureViewResponse {
  // The defined/evolved view, including SERVER-assigned id, owner, version,
  // timestamps.
  FeatureView feature_view = 1;
}

// ============================================================================
// GetFeatureView
// ============================================================================

// GetFeatureViewRequest fetches a SINGLE view's current schema/metadata. WHY
// this RPC was MISSING and is genuinely needed: every consumer-facing flow —
// the `fp` CLI's `feature-view describe`, an SDK validating a payload before
// WriteFeatures, the Web UI's view detail page — needs one view by handle, and
// ListFeatureViews (page the whole catalog) is the wrong, expensive tool for
// that. It is a pure read of the feature_views metadata projection.
//
// EITHER handle works (a oneof so exactly one is supplied): the immutable id
// (stable across renames — preferred for machine callers) or the name (the
// human handle — convenient for the CLI). Team scoping is applied SERVER-side
// from TokenClaims.team, so a caller cannot read another team's view by
// guessing an id (authorization, not just existence).
message GetFeatureViewRequest {
  oneof handle {
    // Immutable view UUID (FeatureView.id). Preferred for machine callers.
    string feature_view_id = 1;

    // View name, resolved within the caller's team. Convenient for humans/CLI.
    string name = 2;
  }
}

message GetFeatureViewResponse {
  // The requested view with all SERVER-assigned fields populated.
  FeatureView feature_view = 1;
}

// ============================================================================
// ListFeatureViews
// ============================================================================

// ListFeatureViewsRequest pages the FeatureView catalog (a read projection over
// FeatureViewDefined events). Reuses common.v1.PaginationRequest for a uniform
// cursor-based shape across the platform (see common.proto for the WHY).
message ListFeatureViewsRequest {
  // Optional: case-insensitive substring filter on view name. Empty = no
  // filter. Team scoping is applied SERVER-side from TokenClaims.team (NOT a
  // client field) so a caller cannot enumerate another team's catalog.
  string name_filter = 1;

  // Cursor-based pagination. page_size defaults to 20; the server CAPS it at
  // MAX_PAGE_SIZE=100 (oversized requests are CLAMPED, not rejected) to bound
  // response size and prevent enumeration/DoS. The cap is the contract.
  forgepoint.common.v1.PaginationRequest pagination = 2;
}

message ListFeatureViewsResponse {
  // The page of feature views (catalog projection). Schemas are included so a
  // UI/SDK can render the catalog without N follow-up calls.
  repeated FeatureView feature_views = 1;

  // next_page_token + total_count. total_count may be -1 when expensive.
  forgepoint.common.v1.PaginationResponse pagination = 2;
}

// ============================================================================
// WriteFeatures
// ============================================================================

// WriteFeaturesRequest appends new feature values — the primary EVENT-SOURCING
// write. It records FeaturesWritten event(s) into the append-only log; it does
// NOT update rows in place. Subsequent reads see these via the materialized
// views the server updates from the new events.
//
// WHY BATCH (repeated FeatureValues): feature pipelines write thousands of rows
// per run. One row per RPC would be chatty and lose write atomicity. A batch
// appends as one logical, ordered set of events (one log version range),
// matching how producers actually emit features.
//
// SECURITY: the caller may write only to views their team owns (enforced
// server-side from TokenClaims). No owner/version/append-time fields are
// accepted — those are SERVER-assigned. event_time inside FeatureValues IS
// caller-supplied (it is domain data the producer owns, not a security field).
message WriteFeaturesRequest {
  // Target view (UUID, from FeatureView.id). The view's schema validates the
  // payload. Using the immutable id (not name) avoids ambiguity if a view is
  // later renamed.
  string feature_view_id = 1;

  // The feature rows to append. Each entry's `values` are validated against the
  // view's FeatureSpecs (names + types + dimensions). A type mismatch fails the
  // WHOLE batch (INVALID_ARGUMENT) so partial-corrupt writes can't slip in.
  // Batch size is CAPPED at MAX_BATCH_SIZE=1000 rows; an over-cap request is
  // REJECTED with INVALID_ARGUMENT (NOT truncated — silently dropping feature
  // rows would corrupt counts and history). Split larger pipelines into batches.
  repeated FeatureValues features = 2;

  // IDEMPOTENCY KEY: a retried WriteFeatures (lost response) must not append the
  // same rows twice — duplicate feature events would corrupt counts and
  // point-in-time history. The server deduplicates on this key (UUID v4 per
  // logical batch) and returns the original result on replay. This is how an
  // event-sourced write achieves at-least-once delivery with exactly-once
  // EFFECT.
  string idempotency_key = 3;
}

// WriteFeaturesResponse confirms the append and returns the assigned log
// version range, so producers can correlate, audit, and (if needed) wait for
// the online projection to catch up to written_through_version.
message WriteFeaturesResponse {
  // Number of feature rows (events) appended.
  int32 written_count = 1;

  // The highest event-log version assigned by this append. Reads observing an
  // as_of_version >= this value are guaranteed to include this batch — useful
  // for read-your-writes checks against the eventually-consistent online view.
  int64 written_through_version = 2;
}

// ============================================================================
// GetOnlineFeatures
// ============================================================================

// GetOnlineFeaturesRequest reads the LATEST feature values for entities from the
// low-latency online projection (Redis hash feature:{view}:{entity}). This is
// the inference hot path: the Inference Gateway calls it per prediction, so it
// must be fast and is served from the cache projection, never by replaying the
// log.
//
// PATTERN NOTE: this is the "read model" of CQRS over the event log. It is
// eventually consistent with WriteFeatures (see eventual-consistency note in
// the file header); as_of_version in the response lets callers detect lag.
message GetOnlineFeaturesRequest {
  // Target view (UUID).
  string feature_view_id = 1;

  // Entity instances to fetch (e.g., ["u_123","u_456"]). Batched to amortize
  // round-trips for models that score many entities at once. Server CAPS the
  // batch at MAX_BATCH_SIZE=1000 entities; over-cap → INVALID_ARGUMENT (bounds
  // hot-path latency/payload). The cap is the contract.
  repeated string entity_ids = 2;

  // Optional projection: only return these feature names. Empty = all features
  // in the view. Lets a model fetch just the columns it needs (smaller payload,
  // less Redis work).
  repeated string feature_names = 3;
}

message GetOnlineFeaturesResponse {
  // One vector per found entity (order not guaranteed). Each carries its
  // as_of_version/event_time/schema_version provenance.
  repeated FeatureVector vectors = 1;

  // Entity ids requested but absent in the online view (never written, or
  // evicted). Returned explicitly (rather than silently dropped) so the caller
  // can decide: use a default, fall back to GetHistoricalFeatures, or error.
  repeated string missing_entity_ids = 2;
}

// ============================================================================
// GetHistoricalFeatures
// ============================================================================

// GetHistoricalFeaturesRequest performs a POINT-IN-TIME ("as-of") read against
// the offline projection of the event log: for each entity, the feature values
// from the latest event with event_time <= as_of. This is the reproducibility
// workhorse — training jobs use it to assemble the exact feature snapshot that
// existed when labels were observed, eliminating LABEL LEAKAGE (using features
// computed AFTER the prediction time).
//
// WHY UNARY (not server-streaming) for M2: training feature retrieval is
// typically a bounded set of (entity, timestamp) lookups assembled into a
// dataset, and the result is paginated. A large-scale "point-in-time JOIN"
// producing millions of rows is a batch/offline job (write to object storage,
// return a URI) rather than a synchronous stream — a deliberate later
// refinement, called out here so the unary choice is defensible.
message GetHistoricalFeaturesRequest {
  // Target view (UUID).
  string feature_view_id = 1;

  // Entity instances to retrieve as-of the timestamp. Server CAPS the batch at
  // MAX_BATCH_SIZE=1000 entities; over-cap → INVALID_ARGUMENT, to bound the
  // point-in-time scan. Larger training pulls page via `pagination` below.
  repeated string entity_ids = 2;

  // POINT-IN-TIME cutoff. For each entity, return the values from the latest
  // event with event_time <= as_of. REQUIRED — a missing as_of would make the
  // query non-reproducible (it would mean "now", which changes over time).
  google.protobuf.Timestamp as_of = 3;

  // Optional feature-name projection. Empty = all features in the view.
  repeated string feature_names = 4;

  // Cursor-based pagination over the entity result set (large training pulls
  // page through results). page_size defaults to 20, capped at MAX_PAGE_SIZE=100
  // server-side (clamped).
  forgepoint.common.v1.PaginationRequest pagination = 5;
}

message GetHistoricalFeaturesResponse {
  // One vector per entity that had at least one event at or before `as_of`.
  // Each vector's as_of_version is the log version of the event that satisfied
  // the point-in-time read (so the snapshot is exactly reproducible).
  repeated FeatureVector vectors = 1;

  // Requested entities with NO event at or before `as_of` (they did not exist
  // yet at that time). Explicit, so training code can drop or default them.
  repeated string missing_entity_ids = 2;

  // next_page_token + total_count for the entity result set.
  forgepoint.common.v1.PaginationResponse pagination = 3;
}

// ============================================================================
// DeleteFeatureView (soft retire — event-sourcing aware)
// ============================================================================

// DeleteFeatureViewRequest retires a FeatureView. WHY this exists (the design
// /CLI need it) and WHY it is a SOFT delete that APPENDS an event rather than
// DROP-ing rows:
//   In an event-sourced system the log is the source of truth and is IMMUTABLE.
//   "Deleting" therefore means appending a terminal FeatureViewDeleted event
//   (the design doc's append-only model already lists Created/Updated/Deleted),
//   which retires the view from the catalog and stops serving it — WITHOUT
//   erasing history. Past training datasets assembled via GetHistoricalFeatures
//   must remain reproducible (audit + legal), so the historical events stay; the
//   online (Redis) projection is torn down. A hard physical purge (GDPR erasure)
//   is a separate, audited admin operation, deliberately NOT this RPC.
//
// SECURITY: only the immutable id is accepted (no owner/team field — team
// scoping is SERVER-derived from TokenClaims, so a caller cannot delete another
// team's view). Idempotent: re-deleting an already-deleted view is a no-op that
// returns the same result, both via the natural terminal state and the explicit
// idempotency_key (a lost-response retry must not append a second delete event).
message DeleteFeatureViewRequest {
  // The view to retire (immutable UUID). Name is intentionally NOT accepted for
  // a destructive op — the caller must resolve to the stable id first, removing
  // any rename-race ambiguity about WHICH view is being deleted.
  string feature_view_id = 1;

  // IDEMPOTENCY KEY: appending FeatureViewDeleted is a mutation; a retried
  // request (response lost in flight) must not append a duplicate terminal
  // event. UUID v4 per logical attempt. Server dedupes and replays the result.
  string idempotency_key = 2;
}

message DeleteFeatureViewResponse {
  // The view as of its retirement: schema_version bumped by the delete event and
  // deleted_at set to the retirement time. Returned so callers can confirm the
  // terminal state without a follow-up GetFeatureView.
  FeatureView feature_view = 1;
}

// ============================================================================
// RebuildViews (event-sourcing recovery — the headline demonstration)
// ============================================================================

// RebuildViewsRequest replays the append-only log to REGENERATE the materialized
// views (Redis online + Postgres offline). This is THE event-sourcing party
// trick the design doc calls out: "can replay ALL events from scratch to rebuild
// both views". WHY it must be an explicit RPC, not just an internal job: it is
// the documented RECOVERY path after a Redis flush, a projection-logic bugfix
// (replay corrects every entity), or a schema migration of a read model — an
// operator/CLI needs to invoke it deliberately. The log is never touched; only
// the caches are rebuilt FROM it (proving the log is the true source of truth).
//
// SECURITY: this is an ADMIN operation guarded by a distinct, higher-privilege
// scope ("features:admin"), NOT the ordinary "features:write" — a full replay is
// expensive and operationally sensitive, so it must not be reachable with a
// routine write token. Scope is SERVER-enforced from TokenClaims.
//
// LONG-RUNNING / STREAMING CHOICE: a full replay can take minutes over a large
// log, so this is modeled as a SERVER-STREAMING RPC that emits incremental
// RebuildViewsResponse progress frames (events replayed so far / total, current
// view). NOTE the message is named RebuildViewsResponse (not RebuildProgress) to
// satisfy Buf's RPC_RESPONSE_STANDARD_NAME rule: a unary OR streaming response
// type must be <RpcName>Response. The frames it carries are still "progress"
// frames semantically — the name is the contract, the doc explains the role. WHY
// server-streaming and not a unary "kick off + poll": the operator/CLI wants
// live progress and a single connection whose closure signals completion, with
// no polling loop or separate job-status endpoint. (Contrast the data-plane read
// RPCs, which stay unary because they're bounded and latency-sensitive — the
// streaming choice here is justified by DURATION, not data volume.)
message RebuildViewsRequest {
  // Optional: restrict the rebuild to one view (its UUID). Empty = rebuild ALL
  // views (full recovery). Scoping to one view makes a targeted bugfix replay
  // cheap instead of reprocessing the entire platform's feature history.
  string feature_view_id = 1;

  // Which projection(s) to rebuild. Lets an operator rebuild only the cache that
  // was lost/corrupted (e.g. ONLINE after a Redis flush) instead of both.
  RebuildTarget target = 2;
}

// RebuildTarget selects which materialized projection(s) a rebuild regenerates.
// Buf STANDARD: _UNSPECIFIED zero value + enum-name prefix on every value.
enum RebuildTarget {
  // Unset — server treats as REBUILD_TARGET_ALL (rebuild everything) but the
  // caller SHOULD set this explicitly; the zero value exists only to satisfy
  // proto3/Buf, not as a meaningful "no target".
  REBUILD_TARGET_UNSPECIFIED = 0;

  // Rebuild both the Redis online view and the Postgres offline view.
  REBUILD_TARGET_ALL = 1;

  // Rebuild only the Redis online (latest-value) projection — e.g. after a flush.
  REBUILD_TARGET_ONLINE = 2;

  // Rebuild only the Postgres offline (point-in-time) projection.
  REBUILD_TARGET_OFFLINE = 3;
}

// RebuildViewsResponse is one streamed frame of a RebuildViews replay (a
// "progress" frame). The stream emits these periodically; the final frame has
// done=true and the connection closes cleanly (its closure is the completion
// signal — no poll needed). Named <RpcName>Response to satisfy Buf's
// RPC_RESPONSE_STANDARD_NAME rule even though it is a streamed progress frame.
message RebuildViewsResponse {
  // Events replayed so far and the total to replay (so the CLI renders a bar).
  // total_events may be -1 early if counting the log up front is itself costly.
  int64 events_replayed = 1;
  int64 total_events = 2;

  // The view currently being rebuilt (empty when rebuilding the whole fleet
  // and between views). Lets the operator see progress per view.
  string current_feature_view_id = 3;

  // True on the FINAL frame — the rebuild is complete and the stream will close.
  bool done = 4;
}

// ============================================================================
// EVENT PAYLOADS — NOW CANONICAL (forgepoint.events.v1), NOT redefined here
// ============================================================================
//
// The Feature Store PRODUCES two events. Their payload messages used to live in
// THIS file; they have been MOVED to the platform's single canonical event
// package and DELETED here. Producers pack the canonical messages into
// common.v1.EventEnvelope.data (a google.protobuf.Any); consumers unpack the
// SAME message by its Any type_url — one contract, both ends of every pipe.
//
//   WHAT THE FEATURE STORE PUBLISHES (producer = "feature-store"):
//     fp.features.view.defined  → forgepoint.events.v1.FeatureViewDefined
//     fp.features.written       → forgepoint.events.v1.FeaturesWritten
//
//   WHO CONSUMES (informational — defined by the consumers, not us):
//     FeatureViewDefined → experiment-tracker (correlate which feature schema
//                          versions fed a training run), audit subscribers.
//     FeaturesWritten    → experiment-tracker (which feature versions fed a
//                          run), model-monitor (scope drift checks / cache
//                          invalidation to the changed entities).
//
// WHY MOVED (the bug this fixes — conflict #4 in events.proto):
//   The platform's async nervous system had DRIFTED. The design doc and the
//   experiment-tracker subscribed to "fp.features.ingested" / "FeaturesIngested",
//   while this service published "FeaturesWritten" on "fp.features.written".
//   Same fact, two names — the subscription would NEVER fire. Centralizing the
//   payloads in forgepoint.events.v1 makes that class of mismatch impossible:
//   producer and consumer literally import the same generated Go type. (The
//   experiment-tracker fix repoints its subscription to fp.features.written.)
//
//   It also DECOUPLES the event schema from this service's API schema. The old
//   local messages were fine until you ask: should the Experiment Tracker
//   compile-depend on featurestore.proto just to read an event? No. The event is
//   a separately-versioned PUBLISHED CONTRACT (schema-registry thinking); it
//   imports only well-known types + common, never a service's API proto.
//
// THIN-BY-DESIGN (unchanged, and codified in the canonical message):
//   events.FeaturesWritten carries the affected entity_ids + a count +
//   written_through_version — NOT the feature VALUES. Events are for
//   NOTIFICATION/correlation; a consumer that needs the actual values calls
//   GetOnlineFeatures/GetHistoricalFeatures (the read models below). This keeps
//   NATS small and stops the bus becoming a second source of truth. (This is the
//   "thin event + callback" side of the fat-vs-thin tradeoff — chosen here
//   because feature rows are large and only some consumers want the values.)
//
// PUBLISHER FIELD MAPPING (a few lines in the handler at the publish boundary —
// the price of decoupling, and the only thing the rename touches):
//   DefineFeatureView success →  events.FeatureViewDefined{
//       feature_view_id   = view.id
//       feature_view_name = view.name        // canonical field is feature_view_name
//       schema_version    = view.schema_version
//       owner_team        = view.owner_team
//       defined_at        = view.updated_at  // RENAMED: old local occurred_at → defined_at
//   }
//   WriteFeatures success →      events.FeaturesWritten{
//       feature_view_id          = req.feature_view_id
//       feature_view_name        = view.name
//       entity_ids               = affected ids (MAY be truncated; count is authoritative)
//       written_count            = rows appended
//       written_through_version  = resp.written_through_version
//       written_at               = append commit time  // RENAMED: old occurred_at → written_at
//   }
// The canonical messages live in proto/forgepoint/events/v1/events.proto under
// the "FEATURE-STORE EVENTS" section — read there for field-level docs.
//
// ============================================================================
// FEATURE STORE SERVICE
// ============================================================================
//
// WHY one FeatureStoreService (not split into Catalog/Write/Serve services):
//   definition (schema), ingestion (append), and serving (project) all operate
//   on the SAME event log and views and share the same team-ownership boundary.
//   Splitting them would force inter-service calls and a shared event store
//   across service boundaries — violating database-per-service. They live
//   behind one boundary; CQRS happens INSIDE this service (write model = event
//   log; read models = Redis online + Postgres offline), not across services.
//
// RPC CATEGORIES:
//   DEFINITION (catalog):  DefineFeatureView, GetFeatureView, ListFeatureViews
//   WRITE (commands):      WriteFeatures                 → appends events
//   READ (projections):    GetOnlineFeatures (latest),
//                          GetHistoricalFeatures (point-in-time)
//   ADMIN (lifecycle):     DeleteFeatureView (soft retire → FeatureViewDeleted),
//                          RebuildViews (replay log → regenerate projections)
//
// SERVER-ENFORCED LIMITS (in the CONTRACT, not just prose — see each RPC):
//   * page_size (ListFeatureViews, GetHistoricalFeatures): default 20, hard cap
//     MAX_PAGE_SIZE = 100 (oversized requests are CLAMPED, not rejected).
//   * batch size (entity_ids on GetOnline/GetHistorical; features on Write):
//     hard cap MAX_BATCH_SIZE = 1000 entities/rows; OVER-cap requests are
//     REJECTED with INVALID_ARGUMENT (a too-large write must fail loudly, not be
//     silently truncated — truncation would drop feature rows). proto3 has no
//     native numeric bound, so these caps are documented as named constants and
//     enforced server-side; the constants are the contract.
//
// STREAMING CHOICE (interview-critical):
//   DATA-PLANE RPCs are UNARY; the long-running ADMIN replay is SERVER-STREAMING.
//     - WriteFeatures: producers emit in BATCHES (one RPC = one atomic append
//       with one idempotency key). Client-streaming would blur the idempotency/
//       atomicity boundary (when is the append "committed"?). Bounded batches +
//       idempotency key is simpler and safer.
//     - GetOnlineFeatures: a single fast key→value projection read; sub-ms
//       budget on the inference hot path — streaming overhead is unwarranted.
//     - GetHistoricalFeatures: bounded, PAGINATED point-in-time pulls. Truly
//       huge training joins are an offline batch job (export to object storage),
//       not a synchronous server stream — a deliberate later refinement.
//     - RebuildViews: SERVER-STREAMING — a full log replay runs for minutes, so
//       we stream RebuildViewsResponse frames for live feedback and use stream-close as the
//       completion signal (no poll loop). Note this is justified by DURATION, not
//       data volume — the contrast with the unary reads is the interview point.
//   So the only streaming RPC is the admin replay, deliberately, and every choice
//   is documented so it is defensible.
//
// EVENT-SOURCING RECAP (what an interviewer will probe):
//   * Source of truth = append-only feature_events log. Views are caches.
//   * Reads never replay on the hot path; they read projections.
//   * Reproducibility = GetHistoricalFeatures(as_of) over event_time.
//   * Recovery = RebuildViews replays the log to rebuild Redis + Postgres views.
//   * Soft delete = DeleteFeatureView appends a terminal event; history is kept.
//   * Exactly-once EFFECT under retries = idempotency_key on mutating RPCs.
//   * Eventual consistency online = surfaced via as_of_version in reads.
//   * Async contract = publishes forgepoint.events.v1 FeatureViewDefined /
//     FeaturesWritten (canonical, decoupled from this API proto).
// ============================================================================
service FeatureStoreService {
  // DefineFeatureView creates a FeatureView or evolves its schema (append a
  // FeatureViewDefined event; bump schema_version). Owner/team/timestamps are
  // SERVER-assigned. Idempotent via idempotency_key. On commit, publishes
  // forgepoint.events.v1.FeatureViewDefined on fp.features.view.defined.
  // Requires "features:write".
  rpc DefineFeatureView(DefineFeatureViewRequest) returns (DefineFeatureViewResponse);

  // GetFeatureView returns a SINGLE view's current schema/metadata by id or name
  // (a read of the catalog projection), scoped to the caller's team. Requires
  // "features:read".
  rpc GetFeatureView(GetFeatureViewRequest) returns (GetFeatureViewResponse);

  // ListFeatureViews returns a paginated catalog of feature views (a projection
  // over FeatureViewDefined events), scoped to the caller's team. page_size
  // defaults to 20 and is CAPPED at MAX_PAGE_SIZE=100 server-side (clamped).
  // Requires "features:read".
  rpc ListFeatureViews(ListFeatureViewsRequest) returns (ListFeatureViewsResponse);

  // WriteFeatures appends a batch of feature rows to the event log (the core
  // event-sourcing write). Values are validated against the view schema; a type
  // mismatch fails the whole batch. Batch size is capped at MAX_BATCH_SIZE=1000
  // rows (over-cap → INVALID_ARGUMENT). Idempotent via idempotency_key. On
  // commit, publishes forgepoint.events.v1.FeaturesWritten on fp.features.written.
  // Requires "features:write".
  rpc WriteFeatures(WriteFeaturesRequest) returns (WriteFeaturesResponse);

  // GetOnlineFeatures returns the LATEST feature values for entities from the
  // low-latency online projection (the inference hot path). entity_ids batch is
  // capped at MAX_BATCH_SIZE=1000. Eventually consistent with writes; response
  // carries as_of_version for staleness detection. Requires "features:read".
  rpc GetOnlineFeatures(GetOnlineFeaturesRequest) returns (GetOnlineFeaturesResponse);

  // GetHistoricalFeatures returns POINT-IN-TIME ("as-of") feature values from
  // the offline projection — for each entity, the latest event with
  // event_time <= as_of. Powers reproducible training and prevents label
  // leakage. entity_ids batch capped at MAX_BATCH_SIZE=1000; result paginated
  // with page_size capped at MAX_PAGE_SIZE=100. Requires "features:read".
  rpc GetHistoricalFeatures(GetHistoricalFeaturesRequest) returns (GetHistoricalFeaturesResponse);

  // DeleteFeatureView soft-retires a view by appending a terminal
  // FeatureViewDeleted event (the log/history is preserved for reproducibility;
  // the online projection is torn down). Idempotent via idempotency_key.
  // Requires "features:write".
  rpc DeleteFeatureView(DeleteFeatureViewRequest) returns (DeleteFeatureViewResponse);

  // RebuildViews replays the append-only log to regenerate the materialized
  // projections (Redis online + Postgres offline) — the event-sourcing recovery
  // path. SERVER-STREAMING: emits RebuildViewsResponse progress frames until done.
  // This is an ADMIN op requiring the elevated "features:admin" scope (a full
  // replay is expensive and sensitive — not reachable with a routine write token).
  rpc RebuildViews(RebuildViewsRequest) returns (stream RebuildViewsResponse);
}
