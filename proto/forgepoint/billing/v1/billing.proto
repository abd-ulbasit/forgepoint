// ============================================================================
// Forgepoint Billing / Usage Service Proto Definitions
// ============================================================================
//
// WHY: The Billing service meters every billable action on the platform —
// primarily inference calls — attributes cost to a team/rate-plan, enforces
// quotas, and rolls metered usage up into invoices. It is the platform's
// "money truth": once an event is recorded here it must NEVER be lost and must
// NEVER be double-counted (both directions are real money errors).
//
// WHAT'S HERE:
//   - Domain messages: Money, RatePlan, UsageRecord, UsageSummary, Invoice,
//     InvoiceLineItem
//   - BillingService RPCs:
//       METERING:   RecordUsage (outbox-protected write)
//       PRICING:    CreateRatePlan (admin), GetRatePlan
//       QUOTA:      CheckQuota (gateway pre-flight)
//       REPORTING:  GetUsage (aggregate, paged), GetInvoice, ListInvoices (paged)
//
// EVENT PAYLOADS LIVE IN forgepoint.events.v1 (NOT here):
//   This service formerly defined its OWN UsageRecorded/InvoiceGenerated/
//   QuotaExceeded payload messages inline. An adversarial cross-service review
//   found per-service ad-hoc event messages drifting from their consumers, so the
//   platform now has ONE canonical event contract — forgepoint.events.v1 — that
//   both producers and consumers depend on. Those three inline messages have been
//   DELETED from this file; billing publishes the canonical events.UsageRecorded /
//   events.InvoiceGenerated / events.QuotaExceeded instead (see import block and
//   the EVENT CONTRACT section near the service definition). The canonical money-
//   bearing events (UsageRecorded, InvoiceGenerated) FLATTEN Money into
//   cost_micros/total_micros + currency_code — no embedded billing.Money / .Invoice
//   — precisely so a consumer (Experiment Tracker, Notification) need not compile-
//   depend on this billing API proto just to read an event.
//
// PATTERN — Outbox (Transactional Outbox / reliable event publishing):
//   The hard problem this service exists to demonstrate is the DUAL-WRITE
//   problem. When we record usage we must do TWO things that look atomic to the
//   rest of the platform:
//     (1) UPDATE the usage counters / INSERT the usage row in Postgres, and
//     (2) PUBLISH an event (UsageRecorded / QuotaExceeded) to NATS.
//   If we write the DB then crash before publishing, downstream (Notification,
//   the Inference Gateway's quota cache) never learns. If we publish then the
//   DB write fails, we've told the world something that isn't true. There is no
//   distributed transaction spanning Postgres and NATS, so we CANNOT make (1)
//   and (2) atomic directly.
//
//   THE OUTBOX FIX:
//     - In ONE local Postgres transaction we write the business rows AND insert
//       a row into an `outbox` table: {id, aggregate_id, event_type, payload,
//       created_at, published_at=NULL}. One transaction, one commit, no dual
//       write — the event is now as durable as the data that justifies it.
//     - A SEPARATE poller goroutine reads `WHERE published_at IS NULL ORDER BY
//       created_at`, publishes each to NATS, then stamps `published_at=NOW()`.
//     - Guarantee: if the DB commit succeeded, the event WILL eventually be
//       published (at-least-once). Consumers are idempotent (EventEnvelope.id)
//       so at-least-once is safe.
//
//   WHY THE API SHAPE REFLECTS THIS:
//     - RecordUsage carries an `idempotency_key` so a REDELIVERED upstream
//       InferenceCompleted (NATS is at-least-once too) does not bill twice. The
//       outbox protects DB→NATS; the idempotency key protects NATS→DB. Both ends
//       of the pipe must be idempotent for the whole thing to be exactly-once
//       *in effect*.
//     - The event payloads are the canonical forgepoint.events.v1 messages
//       (not raw JSON), so the outbox `payload` column is a typed, versioned,
//       buf-breaking-checked contract — the same "typed payload in a generic
//       envelope" discipline as the registry service. The poller marshals an
//       eventsv1.* message into common.v1.EventEnvelope.data (an Any) and
//       publishes it to the subject below.
//
//   REAL-WORLD COMPARISON:
//     - This is exactly how Stripe, Shopify, and most ledger systems publish
//       events reliably. Debezium + Kafka Connect productize the "tail the
//       outbox/WAL" half. Temporal sidesteps it with durable workflow state.
//     - INTERVIEW NOTE: the classic probe is "why not just publish to NATS
//       inside the same code path after the DB commit?" — answer: the process
//       can die in the gap between commit and publish; the outbox moves the
//       publish intent INTO the committed transaction so a crash loses nothing.
//
// METERING SOURCES — the two events billing CONSUMES (canonical eventsv1):
//   1. fp.inference.completed (events.InferenceCompleted) — the PRIMARY feeder,
//      emitted by the Inference Gateway (the single canonical inference event; a
//      serving pod must NOT emit a competing one). Each completed inference yields
//      usage on TWO meters: METER_TYPE_INFERENCE_REQUEST (one per call) and, when
//      token_count > 0, METER_TYPE_INFERENCE_TOKENS. The event carries token_count
//      and api_key_id, so billing meters both axes off ONE event and resolves the
//      billed team from api_key_id (NEVER from a client field).
//      EXACTLY-ONCE-IN-EFFECT (inbound half): NATS is at-least-once, so the
//      consumer DEDUPES on events.InferenceCompleted.request_id — a request_id it
//      already metered is skipped. request_id flows into the UsageRecord as
//      source_request_id (and into RecordUsageRequest.idempotency_key for the
//      direct-call path). This is the NATS→DB half of exactly-once; the outbox is
//      the DB→NATS half.
//   2. fp.models.version.ready (events.ModelVersionReady) — emitted by the
//      Registry when an artifact upload is verified. Billing meters
//      METER_TYPE_STORAGE_BYTES from the event's server-measured size_bytes, so
//      storage cost rides the same outbox pipeline as inference cost.
//   The billing consumer turns each consumed event into a RecordUsage (internally)
//   so the same metering path serves both the event consumers AND any direct gRPC
//   caller (e.g. a backfill tool). RecordUsage is therefore exposed on the gRPC
//   surface even though, in steady state, most traffic arrives via NATS.
//
// ENUM MAPPING — billing.MeterType <-> events.MeterType:
//   The event bus carries a MIRROR enum (events.v1.MeterType) with byte-identical
//   values (UNSPECIFIED=0, INFERENCE_REQUEST=1, INFERENCE_TOKENS=2,
//   COMPUTE_SECONDS=3, STORAGE_BYTES=4). The handler maps billing.MeterType <->
//   events.MeterType at the publish/consume boundary — a few lines of mechanical
//   conversion that keep the API enum free to evolve independently of the wire
//   contract (the "event schema decoupled from API schema" discipline).
//
// SECURITY / TRUST BOUNDARY (this is a billing service — get this right):
//   EVERY money-bearing or attribution field is SERVER-AUTHORITATIVE. Clients
//   submit only the raw, verifiable METERING FACTS (which model/version, how
//   many requests, how many tokens/compute-units). The server looks up the
//   rate plan and COMPUTES the cost. A client may never assert a price, a
//   discount, a cost, an invoice total, a quota, a status, a timestamp, or
//   whose account to bill. Accepting any of those would be a mass-assignment
//   vulnerability with a direct financial blast radius. See per-field notes.
//
// INTEGER OVERFLOW — a money service MUST guard its arithmetic:
//   All money is int64 micro-units and all quantities are int64. The metering
//   math (cost = quantity * unit_price_micros) and the invoice rollup
//   (total = Σ line_item.amount) are MULTIPLICATIONS and SUMS over int64 that can
//   silently WRAP on overflow — and a wrapped total is a real, signed money bug
//   (a huge bill becomes a negative credit). The wire types stay int64 (protobuf
//   has no int128, and int64 micro-units comfortably covers any sane bill: 2^63
//   micro-USD ≈ 9.2 trillion USD), but the SERVER MUST:
//     (a) bound each input `quantity` to a sane per-record maximum (see the
//         MAX_QUANTITY_PER_RECORD note on RecordUsageRequest.quantity) and reject
//         out-of-range values with InvalidArgument — never truncate;
//     (b) perform every multiply/sum with CHECKED arithmetic (math/bits or an
//         explicit overflow test) and fail the operation rather than wrap;
//     (c) reject negative `quantity` (only server-issued credits may be negative,
//         and those never come from a client).
//   This guard is a server-side INVARIANT the proto documents but cannot itself
//   enforce; the integration tests assert the rejection at the boundary.
//
// VERSIONING: Package path includes v1 per Buf/Google convention. Breaking
// changes require a new forgepoint.billing.v2 package.
// ============================================================================

syntax = "proto3";

package forgepoint.billing.v1;

// go_package follows the pattern established in common.proto:
//   "github.com/abd-ulbasit/forgepoint/gen/go/{package};{shortname}"
// The semicolon short name (billingv1) is the Go package identifier, keeping
// imports unambiguous when several proto packages are pulled into one file.
option go_package = "github.com/abd-ulbasit/forgepoint/gen/go/forgepoint/billing/v1;billingv1";

import "google/protobuf/timestamp.proto";
import "forgepoint/common/v1/common.proto";
// NOTE — we deliberately do NOT import forgepoint/events/v1/events.proto here.
// forgepoint.events.v1 is the SINGLE SOURCE OF TRUTH for every NATS event payload
// on the platform (see proto/forgepoint/events/v1/events.proto). This service
// formerly defined its OWN UsageRecorded/InvoiceGenerated/QuotaExceeded payloads
// here; an adversarial cross-service review found such ad-hoc messages drifting
// from their consumers, so they have been DELETED and billing depends on the
// canonical eventsv1 types instead. But that dependency is satisfied in GENERATED
// GO (the outbox poller marshals an eventsv1.* message into
// common.v1.EventEnvelope.data at publish time, and the handler maps
// billing.MeterType <-> events.MeterType at the boundary) — this API .proto
// references no events.v1 TYPE, so importing it here would be an unused proto
// import (Buf IMPORT_USED) and a dead compile-time coupling of the API schema to
// the event schema, the exact coupling events.proto exists to avoid. The
// SUBJECT/MESSAGE names in the comments below are the documented contract; the
// wire types live in events.proto and are pulled in by the Go code, not here.

// ============================================================================
// ENUMS
// ============================================================================

// ============================================================================
// MeterType — what kind of resource a usage record measures.
// ============================================================================
//
// WHY an enum, not a free string:
//   Closed, validated set at the wire boundary. The rate plan prices each meter
//   type differently, so a typo ("infernce") must not silently fall through to
//   a zero price. Buf STANDARD requires the _UNSPECIFIED zero value and the
//   ENUM_NAME prefix on every value.
//
// WHY separate inference-request vs inference-tokens:
//   Real ML billing meters on MORE than one axis simultaneously — a single
//   inference call costs a per-request fee AND a per-token (or per-compute-unit)
//   fee. Modeling them as distinct meter types lets one InferenceCompleted
//   produce multiple priced line items, which is how OpenAI/Anthropic-style
//   token billing actually works.
//
// MIRRORED ON THE BUS: events.v1.MeterType has byte-identical values. This is
//   the SERVICE/API enum; the handler maps billing.MeterType <-> events.MeterType
//   at the publish/consume boundary so the event schema can evolve independently
//   of this API enum (the events.proto decoupling discipline). Keep the two in
//   lockstep when adding a meter.
// ============================================================================
enum MeterType {
  // Required zero value. Unknown/unset meter — the server rejects RecordUsage
  // with this value rather than guessing a price.
  METER_TYPE_UNSPECIFIED = 0;

  // One billable inference REQUEST (the per-call fee), regardless of size.
  METER_TYPE_INFERENCE_REQUEST = 1;

  // Tokens processed by an inference call (prompt + completion). Priced
  // per-1k-tokens by the rate plan. The dominant cost axis for LLM serving.
  METER_TYPE_INFERENCE_TOKENS = 2;

  // Compute-seconds consumed by serving (for non-token models priced on
  // wall-clock / GPU time rather than tokens).
  METER_TYPE_COMPUTE_SECONDS = 3;

  // Artifact bytes stored in the model registry / object store, metered
  // periodically. Lets storage cost ride the same pipeline as inference cost.
  METER_TYPE_STORAGE_BYTES = 4;
}

// ============================================================================
// InvoiceStatus — lifecycle of an invoice.
// ============================================================================
//
// WHY an enum: invoice status drives money-moving side effects (you can only
// charge a card on a FINALIZED invoice, you can't re-finalize a PAID one). A
// closed validated set with explicit transitions is mandatory for an auditable
// ledger. Status is SERVER-authoritative — a client can never set it.
// ============================================================================
enum InvoiceStatus {
  // Required zero value. Unknown/unset.
  INVOICE_STATUS_UNSPECIFIED = 0;

  // Accumulating: the billing period is still open and line items are still
  // being metered onto this invoice. Not yet collectible.
  INVOICE_STATUS_DRAFT = 1;

  // Period closed and totals locked. The InvoiceGenerated event fires on this
  // transition. Collectible but not yet paid.
  INVOICE_STATUS_FINALIZED = 2;

  // Payment received and reconciled. Terminal (happy path).
  INVOICE_STATUS_PAID = 3;

  // Finalized but unpaid past its due date. Drives dunning / Notification.
  INVOICE_STATUS_OVERDUE = 4;

  // Reversed/written off (e.g. credit issued). Terminal. Kept for audit, never
  // deleted — ledgers are append-only.
  INVOICE_STATUS_VOID = 5;
}

// ============================================================================
// DOMAIN MESSAGES
// ============================================================================

// ============================================================================
// Money — a precise monetary amount.
// ============================================================================
//
// WHY integer minor units, NOT double:
//   Floating point cannot represent most decimal money values exactly
//   (0.10 + 0.20 != 0.30 in IEEE-754). Accumulating float errors over millions
//   of metered calls produces real money discrepancies and fails reconciliation.
//   We store the amount as an INTEGER in the currency's minor unit so all
//   arithmetic is exact integer math. This mirrors Stripe's Money model and the
//   google.type.Money guidance.
//
// WHY micro-units (1e-6) rather than cents:
//   Per-token / per-request prices are tiny — a single token might cost
//   0.0000004 USD. Cents (1e-2) would round that to zero. We use MICRO units
//   (1/1,000,000 of the major unit, i.e. micro-dollars) so we can price and sum
//   sub-cent meters exactly and only round to cents at invoice finalization.
//   So amount_micros = 1_000_000 means 1.00 USD; 4 means 0.000004 USD.
//
// WHY currency_code is here on every amount:
//   Self-describing money prevents the classic "is this dollars or cents? USD
//   or EUR?" ambiguity at every boundary. ISO 4217 code ("USD", "EUR").
//
// SECURITY: Money only ever appears in RESPONSES and in server-built event
// payloads. It is NEVER a field on a client write request — clients submit
// quantities, the server attaches the price.
// ============================================================================
message Money {
  // Amount in micro-units of the currency's major unit (1e-6). Exact integer.
  // 1_000_000 == 1.00 of the currency. May be negative for credits/refunds.
  int64 amount_micros = 1;

  // ISO 4217 currency code, uppercase: "USD", "EUR". Empty is invalid.
  string currency_code = 2;
}

// ============================================================================
// RatePlan — the pricing the server applies to metered usage.
// ============================================================================
//
// WHY this lives server-side and is referenced, not supplied:
//   The rate plan is the SOURCE of every price. A usage record references a rate
//   plan by id; the server reads the plan's unit prices to compute cost. The
//   client never sees or sends prices on the write path — it can only learn them
//   after the fact via GetUsage/GetInvoice. This is the structural guarantee
//   that "the client cannot set its own price".
//
// RATE-PLAN MANAGEMENT RPCs: CreateRatePlan (admin) and GetRatePlan are part of
//   this surface — the platform design (Phase 8.1) lists CreateRatePlan, and the
//   metering math is undefined without a plan to resolve. CreateRatePlan is
//   ADMIN-ONLY (it sets prices for real money) and id/created_at are server-set
//   (mass-assignment guard). GetRatePlan lets a client/BFF read the pricing it
//   will be billed under. Mutating an existing plan's prices in place is
//   deliberately NOT offered: prices are immutable once a usage record has pinned
//   them (reproducible billing), so "changing" a plan means creating a new one —
//   adding a versioned UpdateRatePlan later is additive (buf-breaking-safe).
// ============================================================================
message RatePlan {
  // UUID v4. Stable identifier referenced by usage records and invoices.
  string id = 1;

  // Human-readable plan name: "free-tier", "standard", "enterprise".
  string name = 2;

  // Per-meter unit prices. Key is the MeterType's string name (e.g.
  // "METER_TYPE_INFERENCE_TOKENS"); value is the price for ONE unit of that
  // meter (per request, per token, per compute-second, per byte) as Money.
  // WHY a map keyed by meter rather than fixed fields: meter types grow over
  // time; a map lets us add a meter's price without a schema change.
  map<string, Money> unit_prices = 3;

  // Included free allowance per billing period, keyed by meter name. Usage
  // beyond the allowance is what gets charged. Empty = no free tier.
  map<string, int64> included_quantities = 4;

  // Monthly quota cap per meter name (hard limit). Exceeding it is what fires
  // the QuotaExceeded event. 0 / absent for a given meter = no hard cap.
  map<string, int64> quota_limits = 5;

  // When this plan was created. Server-set, immutable.
  google.protobuf.Timestamp created_at = 6;
}

// ============================================================================
// UsageRecord — one metered, priced fact (the atom of the ledger).
// ============================================================================
//
// WHY this is the unit of record:
//   Every billable action becomes exactly one UsageRecord. Invoices are just
//   aggregations of UsageRecords over a period. Keeping the atom immutable and
//   append-only (we never UPDATE a recorded usage row, we only INSERT) makes the
//   ledger auditable and reconciliation tractable — the same append-only
//   discipline as the Feature Store's event log.
//
// EVERY money/attribution field below is SERVER-COMPUTED. The client side of a
// RecordUsage supplies only meter_type + quantity (+ what was served). See
// RecordUsageRequest for the strict input contract.
// ============================================================================
message UsageRecord {
  // UUID v4 assigned by the server. Primary key of the ledger row.
  string id = 1;

  // The team this usage is billed to. SERVER-derived from the authenticated
  // caller's claims (team) or, for the InferenceCompleted consumer, from the
  // API key that made the inference. NEVER taken from a client write field —
  // letting a caller name the billed team is account-takeover-for-money.
  string team = 2;

  // The rate plan that was applied to price this record. SERVER-resolved from
  // the team's current plan at metering time, and pinned here so the price is
  // reproducible even if the team's plan later changes.
  string rate_plan_id = 3;

  // What was metered.
  MeterType meter_type = 4;

  // How many units of that meter (request count, token count, compute-seconds,
  // bytes). This is the one quantity the client/event supplies and the server
  // validates (non-negative, sane bounds).
  int64 quantity = 5;

  // The price the server computed for this record: quantity * plan unit price
  // (after free-allowance logic). Authoritative; clients cannot supply it.
  Money cost = 6;

  // What produced the usage — for attribution and per-model usage reports.
  // SERVER-populated from the inference event / request context.
  string model_id = 7;
  string model_version = 8;

  // The inference request id (or upstream event id) this record was derived
  // from. Doubles as the natural idempotency anchor: two records must never
  // share a source_request_id. SERVER-stored from the metering input.
  string source_request_id = 9;

  // When the metered action occurred (event time, not insert time).
  // SERVER-stamped from the source event; clients cannot backdate usage.
  google.protobuf.Timestamp occurred_at = 10;
}

// ============================================================================
// UsageSummary — an aggregated usage rollup (the shape GetUsage returns).
// ============================================================================
//
// WHY a summary type distinct from UsageRecord:
//   GetUsage answers "how much has team X used / spent this period?" — callers
//   (dashboards, the BFF) want a ROLLUP, not millions of raw records. Returning
//   raw UsageRecords for a heavy team would be unbounded and useless for a
//   dashboard. The summary buckets quantity and cost per meter type.
// ============================================================================
message UsageSummary {
  // The team this summary covers.
  string team = 1;

  // The window this rollup aggregates over (inclusive start, exclusive end).
  google.protobuf.Timestamp period_start = 2;
  google.protobuf.Timestamp period_end = 3;

  // Per-meter aggregation. Key is the MeterType string name; value is the
  // bucketed totals for that meter over the window.
  map<string, MeterUsage> by_meter = 4;

  // Total cost across all meters in the window. Server-computed sum.
  Money total_cost = 5;
}

// MeterUsage — one meter's bucket inside a UsageSummary.
message MeterUsage {
  // Which meter this bucket is for (redundant with the map key, included so the
  // value is self-describing if extracted from the map).
  MeterType meter_type = 1;

  // Total units of this meter over the window.
  int64 total_quantity = 2;

  // Total cost attributed to this meter over the window.
  Money total_cost = 3;
}

// ============================================================================
// Invoice — a finalized (or draft) bill for a team over a billing period.
// ============================================================================
//
// WHY invoices are derived, never client-authored:
//   An invoice is a server-built aggregation of UsageRecords plus the plan's
//   pricing over a closed period. There is no "create invoice from client data"
//   path — that would let a customer write their own bill. Invoices are produced
//   by the period-close job, which emits InvoiceGenerated through the outbox.
// ============================================================================
message Invoice {
  // UUID v4. Stable invoice identifier.
  string id = 1;

  // Human-facing invoice number (e.g. "INV-2026-000042"). Server-assigned,
  // monotonic, distinct from the UUID so it's safe to print/share.
  string invoice_number = 2;

  // Team being billed.
  string team = 3;

  // The rate plan in effect for this period.
  string rate_plan_id = 4;

  // Lifecycle status. SERVER-authoritative; drives collectibility.
  InvoiceStatus status = 5;

  // Billing period covered (inclusive start, exclusive end).
  google.protobuf.Timestamp period_start = 6;
  google.protobuf.Timestamp period_end = 7;

  // The priced breakdown that sums to the total. One line per meter (and/or per
  // model), so the customer can see WHERE cost came from.
  repeated InvoiceLineItem line_items = 8;

  // The invoice total. Server-computed sum of line_items, rounded to the
  // currency's minor unit (cents) at finalization. Authoritative.
  Money total = 9;

  // When the invoice was created (period open) and finalized (period close).
  // finalized_at is unset while status == DRAFT.
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp finalized_at = 11;

  // When payment is due (set on finalization). Past-due drives OVERDUE.
  google.protobuf.Timestamp due_at = 12;
}

// InvoiceLineItem — one priced row on an invoice.
message InvoiceLineItem {
  // What this line meters.
  MeterType meter_type = 1;

  // Free-text description for the customer: "Inference tokens (gpt-mini v3)".
  string description = 2;

  // Total billable units on this line (after free allowance).
  int64 quantity = 3;

  // Per-unit price applied (from the pinned rate plan), for transparency.
  Money unit_price = 4;

  // Line total = quantity * unit_price. Server-computed.
  Money amount = 5;
}

// ============================================================================
// REQUEST / RESPONSE MESSAGES
// ============================================================================

// ============================================================================
// RecordUsage
// ============================================================================
//
// RecordUsageRequest is the STRICT metering-input contract. This is the single
// most security-sensitive write in the platform, so the input surface is
// deliberately MINIMAL: the caller supplies only the verifiable raw facts, and
// the server attaches everything that touches money or attribution.
//
// WHAT THE CLIENT MAY SEND (and only this):
//   meter_type, quantity, model_id, model_version, source_request_id,
//   occurred_at, idempotency_key.
//
// WHAT THE CLIENT MAY NOT SEND (server-authoritative — absent by design):
//   team / billed account  → derived from auth claims or the inference API key
//   rate_plan_id           → resolved from the team's current plan
//   cost / price / Money   → computed by the server from the plan
//   any invoice/status     → never settable
//
// WHY occurred_at is accepted but still constrained:
//   The metering source (InferenceCompleted) carries the true event time, which
//   can legitimately be slightly in the past (queue lag). We accept it so usage
//   lands in the correct billing period, but the server CLAMPS it to a sane
//   window (e.g. not in the future, not older than the open period) so a caller
//   can't backdate usage into a closed/paid invoice. Empty = server uses now().
//
// IDEMPOTENCY (critical for an at-least-once meter):
//   The upstream InferenceCompleted is delivered at-least-once, and clients
//   retry. A duplicate must NOT bill twice. idempotency_key (client-generated,
//   stable per logical action — typically the inference request id) is stored
//   with the created UsageRecord; a repeat with the same key returns the
//   ORIGINAL record instead of inserting a second one. This is the NATS→DB half
//   of the exactly-once-in-effect guarantee (the outbox is the DB→NATS half).
// ============================================================================
message RecordUsageRequest {
  // What is being metered. Must be a known, non-UNSPECIFIED meter.
  MeterType meter_type = 1;

  // How many units (requests, tokens, compute-seconds, bytes). Server validates
  // NON-NEGATIVE (a client may never submit a negative quantity; only server-
  // issued credits are negative) and within a sane per-record cap:
  //   MAX_QUANTITY_PER_RECORD (server constant, e.g. 1_000_000_000) — chosen so
  //   quantity * the largest unit price still cannot overflow int64 micro-units,
  //   so the cost multiply is provably safe. Out-of-range → InvalidArgument
  //   (rejected, never truncated). See the INTEGER OVERFLOW note in the header.
  int64 quantity = 2;

  // What produced the usage (for attribution / per-model reports). Optional but
  // strongly recommended; used only for reporting, never for pricing.
  string model_id = 3;
  string model_version = 4;

  // The originating inference request id (or upstream event id). Used for
  // lineage and as the natural dedupe anchor. SHOULD be set for inference usage.
  string source_request_id = 5;

  // Event time of the metered action. Server clamps to the valid window; empty
  // means "use server now()". See WHY note above — cannot backdate into a
  // closed period.
  google.protobuf.Timestamp occurred_at = 6;

  // Idempotency key (UUID/stable string). A repeat returns the original record.
  // See IDEMPOTENCY note above — this is what makes redelivery safe.
  string idempotency_key = 7;
}

// RecordUsageResponse returns the server-built, priced UsageRecord.
// WHY return the full record: the caller (and the integration test) can see the
// authoritative team, rate_plan_id, and computed cost the server attached —
// proving the price was server-derived, not client-supplied.
message RecordUsageResponse {
  // The committed, priced ledger record (id, team, cost all server-set).
  UsageRecord record = 1;

  // True if this call hit the idempotency path (the key was already recorded)
  // and `record` is the pre-existing one rather than a newly inserted row.
  // Lets retrying clients distinguish "I just created it" from "already there".
  bool deduplicated = 2;
}

// ============================================================================
// GetUsage
// ============================================================================
//
// GetUsageRequest asks for an AGGREGATED, paginated usage view for a team over
// a time window. Returns UsageSummary rollups, not raw records (see UsageSummary
// WHY note). Pagination applies when the window is broken into sub-period
// buckets (e.g. daily) so a long range stays bounded.
//
// AUTHORIZATION NOTE: a non-admin caller may only query their OWN team. The
// `team` filter is enforced server-side against auth claims — supplying another
// team is rejected unless the caller is an admin. The field exists so admins and
// the BFF can scope queries; it is NOT a way to bypass tenant isolation.
message GetUsageRequest {
  // Team to report on. For non-admins the server overrides this with the
  // caller's own team (cannot read another team's spend). Required for admins.
  string team = 1;

  // Inclusive start / exclusive end of the reporting window. Empty start =
  // current billing period start; empty end = now. The server CAPS the maximum
  // span to MAX_USAGE_WINDOW (server constant, e.g. 366 days) to bound query
  // cost; a wider request is rejected with InvalidArgument rather than silently
  // truncated, so a caller can't accidentally scan the whole ledger.
  google.protobuf.Timestamp period_start = 2;
  google.protobuf.Timestamp period_end = 3;

  // Optional: restrict to a single meter type. UNSPECIFIED = all meters.
  MeterType meter_type_filter = 4;

  // Cursor-based pagination over sub-period buckets. page_size defaults to 20,
  // capped at MAX_PAGE_SIZE = 100 server-side (see common.proto). A request above
  // the cap is clamped to 100, never honored as-is. See PaginationRequest.
  forgepoint.common.v1.PaginationRequest pagination = 5;
}

// GetUsageResponse returns the page of usage summaries plus a grand total.
message GetUsageResponse {
  // Per-bucket rollups for this page (e.g. one summary per day in the window).
  repeated UsageSummary summaries = 1;

  // The aggregate cost across the ENTIRE requested window (not just this page),
  // so a dashboard can show the period total without paging through everything.
  Money grand_total = 2;

  // Pagination metadata: next_page_token + total_count of buckets.
  forgepoint.common.v1.PaginationResponse pagination = 3;
}

// ============================================================================
// GetInvoice
// ============================================================================

// GetInvoiceRequest fetches a single invoice by id.
message GetInvoiceRequest {
  // The invoice UUID (Invoice.id). Server enforces that the caller's team owns
  // this invoice (or the caller is admin) — no cross-team invoice reads.
  string invoice_id = 1;
}

// GetInvoiceResponse wraps the invoice.
// WHY wrap rather than return Invoice directly: Buf RPC_RESPONSE_STANDARD_NAME,
// and forward-compat (we may later add e.g. a payment_url alongside the invoice
// without touching the Invoice domain message).
message GetInvoiceResponse {
  // The requested invoice with its line items and server-computed totals.
  Invoice invoice = 1;
}

// ============================================================================
// ListInvoices
// ============================================================================

// ListInvoicesRequest lists a team's invoices, newest first, paginated.
message ListInvoicesRequest {
  // Team whose invoices to list. Non-admins are scoped to their own team
  // server-side regardless of this value (tenant isolation).
  string team = 1;

  // Optional status filter (e.g. only OVERDUE for a dunning view).
  // UNSPECIFIED = all statuses.
  InvoiceStatus status_filter = 2;

  // Cursor-based pagination. page_size defaults to 20, capped at MAX_PAGE_SIZE =
  // 100 server-side (clamped, not honored as-is). See common.proto
  // PaginationRequest for the WHY on cursors.
  forgepoint.common.v1.PaginationRequest pagination = 3;
}

// ListInvoicesResponse returns the page of invoices.
message ListInvoicesResponse {
  // The page of invoices (server orders by created_at DESC — newest first).
  repeated Invoice invoices = 1;

  // Pagination metadata: next_page_token + total_count.
  forgepoint.common.v1.PaginationResponse pagination = 2;
}

// ============================================================================
// CreateRatePlan  (ADMIN — sets real prices)
// ============================================================================
//
// CreateRatePlanRequest defines a NEW priced plan. This is an ADMIN-ONLY write:
// it sets the unit prices, free allowances, and quota caps the metering math
// will apply to real money, so the server enforces an admin role before
// accepting it. It is also the second-most security-sensitive write here, so the
// same mass-assignment discipline as RecordUsage applies.
//
// SERVER-AUTHORITATIVE (absent from this request by design):
//   id          → server-assigned UUID (a client may not choose/overwrite a
//                 plan id — that's how you'd hijack an existing plan).
//   created_at  → server-stamped.
// The client supplies only the pricing DEFINITION (name + the three maps).
//
// PRICE VALIDATION (server-side invariant): every unit_prices entry must use the
// SAME currency_code (no mixed-currency plan) and a NON-NEGATIVE amount; every
// map key must be a valid MeterType name. Invalid → InvalidArgument.
message CreateRatePlanRequest {
  // Human-readable plan name ("free-tier","standard","enterprise"). Unique per
  // deployment is a server-enforced constraint, not a wire concern.
  string name = 1;

  // Per-meter unit prices. Key = MeterType name; value = price per ONE unit.
  // All values MUST share one currency_code (server-validated).
  map<string, Money> unit_prices = 2;

  // Included free allowance per billing period, keyed by MeterType name.
  // Empty = no free tier.
  map<string, int64> included_quantities = 3;

  // Hard monthly quota cap per MeterType name. Crossing it fires the
  // events.QuotaExceeded outbox event. 0 / absent = no hard cap for that meter.
  map<string, int64> quota_limits = 4;

  // Idempotency key (UUID/stable string). A retry with the same key returns the
  // ORIGINAL plan instead of creating a duplicate — admin tooling retries too.
  string idempotency_key = 5;
}

// CreateRatePlanResponse returns the server-built plan (id + created_at set).
message CreateRatePlanResponse {
  // The committed plan, with its server-assigned id and created_at.
  RatePlan rate_plan = 1;

  // True if the idempotency key already existed and `rate_plan` is the
  // pre-existing one rather than a newly created plan.
  bool deduplicated = 2;
}

// ============================================================================
// GetRatePlan  (read pricing)
// ============================================================================

// GetRatePlanRequest fetches a single rate plan by id. WHY expose this: a BFF /
// the `fp` CLI needs to SHOW a team the pricing it will be billed under, and a
// usage report references the plan that was applied. Read-only; a non-admin may
// read the plan currently assigned to its own team (server-enforced), not an
// arbitrary plan id.
message GetRatePlanRequest {
  // The rate plan UUID (RatePlan.id).
  string rate_plan_id = 1;
}

// GetRatePlanResponse wraps the plan (forward-compat per RPC_RESPONSE_STANDARD).
message GetRatePlanResponse {
  // The requested rate plan with its unit prices, allowances, and quota caps.
  RatePlan rate_plan = 1;
}

// ============================================================================
// CheckQuota  (gateway pre-flight)
// ============================================================================
//
// CheckQuotaRequest asks "how much of its quota does this team have left on this
// meter?". WHY this RPC exists (design Task 8.4): the Inference Gateway calls it
// BEFORE forwarding a request, to reject/throttle a team that is over quota. The
// gateway CACHES the answer in Redis (eventual consistency with the DB is
// acceptable for a pre-flight) and the events.QuotaExceeded outbox event flips
// that cache to "blocked" between calls — CheckQuota is the cache-fill / cold
// path, the event is the invalidation.
//
// AUTHORIZATION/TENANCY: `team` is the team to check. For a non-admin caller the
// server OVERRIDES it with the caller's own team derived from auth claims — the
// field exists so the gateway (a trusted internal caller) and admins can scope
// the check; it is NOT a way to probe another tenant's quota. Same rule as
// GetUsage's team filter.
message CheckQuotaRequest {
  // Team to check. Server overrides with the caller's own team for non-admins.
  string team = 1;

  // Which meter's quota to check. Must be a known, non-UNSPECIFIED meter.
  MeterType meter_type = 2;
}

// CheckQuotaResponse reports the team's standing on the requested meter. All
// fields are SERVER-computed from the team's current plan + period usage.
message CheckQuotaResponse {
  // The team checked + the plan whose quota applies (echoed for the cache key).
  string team = 1;
  string rate_plan_id = 2;
  MeterType meter_type = 3;

  // The plan's hard cap for this meter (0 = unlimited / no cap configured).
  int64 quota_limit = 4;

  // The team's usage of this meter SO FAR in the current billing period.
  int64 current_usage = 5;

  // remaining = max(0, quota_limit - current_usage); 0 when over or at the cap.
  // Server-computed so the gateway needn't re-derive it.
  int64 remaining = 6;

  // True if current_usage >= quota_limit (i.e. the team is OVER quota and the
  // gateway should reject/throttle). False when quota_limit == 0 (no cap).
  bool exceeded = 7;
}

// ============================================================================
// EVENT CONTRACT — billing PRODUCES three events, defined in forgepoint.events.v1
// ============================================================================
//
// NO event-payload messages are declared here. Billing's three events live in
// the canonical forgepoint.events.v1 package (the platform's single source of
// truth); the outbox poller marshals one of those messages into
// common.v1.EventEnvelope.data (an Any) and publishes it. This file used to
// declare its own UsageRecorded/QuotaExceeded/InvoiceGenerated — DELETED, because
// per-service ad-hoc event messages drifted from their consumers (see import
// block). The canonical contract is referenced (not redefined) here:
//
//   SUBJECT                        PAYLOAD (forgepoint.events.v1)   CONSUMERS
//   ─────────────────────────────  ──────────────────────────────  ────────────────────────────
//   fp.billing.usage.recorded      events.UsageRecorded            experiment-tracker, dashboards
//   fp.billing.quota.exceeded      events.QuotaExceeded            notification, inference-gateway
//   fp.billing.invoice.generated   events.InvoiceGenerated         notification
//
// SUBJECT NOTE (conflict #6): the design doc's fp.billing.> hierarchy listed
//   quota.exceeded and invoice.generated explicitly; usage.recorded was implied
//   by the outbox example. fp.billing.usage.recorded is the NEW sanctioned
//   subject under the existing fp.billing.> tree (added to the design-doc NATS
//   hierarchy as part of this alignment).
//
// MONEY IS FLATTENED IN THE EVENTS (decoupling, not an oversight): the canonical
//   events.UsageRecorded carries cost_micros + currency_code (NOT a billing.Money
//   and NOT the whole UsageRecord); events.InvoiceGenerated carries total_micros +
//   currency_code (NOT a billing.Invoice). WHY: a consumer (Experiment Tracker,
//   Notification) must NOT have to compile-depend on this billing API proto just to
//   read an event. The handler maps billing.Money/UsageRecord/Invoice -> the flat
//   event scalars at publish time, and billing.MeterType -> events.MeterType.
//
// ALL THREE GO THROUGH THE OUTBOX: each event row is written in the SAME Postgres
//   transaction as the business write it describes (the usage/quota update or the
//   invoice finalize), then the poller publishes at-least-once. Consumers are
//   idempotent on EventEnvelope.id, so at-least-once is safe.

// ============================================================================
// BILLING SERVICE
// ============================================================================
//
// WHY a single BillingService (not separate Usage / Invoice services):
//   Usage and invoicing are the same bounded context — invoices ARE aggregated
//   usage. Splitting them would force a cross-service call on every period close
//   and fracture the ledger's single source of truth. One service owns the
//   `fp_billing` database (usage_events, quotas, rate_plans, invoices, outbox)
//   per the database-per-service standard.
//
// RPC CATEGORIES:
//   METERING (write): RecordUsage — the outbox-protected write path. In steady
//     state this is driven by the events.InferenceCompleted NATS consumer (and
//     events.ModelVersionReady for storage); exposed on gRPC for backfills and
//     direct metering.
//   PRICING (admin/read): CreateRatePlan (admin write — sets real prices),
//     GetRatePlan (read the pricing a team is billed under).
//   QUOTA (read): CheckQuota — the gateway's pre-flight; cheap "how much is left"
//     answer the gateway caches in Redis (the QuotaExceeded event invalidates it).
//   REPORTING (read): GetUsage (aggregated, paged), GetInvoice, ListInvoices
//     (paged) — read-only views over the ledger.
//
// WHY ALL UNARY (no streaming):
//   - RecordUsage / CreateRatePlan / CheckQuota are single fact-in / record-out —
//     request/reply.
//   - GetUsage/ListInvoices return BOUNDED, PAGINATED pages; pagination (not a
//     server stream) is the right tool because it gives clients resumability,
//     cacheable page tokens, and a natural total_count — the same choice the
//     registry's list RPCs made. A server stream would suit an UNBOUNDED live
//     feed (e.g. tail usage in real time); that real-time need is served by the
//     async events.UsageRecorded NATS event instead, keeping the gRPC surface
//     simple.
//
// QUOTA ENFORCEMENT — two complementary mechanisms:
//   CheckQuota is the PULL/pre-flight (gateway asks before forwarding; cache-fill
//   cold path). The events.QuotaExceeded outbox event is the PUSH/invalidation
//   (the moment a team crosses the cap, the event flips the gateway's Redis cache
//   to "blocked"). Eventual consistency between DB and the gateway cache is
//   acceptable for a pre-flight — the worst case is a handful of over-quota calls
//   slip through before the cache flips, which the next RecordUsage still meters.
//
// ASCII DIAGRAM — the outbox metering pipeline (interview-critical):
//
//   Inference Gateway ──fp.inference.completed──► Billing NATS consumer
//                                                      │ (dedupe on request_id)
//                                                      ▼
//                                         ┌─ BEGIN tx ───────────────────────────┐
//                                         │  INSERT usage_record (priced)        │
//                                         │  UPDATE quota counter                │
//                                         │  INSERT outbox(events.UsageRecorded) │
//                                         │  if over quota:                      │
//                                         │     INSERT outbox(events.QuotaExceeded)│
//                                         └─ COMMIT ─────────────────────────────┘
//                                                      │
//                            outbox poller (separate goroutine, at-least-once)
//                                                      ▼
//                            NATS  fp.billing.usage.recorded / .quota.exceeded
//                                                      ▼
//                            Notification / Inference Gateway / Experiment Tracker
// ============================================================================
service BillingService {
  // RecordUsage meters one billable action and writes it to the ledger via the
  // outbox. The cost is COMPUTED server-side from the team's rate plan — the
  // request carries only meter facts, never a price (see RecordUsageRequest).
  // Idempotent via idempotency_key, so a redelivered events.InferenceCompleted or
  // a client retry never double-bills. This is the outbox pattern's write half.
  rpc RecordUsage(RecordUsageRequest) returns (RecordUsageResponse);

  // CreateRatePlan defines a new priced plan (unit prices, free allowances, quota
  // caps). ADMIN-ONLY — it sets real money. id/created_at are server-assigned
  // (mass-assignment guard); idempotent via idempotency_key.
  rpc CreateRatePlan(CreateRatePlanRequest) returns (CreateRatePlanResponse);

  // GetRatePlan returns a single rate plan's pricing so a BFF/CLI can show a team
  // what it will be billed. Non-admins may read only their own team's plan.
  // Read-only.
  rpc GetRatePlan(GetRatePlanRequest) returns (GetRatePlanResponse);

  // CheckQuota is the gateway's pre-flight: returns remaining quota + an
  // `exceeded` flag for a team/meter so the gateway can reject/throttle before
  // forwarding. Server-computed; non-admins scoped to their own team. Read-only.
  rpc CheckQuota(CheckQuotaRequest) returns (CheckQuotaResponse);

  // GetUsage returns aggregated, paginated usage summaries (per-meter rollups +
  // grand total) for a team over a time window. Non-admins are scoped to their
  // own team server-side. Read-only.
  rpc GetUsage(GetUsageRequest) returns (GetUsageResponse);

  // GetInvoice fetches a single invoice by id, with its server-computed line
  // items and total. Cross-team reads are denied (tenant isolation). Read-only.
  rpc GetInvoice(GetInvoiceRequest) returns (GetInvoiceResponse);

  // ListInvoices returns a team's invoices newest-first, paginated, optionally
  // filtered by status (e.g. OVERDUE for dunning). Read-only.
  rpc ListInvoices(ListInvoicesRequest) returns (ListInvoicesResponse);
}
