// ============================================================================
// Forgepoint Notification Service Proto Definitions
// ============================================================================
//
// WHY: The Notification service is the platform's "town crier" — it turns
// internal platform events (a pipeline failed, a model drifted, a quota was
// exceeded) into human-facing alerts (webhook, Slack, email). Crucially, it
// does this WITHOUT any other service knowing it exists.
//
// PATTERN — CHOREOGRAPHY (Pure Event Reactor):
//   In a CHOREOGRAPHY architecture there is NO central coordinator telling
//   services what to do next. Each service reacts to events it observes and
//   independently decides how to respond. Contrast with ORCHESTRATION (see the
//   Pipeline Orchestrator / saga), where one component issues explicit commands
//   ("now run step 2, now compensate step 1") and owns the workflow state.
//
//   The Notification service is the purest expression of choreography in
//   Forgepoint:
//     - It SUBSCRIBES to the entire event firehose (`fp.>` on NATS JetStream).
//     - For each event it matches the event's `type` against user-configured
//       RULES (e.g. rule pattern `fp.pipelines.*` matches both
//       `fp.pipelines.started` and `fp.pipelines.failed`).
//     - For each matching rule it DELIVERS the event over the rule's channel.
//   No producer ever calls this service. No producer knows a notification was
//   sent. Adding a brand-new event type requires ZERO code changes here — a
//   user just authors a rule whose pattern matches the new subject. THAT is the
//   payoff of choreography: extreme decoupling and independent evolvability.
//
//   THE OTHER SIDE OF THE COIN (interview tradeoff): choreography's weakness is
//   that no single place describes "the whole workflow". To answer "what
//   happens when a pipeline fails?" you must inspect every subscriber. We accept
//   that here because notification is a leaf reaction, not a multi-step business
//   transaction — there is no distributed state to coordinate or compensate.
//
// WHY THE gRPC SURFACE IS DELIBERATELY TINY:
//   The service's REAL work happens on the async (NATS) path — consuming events
//   and delivering them. Almost nothing about that flow is a synchronous
//   request/response, so it does not belong in gRPC. The gRPC API exists ONLY
//   for the human-facing CONTROL PLANE:
//     - reading the notifications I've been sent (inbox) — List/Get/MarkRead
//     - auditing whether my alerts actually went out — ListDeliveryAttempts
//     - configuring HOW and WHEN I want to be notified — Get/UpdatePreferences
//     - verifying a configured channel works — TestChannel (owner self-test)
//   That is the entire RPC surface. We resisted adding "SendNotification" or
//   "TriggerAlert" RPCs precisely because a PRODUCER calling us would VIOLATE
//   choreography — it would make us an orchestrated dependency. Producers emit
//   events; they never address us directly. (TestChannel is NOT such an RPC: it
//   is the OWNER asking us to test THEIR OWN channel, addressing no third party —
//   see its message doc for why that distinction matters.)
//
//   NOTE ON RULES: the implementation plan also mentions CreateRule/ListRules
//   for the matching engine. In this v1 contract we fold a user's routing
//   choices into NotificationPreferences (per-channel, per-event-category
//   toggles) rather than a free-form rule CRUD API, because that is the shape an
//   end user actually wants ("email me on failures, Slack me on drift"). A
//   richer admin rule-builder can arrive as a v2 addition without breaking this
//   surface. This tradeoff is called out so it is defensible in an interview.
//   The plan's third RPC, GetDeliveryLog, IS honored here as ListDeliveryAttempts
//   (the cross-notification delivery-health/audit query).
//
// REAL-WORLD COMPARISON:
//   - PagerDuty / Opsgenie: event intake → routing rules → notification
//     channels. Their "event rules" are exactly our pattern-matched rules.
//   - GitHub notifications: events (push, PR, mention) → per-user preferences →
//     web inbox + email. Our List/MarkRead inbox mirrors GitHub's notifications
//     center; UpdatePreferences mirrors GitHub's notification settings.
//   - AWS EventBridge → SNS: rules match event patterns, fan out to targets.
//   - Kafka consumer groups reacting to a topic with no producer awareness.
//
// DATA STORE: PostgreSQL (notifications inbox + delivery log + preferences).
//
// VERSIONING: Package path includes v1 following Buf/Google convention.
// Breaking changes require a new forgepoint.notification.v2 package.
// ============================================================================

syntax = "proto3";

package forgepoint.notification.v1;

// go_package follows the pattern established in common.proto:
//   "github.com/abd-ulbasit/forgepoint/gen/go/{package};{shortname}"
// The semicolon-separated short name (notificationv1) is the Go package
// identifier, keeping imports unambiguous when several proto packages coexist.
option go_package = "github.com/abd-ulbasit/forgepoint/gen/go/forgepoint/notification/v1;notificationv1";

import "google/protobuf/timestamp.proto";
import "forgepoint/common/v1/common.proto";
// EVENT CONTRACT (single source of truth) — forgepoint/events/v1/events.proto.
// NOTE — we deliberately do NOT import that file here. This service is the
// PRODUCER of two delivery-health events, and those payloads now live in the
// canonical contract, NOT inline here (they used to be defined as
// NotificationDeliveredEvent / NotificationFailedEvent in THIS file — deleted):
//     fp.notifications.delivered → forgepoint.events.v1.NotificationDelivered
//     fp.notifications.failed    → forgepoint.events.v1.NotificationFailed
// The handler marshals one of those GENERATED eventsv1 messages into a
// common.v1.EventEnvelope.data (a google.protobuf.Any) and publishes it; the only
// consumer is the Experiment Tracker / dashboards (delivery success-rate health)
// and an on-call escalation flow. Because this API .proto references no events.v1
// TYPE, importing events.proto here would be an UNUSED proto import — Buf STANDARD
// DOES enforce IMPORT_USED — and a dead compile-time coupling of the API schema to
// the event schema; the Go publisher imports forgepoint/events/v1, this file does
// not. NOTE: there are deliberately NO consumer-side payload types here either
// (see the CHOREOGRAPHY note in the EVENTS section) — inbound events are handled
// OPAQUELY by EventEnvelope.type; that opacity is the point.

// ============================================================================
// ENUMS
// ============================================================================

// ============================================================================
// NotificationChannel
// ============================================================================
//
// WHY an enum (not a free string): the set of delivery transports is small,
// closed, and security-sensitive (each channel has its own config + secret
// handling). An enum gives us exhaustive switch handling in Go and prevents a
// caller from inventing a channel the delivery layer can't service.
//
// CHANNELS:
//   IN_APP  — the platform web inbox (List/Get/MarkRead). Always available, no
//             external config, no secrets. This is the default "channel" for
//             every Notification row even when a fan-out channel also fires.
//   WEBHOOK — HTTP POST of the event payload to a user-configured URL. Delivery
//             uses retries + a per-URL circuit breaker (see implementation plan
//             Task 9.4) so a dead endpoint doesn't get hammered.
//   SLACK   — POST to a Slack Incoming Webhook URL (a specialization of WEBHOOK
//             with Slack's message JSON shape).
//   EMAIL   — SMTP delivery. May be mocked in non-prod (per the plan).
//
// Buf STANDARD requires: zero value suffixed _UNSPECIFIED; every value prefixed
// with the enum name (ENUM_VALUE_PREFIX + ENUM_ZERO_VALUE_SUFFIX).
// ============================================================================
enum NotificationChannel {
  // Default/unknown. A well-formed preference never uses this; it exists so the
  // wire's zero value is explicitly "not set" rather than a meaningful channel.
  NOTIFICATION_CHANNEL_UNSPECIFIED = 0;

  // Platform web inbox (the List/Get/MarkRead surface in this proto).
  NOTIFICATION_CHANNEL_IN_APP = 1;

  // Generic HTTP POST to a caller-supplied URL.
  NOTIFICATION_CHANNEL_WEBHOOK = 2;

  // Slack Incoming Webhook (Slack-shaped JSON over an HTTP POST).
  NOTIFICATION_CHANNEL_SLACK = 3;

  // Email via SMTP.
  NOTIFICATION_CHANNEL_EMAIL = 4;
}

// ============================================================================
// NotificationSeverity
// ============================================================================
//
// WHY: A coarse priority lets the inbox UI sort/badge notifications and lets
// preferences gate noise (e.g. "only EMAIL me for ERROR and above"). The
// severity is derived SERVER-SIDE from the event type — a `*.failed` or
// `*.drift.detected` event maps to ERROR/WARNING; informational lifecycle
// events map to INFO. Clients never set this (it's not on any write request).
//
// We keep this intentionally small (INFO/WARNING/ERROR/CRITICAL) — the classic
// syslog-lite ladder — because a finer scale invites bikeshedding and is hard
// to map consistently from arbitrary event types.
// ============================================================================
enum NotificationSeverity {
  NOTIFICATION_SEVERITY_UNSPECIFIED = 0;

  // Routine lifecycle signal (e.g. pipeline started). Low attention.
  NOTIFICATION_SEVERITY_INFO = 1;

  // Something to look at soon (e.g. mild drift, approaching quota).
  NOTIFICATION_SEVERITY_WARNING = 2;

  // A failure occurred (pipeline failed, delivery failed, quota exceeded).
  NOTIFICATION_SEVERITY_ERROR = 3;

  // Page-someone-now class (e.g. production model drift past the hard threshold,
  // canary failure during a promotion). Highest attention.
  NOTIFICATION_SEVERITY_CRITICAL = 4;
}

// ============================================================================
// DeliveryStatus
// ============================================================================
//
// WHY a per-notification delivery status enum: a single logical notification can
// fan out to several channels, each of which can independently succeed, fail, or
// still be retrying. The inbox needs to surface "did my Slack alert actually go
// out?" The status is owned entirely by the delivery layer (server-authoritative)
// and reported back on Notification reads; it is never accepted on a write.
// ============================================================================
enum DeliveryStatus {
  DELIVERY_STATUS_UNSPECIFIED = 0;

  // Accepted into the system, not yet attempted on a fan-out channel.
  DELIVERY_STATUS_PENDING = 1;

  // Currently being retried (within the exponential-backoff window).
  DELIVERY_STATUS_RETRYING = 2;

  // Successfully delivered on the channel (e.g. webhook returned 2xx).
  DELIVERY_STATUS_DELIVERED = 3;

  // Permanently failed after exhausting retries / circuit-breaker open.
  DELIVERY_STATUS_FAILED = 4;

  // Suppressed by the user's preferences (e.g. severity below their threshold,
  // or quiet hours). Recorded so the inbox can show "we chose not to page you".
  DELIVERY_STATUS_SUPPRESSED = 5;
}

// ============================================================================
// DOMAIN MESSAGES
// ============================================================================

// ============================================================================
// Notification
// ============================================================================
//
// WHY this is the central read model: a Notification is the materialized,
// human-facing record produced when an inbound platform event matched a user's
// preferences. It is what the inbox (List/Get) returns and what MarkRead
// mutates. Think of it as one row in GitHub's notification center.
//
// PROVENANCE FIELDS (event_id, event_type, source_service): we deliberately keep
// a back-pointer to the originating EventEnvelope. WHY: it makes notifications
// debuggable and traceable end-to-end ("this Slack alert came from event
// <uuid> of type fp.pipelines.failed produced by the pipeline service"). It also
// powers idempotency on the consumer — see the consumer note in the service doc.
//
// SECURITY / AUTHORITY: every field here is SERVER-AUTHORITATIVE. The recipient,
// severity, status, timestamps, and provenance are all derived from the event
// and the matching engine — there is no client write path that sets them. The
// inbox is read-mostly; the only mutation a client can perform is MarkRead.
// ============================================================================
message Notification {
  // UUID v4. Stable identifier for this inbox entry. Used by GetNotification
  // and MarkRead. NOT the same as the originating event_id (see below).
  string id = 1;

  // The user this notification was delivered to. Server-set from the matched
  // preference's owner — NEVER taken from a request body. The List RPC scopes
  // results to the authenticated caller (from TokenClaims), so one user can
  // never read another user's inbox.
  string recipient_user_id = 2;

  // Short, human-readable headline for the inbox row.
  // E.g. "Pipeline 'nightly-retrain' failed at step 'train'".
  string title = 3;

  // Longer human-readable body. Rendered server-side from the event payload so
  // the inbox doesn't need per-event-type rendering logic on the client.
  string body = 4;

  // Server-derived severity (see NotificationSeverity). Drives sorting/badging
  // and preference-based suppression. Client cannot set this.
  NotificationSeverity severity = 5;

  // The channels this notification was (or will be) delivered over. A single
  // notification commonly includes IN_APP plus zero or more fan-out channels
  // depending on the recipient's preferences. See DeliveryAttempt for the
  // per-channel outcome.
  repeated NotificationChannel channels = 6;

  // Whether the user has read this notification in the inbox. Flipped by
  // MarkRead. Server-owned; defaults false on creation.
  bool read = 7;

  // PROVENANCE — the EventEnvelope.id (common.proto) that triggered this.
  // Doubles as the idempotency anchor: re-processing the same event_id for the
  // same recipient must NOT create a duplicate inbox row (idempotent consumer).
  string event_id = 8;

  // PROVENANCE — the EventEnvelope.type, e.g. "fp.pipelines.failed". This is the
  // exact value the matching engine pattern-matched against. Surfaced so the UI
  // can group/filter ("show me all drift alerts").
  string event_type = 9;

  // PROVENANCE — the producing service ("pipeline", "billing", "model-monitor").
  // From EventEnvelope.source. Useful for filtering and for support triage.
  string source_service = 10;

  // When the notification was created (i.e. when the matching event was
  // processed). Server clock. Immutable.
  google.protobuf.Timestamp created_at = 11;

  // When the user marked it read (unset while unread). Server clock.
  google.protobuf.Timestamp read_at = 12;
}

// ============================================================================
// DeliveryAttempt
// ============================================================================
//
// WHY a separate message from Notification: one Notification fans out to N
// channels, and each channel can be retried K times. Flattening attempt detail
// into Notification would lose that structure. DeliveryAttempt is the typed view
// of one row in the `delivery_log` table — the audit trail of "did it actually
// go out, and if not, why".
//
// This is what makes failures debuggable: a webhook that returned 503 three
// times then opened the circuit breaker leaves three RETRYING/FAILED attempts
// with the response codes recorded. (Returned by GetNotification, which includes
// the per-channel attempt history.)
//
// SECURITY: response_code/error_message describe OUR delivery outcome, not the
// downstream's secrets. We deliberately do NOT echo the target URL or any auth
// header here — only enough to debug delivery health.
// ============================================================================
message DeliveryAttempt {
  // Which transport this attempt used.
  NotificationChannel channel = 1;

  // Outcome of this attempt (see DeliveryStatus).
  DeliveryStatus status = 2;

  // 1-based attempt number within the retry budget (e.g. 1, 2, 3 for the
  // 3-attempt exponential-backoff policy in the plan). 0 if not yet attempted.
  int32 attempt = 3;

  // For HTTP-based channels (WEBHOOK/SLACK): the response status code, e.g. 200,
  // 503. 0 for non-HTTP channels or when no response was received (timeout).
  int32 response_code = 4;

  // Human-readable failure detail for logs/debugging (e.g. "connection refused",
  // "circuit breaker open"). Empty on success. NOT for end-user display.
  string error_message = 5;

  // When this delivery attempt was made. Server clock.
  google.protobuf.Timestamp attempted_at = 6;
}

// ============================================================================
// ChannelPreference
// ============================================================================
//
// WHY: A user's choice for ONE channel — is it enabled, what's the minimum
// severity that should reach it, and the channel-specific config (the webhook
// URL, the Slack URL, the email address). This is the per-channel building block
// of NotificationPreferences.
//
// SECURITY — secrets/PII handling (masking-on-read):
//   The `target` here holds potentially sensitive routing data (a webhook URL
//   may embed a token; an email is PII). The platform MAY return it on
//   GetPreferences for the OWNING user (so they can see/edit their own settings)
//   but it is scoped to that user only and must never appear in another user's
//   responses or in any Notification/DeliveryAttempt. For high-secret deployments
//   the server is free to return a masked target (e.g. "https://hooks.slack…/***")
//   on reads while accepting the full value on UpdatePreferences. We document
//   this rather than hard-code masking so the storage layer owns the policy.
//
// SECURITY — SSRF (the headline risk for THIS service, interview-critical):
//   `target` for WEBHOOK/SLACK is a CLIENT-SUPPLIED URL that the delivery layer
//   will make an outbound HTTP request to. A naive implementation is a textbook
//   Server-Side Request Forgery primitive: a user could point a "webhook" at
//   http://169.254.169.254/ (the cloud metadata endpoint → IAM credential theft),
//   at http://localhost:port internal admin APIs, at an RFC1918 service inside the
//   cluster, or at file://. The CONTRACT therefore REQUIRES the server to validate
//   every webhook/slack target BEFORE storing it (on UpdatePreferences/TestChannel)
//   AND to re-resolve+re-check at delivery time (TOCTOU — DNS can be rebound
//   between store and POST). The mandated validation, enforced server-side:
//     1. Scheme allowlist: https only (http rejected; no file/gopher/ftp/etc).
//     2. Host allowlist for SLACK: must be hooks.slack.com (Slack incoming-webhook
//        host) — a Slack channel cannot point anywhere else.
//     3. DNS resolution + IP DENYLIST for WEBHOOK: reject if the resolved IP is
//        loopback (127/8, ::1), link-local (169.254/16, fe80::/10 — blocks the
//        metadata endpoint), private (10/8, 172.16/12, 192.168/16, fc00::/7),
//        unspecified/multicast/reserved. Resolve and pin the IP, then connect to
//        the PINNED ip (defeats DNS-rebinding TOCTOU).
//     4. No credentials in the userinfo component; cap redirects (or disable them)
//        so a 302 can't bounce the request to a denied address.
//   A target that fails validation is REJECTED at write time (INVALID_ARGUMENT
//   with a field-level ErrorDetail), so a malicious URL never reaches storage.
//   This is documented in the contract — not left to the implementer's memory —
//   precisely because it is the one place this service makes attacker-influenced
//   outbound calls.
// ============================================================================
message ChannelPreference {
  // Which channel this preference configures. Server-validated against the closed
  // NotificationChannel enum; a value the delivery layer can't service is rejected.
  NotificationChannel channel = 1;

  // Master on/off for this channel. Disabled channels are skipped entirely
  // (the corresponding DeliveryAttempt is recorded as SUPPRESSED, not FAILED).
  bool enabled = 2;

  // Minimum severity that should be delivered on this channel. An event below
  // this threshold is SUPPRESSED for this channel. E.g. set EMAIL's threshold to
  // ERROR to avoid being emailed about routine INFO events. UNSPECIFIED means
  // "no floor" (deliver everything this channel is enabled for).
  NotificationSeverity min_severity = 3;

  // Channel-specific routing target. Semantics depend on `channel`:
  //   WEBHOOK/SLACK → the HTTPS URL to POST to.
  //   EMAIL         → the destination email address.
  //   IN_APP        → ignored (the inbox target is the user themselves).
  // SUBJECT TO THE SSRF VALIDATION + masking-on-read rules in the SECURITY notes
  // above. Server-validated on every write; never client-trusted at delivery time.
  string target = 4;
}

// ============================================================================
// NotificationPreferences
// ============================================================================
//
// WHY a single per-user preferences aggregate: a user configures their channels
// together ("enable Slack for errors, email for criticals only"). Returning and
// updating them as one document keeps the API and the UI simple (one settings
// page = one GetPreferences + one UpdatePreferences), and makes the update
// atomic — no partial half-saved state across separate per-channel RPCs.
//
// This aggregate is also WHERE THE CHOREOGRAPHY ROUTING LIVES from the user's
// point of view: the matching engine, on each inbound event, looks up the
// recipient's preferences to decide which channels fire and at what severity
// floor. (The mapping from event type → recipient set is the platform's concern;
// preferences answer "given that this user is a recipient, how do they want it?")
// ============================================================================
message NotificationPreferences {
  // The user these preferences belong to. Server-set from the authenticated
  // caller on read/write — NEVER taken from the request body (prevents one user
  // from editing another's preferences via mass-assignment).
  string user_id = 1;

  // Per-channel settings. Typically one entry per NotificationChannel the user
  // has configured. IN_APP is implicitly always-on even if absent here.
  repeated ChannelPreference channels = 2;

  // Optional event-type patterns the user wants to MUTE entirely, across all
  // channels. Same wildcard grammar as the matching engine (e.g. "fp.inference.*"
  // to silence all inference chatter). An empty list means "mute nothing".
  // WHY here and not a separate RPC: muting is just another preference; keeping
  // it in the aggregate preserves the atomic single-document update.
  repeated string muted_event_patterns = 3;

  // When these preferences were last updated. Server clock. Lets the UI show
  // "last changed" and supports optimistic-concurrency checks if added later.
  google.protobuf.Timestamp updated_at = 4;
}

// ============================================================================
// EVENT PAYLOADS — NOW CANONICAL (forgepoint.events.v1), NOT redefined here
// ============================================================================
//
// WHY THESE MOVED OUT OF THIS FILE (the alignment fix):
//   The platform's EventEnvelope (common.proto) carries its payload as a
//   google.protobuf.Any. Each service originally defined its OWN event-payload
//   messages inline — and an adversarial review found those ad-hoc definitions
//   drifted from each other (two services defined competing "an inference
//   happened" events, the deploy-lifecycle events were undefined, a feature-write
//   event had two different names on producer vs consumer). The fix is ONE source
//   of truth: forgepoint.events.v1 (see proto/forgepoint/events/v1/events.proto).
//   This service therefore DELETED its inline NotificationDeliveredEvent and
//   NotificationFailedEvent and now publishes the canonical messages instead:
//
//     fp.notifications.delivered → forgepoint.events.v1.NotificationDelivered
//     fp.notifications.failed    → forgepoint.events.v1.NotificationFailed
//
//   The handler marshals one of those eventsv1 messages into the EventEnvelope's
//   Any at publish time. The fields are unchanged in spirit (notification_id,
//   recipient_user_id, channel, event_type, outcome, timestamp) — they simply
//   live in the shared contract now, so a consumer (Experiment Tracker delivery
//   health, on-call escalation) depends only on eventsv1 + common, never on this
//   service's API proto. ENUM MAPPING: notification.v1.NotificationChannel maps
//   1:1 to events.v1.NotificationChannel (byte-identical values:
//   UNSPECIFIED=0, IN_APP=1, WEBHOOK=2, SLACK=3, EMAIL=4); the handler converts at
//   the publish boundary — the few mechanical lines that are the price of keeping
//   the event schema decoupled from the API schema.
//
// CHOREOGRAPHY — WHY THERE ARE NO CONSUMER-SIDE PAYLOAD TYPES:
//   This service CONSUMES the entire firehose (fp.> on NATS JetStream) but treats
//   every inbound event OPAQUELY: it pattern-matches on EventEnvelope.type and
//   forwards EventEnvelope.data as the notification payload WITHOUT decoding it.
//   So there are deliberately NO consumer-side payload messages anywhere — not
//   inline, not imported. Defining/decoding them would couple us to producers'
//   schemas and destroy the "zero knowledge of what events mean" property that
//   makes adding a new event type a zero-code-change operation here. That opacity
//   is the entire payoff of choreography (interview-critical: it's WHY a new
//   producer needs no change in this service — a user just writes a rule pattern).
//
// KEEP EVENTS SMALL & STABLE: the emitted delivery events carry identifiers +
// outcome, not the full rendered body. Consumers that want detail correlate by
// notification_id back into this service's read model.
// ============================================================================

// ============================================================================
// REQUEST / RESPONSE MESSAGES
// ============================================================================

// ============================================================================
// ListNotifications
// ============================================================================

// ListNotificationsRequest fetches the authenticated caller's inbox page.
// WHY there is no `user_id` field: the inbox is ALWAYS scoped to the caller,
// resolved from TokenClaims by the auth interceptor. Accepting a user_id here
// would be a mass-assignment / IDOR hole (one user reading another's inbox), so
// it is deliberately absent. Admin "read any inbox" tooling, if ever needed,
// would be a separate explicitly-authorized RPC — not a field on this one.
message ListNotificationsRequest {
  // Optional: if true, return only unread notifications. Default false = all.
  bool unread_only = 1;

  // Optional: return only notifications at or above this severity. UNSPECIFIED
  // = no severity floor.
  NotificationSeverity min_severity = 2;

  // Optional: restrict to a single event type (exact match, e.g.
  // "fp.pipelines.failed"). Empty = all event types.
  string event_type_filter = 3;

  // Cursor-based pagination (shared shape, see common.proto).
  // Server caps page_size at 100 and defaults it to 20 (documented in
  // common.proto). The server enforces the cap regardless of what the client
  // sends, so a client cannot demand an unbounded page.
  forgepoint.common.v1.PaginationRequest pagination = 4;
}

// ListNotificationsResponse returns one page of the caller's inbox, newest first.
message ListNotificationsResponse {
  // The page of notifications. Ordered by created_at descending (newest first)
  // so the most recent alerts are at the top of the inbox.
  repeated Notification notifications = 1;

  // Pagination metadata: next_page_token + total_count. See common.proto.
  forgepoint.common.v1.PaginationResponse pagination = 2;

  // Convenience: total UNREAD count across the whole inbox (not just this page),
  // for the UI's badge. Cheap to compute with an indexed COUNT and saves the UI
  // a second round-trip. -1 if not computed.
  int32 unread_count = 3;
}

// ============================================================================
// GetNotification
// ============================================================================

// GetNotificationRequest fetches one inbox entry in full, including its
// per-channel delivery attempt history (see GetNotificationResponse).
message GetNotificationRequest {
  // The Notification.id to fetch. The server verifies the notification belongs
  // to the authenticated caller before returning it (returns NOT_FOUND, not
  // PERMISSION_DENIED, for someone else's id — avoids leaking existence).
  string id = 1;
}

// GetNotificationResponse wraps the Notification plus its delivery audit trail.
// WHY include delivery_attempts here but not on the list view: the attempt
// history is the "detail view" payload — heavier, and only wanted when you open
// a single notification to ask "did my Slack alert actually go out?". Keeping it
// off the list keeps list responses small.
message GetNotificationResponse {
  // The requested notification.
  Notification notification = 1;

  // Per-channel delivery attempts for this notification (the delivery_log rows),
  // ordered oldest attempt first. Empty for purely IN_APP notifications that
  // required no external delivery.
  repeated DeliveryAttempt delivery_attempts = 2;
}

// ============================================================================
// MarkRead
// ============================================================================

// MarkReadRequest marks one or more of the caller's notifications as read.
// WHY accept a repeated id (batch) rather than a single id: the UI almost always
// marks read in bulk ("mark all on screen as read" / "mark this thread read"),
// and a batch RPC avoids N round-trips. A single-id mark is just a list of one.
message MarkReadRequest {
  // The notification ids to mark read. All must belong to the caller; ids that
  // don't (or don't exist) are ignored rather than failing the whole batch, so a
  // partially-stale client list still makes progress. Max 1000 ids per call
  // (server-enforced) to bound the write.
  repeated string ids = 1;

  // Optional escape hatch: if true, mark the caller's ENTIRE inbox read and
  // ignore `ids`. WHY a flag rather than a separate MarkAllRead RPC: it's the
  // same operation with a different selector; one RPC keeps the surface small.
  bool mark_all = 2;
}

// MarkReadResponse reports how many notifications were actually flipped to read.
// WHY return a count instead of an empty response: the UI uses it to update the
// unread badge without a follow-up List call, and it confirms how many of a
// batch were valid (since unknown/foreign ids are silently skipped).
message MarkReadResponse {
  // Number of notifications transitioned from unread → read by this call.
  int32 marked_count = 1;

  // The caller's remaining unread count after this operation (for the badge).
  int32 unread_count = 2;
}

// ============================================================================
// GetPreferences
// ============================================================================

// GetPreferencesRequest fetches the authenticated caller's notification
// preferences. WHY no user_id field: same authority rule as the inbox — prefs
// are always the caller's own, resolved from TokenClaims. No cross-user reads.
message GetPreferencesRequest {}

// GetPreferencesResponse wraps the caller's preferences.
// WHY a wrapper around NotificationPreferences instead of returning it directly:
// Buf STANDARD's RPC_RESPONSE_STANDARD_NAME requires "<Rpc>Response" naming, and
// a wrapper lets us add response-level fields later (e.g. server-default hints,
// or a "preferences have never been set" flag) without touching the shared
// NotificationPreferences domain message.
message GetPreferencesResponse {
  // The caller's current preferences. If the user has never configured any, the
  // server returns sensible defaults (IN_APP enabled, all else disabled) rather
  // than an error, so the settings UI always has something to render.
  NotificationPreferences preferences = 1;
}

// ============================================================================
// UpdatePreferences
// ============================================================================

// UpdatePreferencesRequest replaces the caller's preferences.
// WHY full-document replace (PUT semantics) rather than a partial patch: the
// settings UI loads the whole preferences document, the user edits it, and saves
// it back — sending the full desired state is the simplest correct model and
// avoids ambiguous "is an absent channel a delete or untouched?" patch
// semantics. If granular patching is ever needed, a field_mask can be added.
//
// SECURITY: the request carries the desired ChannelPreference set but NOT a
// user_id — the target user is ALWAYS the authenticated caller (anti
// mass-assignment). updated_at is also ignored if present; the server stamps it.
message UpdatePreferencesRequest {
  // The full desired per-channel preference set. Replaces the stored set
  // wholesale. An omitted channel is treated as "not configured" (i.e. removed),
  // matching PUT semantics. The server validates EVERY target before persisting:
  // email must be well-formed; webhook/slack URLs must pass the full SSRF guard
  // documented on ChannelPreference.target (https-only, Slack-host allowlist,
  // private/link-local/loopback IP denylist with pinned-IP connect). A target
  // that fails validation rejects the whole update with INVALID_ARGUMENT + a
  // field-level ErrorDetail (so a malicious URL never reaches storage), rather
  // than silently dropping one channel.
  repeated ChannelPreference channels = 1;

  // The full desired mute list (event-type patterns). Replaces the stored list.
  // Empty = mute nothing. Server-bounded: at most 100 patterns (a runaway mute
  // list is both a storage-abuse vector and a sign of misuse — real muting needs
  // a handful of patterns, not thousands).
  repeated string muted_event_patterns = 2;

  // Caller-supplied idempotency key (typically a UUID). WHY on a settings write:
  // a flaky client that retries an UpdatePreferences after a timeout must not
  // risk a confusing double-apply or clobber a concurrent edit. Same key →
  // server returns the result of the first apply instead of re-applying. This is
  // the Stripe idempotency-key pattern; here it mainly guards retry safety on a
  // last-write-wins document. Optional but recommended for automated callers.
  string idempotency_key = 3;
}

// UpdatePreferencesResponse returns the stored preferences after the update, so
// the client can confirm exactly what was persisted (including the server's
// fresh updated_at and any normalization the server applied to targets).
message UpdatePreferencesResponse {
  // The preferences as now stored. Reflects server normalization/defaults.
  NotificationPreferences preferences = 1;
}

// ============================================================================
// ListDeliveryAttempts (the delivery-log audit view)
// ============================================================================
//
// WHY THIS RPC EXISTS: the design doc + implementation plan (Phase 9) call for a
// `GetDeliveryLog` surface — the operator/owner view over the `delivery_log`
// table: "did my alerts actually go out, and which failed?". GetNotification
// returns the attempts for ONE notification; this is the cross-notification
// query the plan asks for ("show me all my FAILED webhook deliveries in the last
// hour"). It is the delivery-health counterpart to the inbox list. Folding it
// into GetNotification would not answer the fleet question, so it is its own RPC.
//
// SECURITY / AUTHORITY: scoped to the AUTHENTICATED caller's own notifications —
// there is no recipient_user_id field (same anti-IDOR rule as the inbox). The
// status/channel filters are query predicates over the caller's own rows only.
message ListDeliveryAttemptsRequest {
  // Optional: restrict to attempts on a single channel (e.g. only WEBHOOK).
  // UNSPECIFIED = all channels.
  NotificationChannel channel = 1;

  // Optional: restrict to a single outcome (e.g. only FAILED, to triage broken
  // endpoints). UNSPECIFIED = all statuses.
  DeliveryStatus status = 2;

  // Optional: restrict to attempts for one of the caller's notifications. Empty =
  // across all of the caller's notifications. If set, the server verifies the
  // notification belongs to the caller (NOT_FOUND otherwise — no existence leak).
  string notification_id = 3;

  // Cursor-based pagination (shared shape, see common.proto). Server caps
  // page_size at 100 and defaults it to 20, enforced server-side regardless of
  // the requested value — a client cannot demand an unbounded page.
  forgepoint.common.v1.PaginationRequest pagination = 4;
}

// ListDeliveryAttemptsResponse returns one page of the caller's delivery log,
// newest attempt first. Each row carries enough to debug delivery health without
// echoing the target URL or any secret (see DeliveryAttempt's SECURITY note).
message ListDeliveryAttemptsResponse {
  // The page of delivery attempts (the delivery_log rows), newest first.
  repeated DeliveryAttempt attempts = 1;

  // Which notification each attempt belongs to, positionally aligned 1:1 with
  // `attempts` (attempts[i] is for notification_ids[i]). WHY a parallel slice
  // rather than embedding the id on DeliveryAttempt: DeliveryAttempt is also
  // returned by GetNotification where the notification id is already known/implied,
  // so we keep the id off the attempt message and surface it here where the fleet
  // view needs it. Lets the UI link each row back to its inbox entry.
  repeated string notification_ids = 2;

  // Pagination metadata: next_page_token + total_count. See common.proto.
  forgepoint.common.v1.PaginationResponse pagination = 3;
}

// ============================================================================
// TestChannel (owner self-test — does NOT violate choreography)
// ============================================================================
//
// WHY THIS RPC EXISTS: configuring a webhook/Slack URL is error-prone (wrong URL,
// expired token, firewall). Every real notification product (PagerDuty, GitHub,
// Grafana) lets you "send a test" to verify a channel works before relying on it.
//
// WHY IT DOESN'T BREAK CHOREOGRAPHY: choreography forbids a PRODUCER addressing
// us to make us notify a THIRD party. This is the opposite: the OWNER asks us to
// deliver a synthetic test to THEIR OWN configured channel. No platform producer
// is involved, no other user is targeted, and it drives no business workflow. It
// is a control-plane self-check, exactly like GetPreferences — so it belongs on
// the gRPC surface, not the event bus.
//
// SECURITY: the test is delivered to the channel CONFIG of the AUTHENTICATED
// caller (resolved from their stored preferences / TokenClaims) — the request
// does NOT carry a free-form target, so it cannot be turned into an SSRF probe of
// arbitrary URLs. The stored target was already SSRF-validated on write, and the
// delivery path re-validates with a pinned-IP connect (the same guard as a real
// delivery). The caller can only test channels they own.
message TestChannelRequest {
  // Which of the caller's configured channels to send the synthetic test over.
  // Must correspond to an enabled ChannelPreference the caller owns (else
  // FAILED_PRECONDITION). IN_APP testing is a no-op success (the inbox is always
  // reachable). NEVER carries a URL — the destination is the stored, already-
  // validated target, so this RPC is not an SSRF vector.
  NotificationChannel channel = 1;

  // Caller-supplied idempotency key (typically a UUID). WHY on a test-send: a
  // client that retries after a timeout must not double-fire the test (spamming
  // the user's Slack). Same key → the server returns the first attempt's result
  // instead of sending again. The Stripe idempotency-key pattern. Optional but
  // recommended for automated callers / CLI retries.
  string idempotency_key = 2;
}

// TestChannelResponse reports the synthetic delivery's outcome so the settings UI
// can show "✓ delivered" / "✗ 401 from Slack" inline next to the channel.
message TestChannelResponse {
  // Outcome of the test delivery (DELIVERED on success; FAILED with detail below
  // on error; SUPPRESSED if the channel was disabled).
  DeliveryStatus status = 1;

  // For HTTP channels: the response status code observed (0 if none / non-HTTP).
  int32 response_code = 2;

  // Human-readable failure detail on error (e.g. "401 from Slack",
  // "connection refused", "target failed SSRF revalidation"). Empty on success.
  // Mirrors DeliveryAttempt.error_message — for the operator, not end-user copy.
  string error_message = 3;
}

// ============================================================================
// NOTIFICATION SERVICE
// ============================================================================
//
// WHY a single small NotificationService: as explained at the top, this is the
// CONTROL PLANE only. The real engine — subscribe to `fp.>`, match preferences,
// deliver with retries + circuit breaker, write the delivery log — runs on the
// NATS path and exposes NOTHING synchronous. There is intentionally no
// "send"/"trigger" RPC: a producer calling us would break choreography.
//
// RPC CATEGORIES:
//   INBOX (read model):   ListNotifications, GetNotification, MarkRead
//   DELIVERY LOG (audit): ListDeliveryAttempts
//   PREFERENCES (config): GetPreferences, UpdatePreferences, TestChannel
//   (TestChannel is a control-plane self-check, not a "send" RPC — see its doc.)
//
// WHY NO STREAMING RPC HERE (a deliberate choice, interview-relevant):
//   A live "watch my inbox" stream is tempting, but the natural realtime path
//   for notifications is the very NATS stream this service already consumes and
//   the fan-out channels (web push, Slack) it already delivers over. The web UI
//   gets realtime via the BFF bridging `fp.notifications.>` to Server-Sent
//   Events — NOT via a gRPC server-stream on this service. So the gRPC surface
//   stays request/response (inbox + settings), and we avoid maintaining
//   long-lived per-client streams on a service whose whole point is to be a
//   stateless event reactor. Contrast: the Pipeline Orchestrator DOES expose a
//   WatchExecution server-stream, because there the authoritative state lives in
//   that service and a client genuinely needs to follow one execution's lifecycle.
//
// IDEMPOTENCY (interview-critical, on BOTH paths):
//   - Async consumer: events can be redelivered (NATS at-least-once). The
//     consumer dedupes on EventEnvelope.id (carried into Notification.event_id)
//     per recipient, so a redelivered event never creates a duplicate inbox row
//     or a duplicate delivery. This is the "idempotent consumer" platform rule.
//   - Sync mutation: UpdatePreferences takes an idempotency_key so client retries
//     are safe. MarkRead is naturally idempotent (read→read is a no-op), so it
//     needs no key.
// ============================================================================
service NotificationService {
  // ListNotifications returns a paginated page of the AUTHENTICATED caller's
  // inbox (newest first), with optional unread/severity/event-type filters and
  // an unread_count for the UI badge. Scoped to the caller — never another user.
  rpc ListNotifications(ListNotificationsRequest) returns (ListNotificationsResponse);

  // GetNotification fetches one of the caller's notifications in full, including
  // its per-channel delivery attempt history (the delivery_log). Returns
  // NOT_FOUND for ids that don't exist OR belong to another user (so existence
  // of another user's notification isn't leaked).
  rpc GetNotification(GetNotificationRequest) returns (GetNotificationResponse);

  // MarkRead marks one, many, or all of the caller's notifications as read and
  // returns the new unread count. Naturally idempotent (marking a read item read
  // is a no-op), so no idempotency key is required. Foreign/unknown ids are
  // skipped rather than failing the batch.
  rpc MarkRead(MarkReadRequest) returns (MarkReadResponse);

  // ListDeliveryAttempts returns a paginated page of the caller's delivery log
  // (the GetDeliveryLog surface the plan calls for) — the cross-notification view
  // for "did my alerts go out, which failed?", with optional channel/status/
  // notification filters. Scoped to the caller; secrets/targets are never echoed.
  rpc ListDeliveryAttempts(ListDeliveryAttemptsRequest) returns (ListDeliveryAttemptsResponse);

  // GetPreferences returns the caller's notification preferences (per-channel
  // settings + mute patterns), falling back to sensible defaults if the user has
  // never configured any. Always the caller's own preferences.
  rpc GetPreferences(GetPreferencesRequest) returns (GetPreferencesResponse);

  // UpdatePreferences replaces the caller's preferences wholesale (PUT
  // semantics) and returns the stored result. Accepts an optional idempotency
  // key so retries are safe. The target user is always the caller — the request
  // body cannot reassign ownership. Every webhook/slack target is SSRF-validated
  // server-side before persisting (see ChannelPreference.target).
  rpc UpdatePreferences(UpdatePreferencesRequest) returns (UpdatePreferencesResponse);

  // TestChannel sends a synthetic test notification to one of the CALLER'S OWN
  // configured channels so the settings UI can confirm it works. This is a
  // control-plane self-check (the owner testing their own delivery config), NOT a
  // producer-facing "send" RPC — it carries no target URL and addresses no other
  // user, so it neither violates choreography nor opens an SSRF vector. Accepts an
  // idempotency key so a retry doesn't double-fire the test.
  rpc TestChannel(TestChannelRequest) returns (TestChannelResponse);
}
